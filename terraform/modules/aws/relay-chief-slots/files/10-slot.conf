# Slot additions to the reference relay-chief.service, which stays unmodified.
# Without the mount requirement a detached data volume would let the cycle start
# an empty ledger on the root disk and repeat dispatches it has already made.
#
# Requires= also propagates a restart of the credentials unit into a running
# cycle, and a cycle killed mid-send leaves that task uncertain. Stop the timer
# and wait for the cycle before restarting the credentials unit.
[Unit]
Requires=relay-chief-credentials.service
After=relay-chief-credentials.service
RequiresMountsFor=/var/lib/relay-chief
