# Render-proof only: syntactically valid stand-ins for the <...> markers in
# values-eks-actors.yaml. bench/relaycast/scripts/render-overrides.sh replaces
# them with the real sandbox outputs before install. No credentials.
durable-actors:
  publicUrl: https://actors.bench.invalid
  placement: {zone: us-west-2a}
  storage:
    bucket: relaycast-actors-bench-state
    s3:
      region: us-west-2
      actorRoleArn: arn:aws:iam::805532413586:role/relaycast-actors-bench/actor-storage
relaycast:
  baseUrl: https://cast.bench.invalid
  existingSecret: relaycast-secrets
  runtime:
    durableActors:
      deployer:
        artifactBucket: relaycast-actors-bench-state
        artifactStore: {s3: {region: us-west-2}}
      fileStore:
        bucket: relaycast-actors-bench-files
        s3: {region: us-west-2}
relayfile:
  runtime:
    durableActors:
      deployer:
        artifactBucket: relaycast-actors-bench-state
        artifactStore: {s3: {region: us-west-2}}
      blobStore:
        bucket: relaycast-actors-bench-files
        s3: {region: us-west-2}
