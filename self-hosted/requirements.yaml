    description: One existing Secret with DATABASE_URL (also used by the migrate Job), RELAYCONTROL_INTROSPECT_SECRET and RELAYCHIEF_CONTROL_ADMIN_TOKEN (both 32 or more characters; the server refuses to start otherwise). The chart creates no Secret and takes no Secret values, so a render cannot check their presence or length.
    chart: relaychief-control
    values: [existingSecret, "secretKeys.*"]
    env: [DATABASE_URL, RELAYCONTROL_INTROSPECT_SECRET, RELAYCHIEF_CONTROL_ADMIN_TOKEN]
    profiles: [relaychief-control]
    status: shipped
    provided_by: operator
    secrets:
      - name: "<existingSecret>"
        keys:
          - { key: DATABASE_URL, key_path: secretKeys.databaseUrl }
          - { key: RELAYCONTROL_INTROSPECT_SECRET, key_path: secretKeys.introspectSecret }
          - { key: RELAYCHIEF_CONTROL_ADMIN_TOKEN, key_path: secretKeys.adminToken }
          - { key: "<operator-chosen, e.g. NANGO_SECRET_KEY>", key_path: secretKeys.nangoSecretKey, optional: "unset leaves Nango off and creating a chief answers 503; required with config.nangoHost" }
          - { key: "<operator-chosen, e.g. RELAYCHIEF_CONTROL_RELAY_SECRET>", key_path: secretKeys.relaySecret, optional: "relay identity; set with encryptionKeyId and encryptionKey or not at all" }
          - { key: "<operator-chosen, e.g. RELAYCHIEF_CONTROL_ENCRYPTION_KEY_ID>", key_path: secretKeys.encryptionKeyId, optional: "relay identity; set with relaySecret and encryptionKey or not at all" }
          - { key: "<operator-chosen, e.g. RELAYCHIEF_CONTROL_ENCRYPTION_KEY>", key_path: secretKeys.encryptionKey, optional: "relay identity; set with relaySecret and encryptionKeyId or not at all" }
    verify: helm template fails with "existingSecret is required" when it is unset; the pod starts without a CreateContainerConfigError and /readyz answers 200
    sources:
      - "charts/relaychief-control/values.yaml"
      - "charts/relaychief-control/templates/_helpers.tpl"

  - id: opt.relaychief-control.nango
    kind: option
    title: Relay Chief control Nango host and browser origins
    description: NANGO_HOST with secretKeys.nangoSecretKey selects a self-hosted Nango; the key alone uses Nango's hosted API. NANGO_HOST without the key makes the server throw at startup, so the chart refuses to render it. RELAYCHIEF_CONTROL_BROWSER_ORIGINS is a comma-separated list of http(s) origins allowed through the CSRF check.
    chart: relaychief-control
    values: [config.nangoHost, config.browserOrigins]
    env: [NANGO_HOST, NANGO_SECRET_KEY, RELAYCHIEF_CONTROL_BROWSER_ORIGINS]
    profiles: [relaychief-control]
