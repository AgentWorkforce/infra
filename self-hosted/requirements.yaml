    env: [SELFHOST_HISTORY_UPLOAD_DIRECT, SELFHOST_HISTORY_UPLOAD_ALLOWLIST, SELFHOST_HISTORY_UPLOAD_BUCKET, SELFHOST_HISTORY_UPLOAD_REGION, SELFHOST_HISTORY_UPLOAD_KEY_ROOT, SELFHOST_HISTORY_UPLOAD_ROLE_ARN, SELFHOST_HISTORY_UPLOAD_KMS_KEY_ARN, SELFHOST_HISTORY_UPLOAD_MAX_OBJECT_BYTES, SELFHOST_HISTORY_UPLOAD_WITNESS_KEY_FILE]
