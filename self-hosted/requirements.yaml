      - SELFHOST_BOOTSTRAP_TOKEN_FILE
      - SELFHOST_ENCRYPTION_KEY_FILE
      - SELFHOST_PUBLIC_URL
      - RELAYAUTH_URL
      - RELAYCAST_URL
      - RELAYCAST_PUBLIC_URL
      - RELAYHISTORY_URL
      - RELAYHISTORY_PUBLIC_URL
    profiles: [relay-control]
    status: shipped
    provided_by: operator
    secrets:
      - name: "<existingSecret>"
        name_paths: [existingSecret]
        keys:
          - { key: database-url, key_path: secretKeys.databaseUrl }
