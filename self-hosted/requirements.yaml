        note: kubernetes.io/tls
      - name: "<imagePullSecrets[].name>"
        note: optional registry pull Secret
    verify: render contains the configured dashboard runtime environment and routes /cloud/api to relay-cloud-api
    sources:
      - "charts/relay-dashboard/templates/ingress.yaml"
      - "ci/agent-relay/render.sh"

  - id: opt.relay-dashboard.customer-profile
    kind: option
    title: Dashboard customer profile (enterprise branding)
    description: |
      customerProfile rebrands the dashboard without a new image: product
      name and title, light and dark logos, favicon, accent and primary
      button colors, a support link and the "Powered by Agent Relay" line.
      The chart renders the map as JSON into DASHBOARD_CUSTOMER_PROFILE and
