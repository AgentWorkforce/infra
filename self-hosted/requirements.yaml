    sources: [charts/relay-webapp/templates/deployment.yaml, charts/relay-webapp/values.yaml, charts/relay-webapp/README.md]

  - id: opt.sessions-pipeline.native-routing
    kind: option
    title: Native History public route
    description: |
      Default-off managed Ingress selecting the native reader and ingest edge
      on one exact public origin. Independent issuer mode exposes only /v1,
