    env: [DURABLE_ACTORS_PUBLIC_URL, DURABLE_ACTORS_CONTROL_PLANE_URL]
    profiles: [durable-actors, agent-relay-durable-actors, agent-relay-eks-durable-actors]
    status: shipped
    provided_by: operator
    secrets:
      - name: "<ingress.tlsSecret>"
        note: kubernetes.io/tls, only with the chart's own ingress
    verify: curl -fsS <publicUrl>/healthz
    sources:
      - "charts/durable-actors/templates/control-plane.yaml:97"
      - "charts/agent-relay/templates/gke-ingress.yaml:50"

  - id: opt.agent-relay.durable-actors
