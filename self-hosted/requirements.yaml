        note: or the same key in the ConfigMap named by postgresCa.configMap
    verify: kubectl wait --for=condition=complete job -l app.kubernetes.io/name=relaycast-migrate; curl <baseUrl>/health
    sources:
      - "charts/relaycast/values.yaml:29"
      - "charts/relaycast/templates/_postgres.tpl:1"
      - "charts/relaycast/templates/postgres-migrate-job.yaml:1"

  - id: req.relaycast.durable-actors-secrets
    kind: requirement
    title: Relaycast actor-mode Secrets (gateway invocation key, file signing, actor env, admin key)
    description: |
      existingSecret gains the file-signing secret (RELAYCAST_FILE_SIGNING_SECRET)
      and must carry the credential keyring and internal secret. The gateway's
      DURABLE_ACTORS_SECRET comes from its own invocationSecret (scope admin = a copy
      of the durable-actors api-key until upstream ships an invoke-only key; never the
      admin key Secret itself). The deployer alone reads adminKeySecret. Actor env
      Secrets (RELAYCAST_PUBLIC_URL = baseUrl, RELAYCAST_FILE_SIGNING_SECRET,
      RELAYCAST_INTERNAL_SECRET, optional engine settings) live in the durable-actors
      SANDBOX namespace, labelled terse.ai/customer-secret=true, and are passed as
      DURABLE_ACTORS_SECRET_REFS. devRuntime.secretKey is the dev sidecar's key.
      deployer.artifactStore.driver s3 uploads bundles to S3 (DURABLE_ACTORS_ARTIFACT_STORE,
      DURABLE_ACTORS_S3_*; credentials from the AWS SDK default chain, e.g. EKS Pod Identity).
    chart: relaycast
    values: [secretKeys.workspaceBootstrapSecret, runtime.durableActors.fileSigningSecretKey, runtime.durableActors.invocationSecret.*, runtime.durableActors.adminKeySecret.*, runtime.durableActors.actorEnvSecrets, runtime.durableActors.devRuntime.secretKey, runtime.durableActors.deployer.*]
    env: [RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET, DURABLE_ACTORS_SECRET, RELAYCAST_FILE_SIGNING_SECRET, DURABLE_ACTORS_ARTIFACT_BUCKET, DURABLE_ACTORS_SECRET_REFS, DURABLE_ACTORS_ORGANIZATION_ID, DURABLE_ACTORS_ARTIFACT_STORE, DURABLE_ACTORS_S3_REGION, DURABLE_ACTORS_S3_ENDPOINT, DURABLE_ACTORS_S3_FORCE_PATH_STYLE]
    profiles: [relaycast-durable-actors]
    status: shipped
    provided_by: operator
    secrets:
      - name: "<existingSecret>"
        name_paths: [existingSecret, relaycast.existingSecret]
        keys:
          - { key: file-signing-secret, key_path: runtime.durableActors.fileSigningSecretKey }
          - { key: "<operator-chosen>", key_path: secretKeys.workspaceBootstrapSecret, optional: "keyed actor workspace creates; same bytes as the actor environment" }
          - { key: credential-keyring, key_path: secretKeys.credentialKeyring }
      - name: "<runtime.durableActors.invocationSecret.name>"
        keys:
          - { key: durable-actors-invoke-key, key_path: runtime.durableActors.invocationSecret.key }
      - name: actors-credentials
        name_paths: [runtime.durableActors.adminKeySecret.name]
        keys:
          - { key: api-key, key_path: runtime.durableActors.adminKeySecret.key }
      - name: "<runtime.durableActors.actorEnvSecrets[], e.g. relaycast-actor-env, in the sandbox namespace>"
        keys:
          - { key: RELAYCAST_PUBLIC_URL }
          - { key: RELAYCAST_FILE_SIGNING_SECRET }
          - { key: RELAYCAST_INTERNAL_SECRET }
          - { key: RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET, optional: "same bytes as secretKeys.workspaceBootstrapSecret" }
          - { key: RELAYCAST_WORKSPACE_BOOTSTRAP_PROOF_REQUIRED, optional: "true or false; equal to bootstrapProofRequired" }
        note: label terse.ai/customer-secret=true; keys become actor env
      - name: "<existingSecret, devRuntime only>"
        keys:
          - { key: durable-actors-dev-secret, key_path: runtime.durableActors.devRuntime.secretKey }
    verify: helm template fails with "invocationSecret must not be the admin key Secret" or "actorEnvSecrets is required" on miswiring; the deploy Job completes
    sources:
      - "charts/relaycast/templates/_actors.tpl:78"
      - "charts/relaycast/templates/_actors.tpl:206"

