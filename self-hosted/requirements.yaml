    choices:
      - { value: unset }
      - { value: hosted }
      - { value: self-hosted }
    verify: helm template fails with "requires secretKeys.nangoSecretKey" when config.nangoHost is set without the key
    sources:
      - "charts/relaychief-control/values.yaml"
      - "charts/relaychief-control/templates/_helpers.tpl"

  - id: opt.relaychief-control.relay-identity
    kind: option
    title: Relay Chief control platform-issued Relay identities
    description: With all three Secret keys set, binding a chief without relayCallerId registers it as a Relay agent through relay-control and stores its token encrypted with AES-256-GCM; unset, that bind answers 503. RELAYCHIEF_CONTROL_RELAY_SECRET (32 or more characters) must equal the value relay-control reads for chief registration, RELAYCHIEF_CONTROL_ENCRYPTION_KEY_ID is 1-64 characters of [A-Za-z0-9_-], and RELAYCHIEF_CONTROL_ENCRYPTION_KEY is 64 hex characters. The server refuses to start with only some of them, so the chart refuses to render a partial set; a render cannot check their contents. Needs an image built from relaychief-control PR 5 or later, whose migration 0003 the existing migrate Job applies.
    chart: relaychief-control
    values: [secretKeys.relaySecret, secretKeys.encryptionKeyId, secretKeys.encryptionKey]
    env: [RELAYCHIEF_CONTROL_RELAY_SECRET, RELAYCHIEF_CONTROL_ENCRYPTION_KEY_ID, RELAYCHIEF_CONTROL_ENCRYPTION_KEY]
    profiles: [relaychief-control]
    status: shipped
    provided_by: operator
    default: unset
    choices:
      - { value: unset }
      - { value: set }
    verify: helm template fails with "must be set together or not at all" when only some of the three are set; with all three, the Deployment (not the migrate Job) reads each from existingSecret
    sources:
      - "charts/relaychief-control/values.yaml"
      - "charts/relaychief-control/templates/_helpers.tpl"

  - id: opt.relaychief-control.exposure
    kind: option
    title: Relay Chief control Ingress and NetworkPolicy
    description: The Ingress is off by default and routes only /chief/v1 (Prefix) when on. ingress.extraPaths can add the tenant routes under /api/v1; a / rule is refused. networkPolicy.ingressFrom must admit the load balancer (an ALB in IP target mode connects from its subnets, as ipBlock peers), and networkPolicy.additionalEgress must admit the database unless allowAllEgress is true.
    chart: relaychief-control
    values: ["ingress.*", "networkPolicy.*"]
    profiles: [relaychief-control]
    status: shipped
    provided_by: operator
    default: disabled
    choices:
      - { value: disabled }
      - { value: enabled }
    verify: kubectl get ingress shows only the /chief/v1 path unless ingress.extraPaths adds more, and the load balancer's targets report healthy
    sources:
      - "charts/relaychief-control/templates/ingress.yaml"
      - "charts/relaychief-control/templates/networkpolicy.yaml"

