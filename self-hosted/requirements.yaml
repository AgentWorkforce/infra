    choices: [{ value: disabled }, { value: enabled }]
    secrets:
      - name: "<existing public History TLS Secret>"
        name_paths: [nativeRouting.tls, nativeRouting.tls.existingSecret]
        keys: []
    verify: Render only qualified exact paths and Service ports; reject missing TLS/origin, mixed authorities and public internal issuer exposure.
    sources: [charts/sessions-pipeline/templates/native-routing.yaml, charts/sessions-pipeline/templates/_native-routing.tpl]

