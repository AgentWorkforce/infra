      built_by: publish-image run 42462161615
  releases:
    - id: telemetry-collector-0.1.5
      status: unreleased
      current: true
      charts: { telemetry-collector: 0.1.5 }
      app_versions: { telemetry-collector: d1089f8d05d6b87d642972d4214967f54182b617 }
      notes: 'Accepts the reviewed Relaycast native-workspace observation and installation exception vocabulary. Existing source revisions remain available for rollback. The operator supplies the image and registration.'
    - id: telemetry-collector-0.1.4
      status: shipped
      charts: { telemetry-collector: 0.1.4 }
      app_versions: { telemetry-collector: ccc84b1a64435f18000dda299c64f0e84b3f751d }
      notes: 'Admits the reviewed brief-worker and coordination-overlaps collector vocabulary. Keeps the prior private-file recovery source available for existing installs and rollback. Images and producer registrations remain operator inputs.'
    - id: telemetry-collector-0.1.3
      status: shipped
      charts: { telemetry-collector: 0.1.3 }
      app_versions: { telemetry-collector: d2cb39635bbf163976c354582365b3d97dcd0b56 }
      notes: 'Requires the qualified private-file recovery source; retired source declarations are refused. Restores owned committed segments to 0600 before listening after a remount, preserving bytes. Typed Control and sessions producer registries are available, but the chart selects no images or credentials and enables no producers. Verify signed source/digest and operator storage separately.'
    - id: telemetry-collector-0.1.2
      status: shipped
      charts: { telemetry-collector: 0.1.2 }
      app_versions: { telemetry-collector: 08cf1142303355a73a94dcf605045cdf363e02c5 }
      notes: 'Runs the current public Control collector package under an exclusive kernel file lock and renders numeric limits as decimal strings. Requires independently verified immutable images, TLS, producer credentials and exclusive Pod storage fencing; advisory lock contention does not replace storage fencing. No profile enablement or all-component telemetry coverage is implied.'
    - id: telemetry-collector-0.1.1
      status: shipped
      charts: { telemetry-collector: 0.1.1 }
      notes: 'Refuses relay-control images at render time: they do not contain the collector CLI this chart runs.'
    - id: telemetry-collector-0.1.0
      status: shipped
      charts: { telemetry-collector: 0.1.0 }
      notes: 'Default-off umbrella analytics file collector. Requires accepted immutable collector and TLS-proxy images, producer and TLS Secrets and an exclusive persistent volume. Source rendering does not prove image entrypoint, TLS, durable acknowledgement, power-loss recovery or whole-application analytics coverage. The currently reviewed collector CLI registers relaycontrol events only.'
    - id: session-read-api-0.2.7
      status: unreleased
      current: true
      charts: { session-read-api: 0.2.7 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'When coordinationOverlaps.enabled is selected, renders both READ_API_COORDINATION_OVERLAPS_ENABLED=true and the managed Postgres backend. The standalone leaf default remains off; sessions-pipeline 0.8.21 supplies its own default-on adapter. Requires an independently qualified services image from relayhistory-pipeline fe62ed80 or a reviewed successor, including migration 20261105047000_coordination_fact_readers.'
    - id: session-read-api-0.2.6
      status: planned
      charts: { session-read-api: 0.2.6 }
      notes: 'Superseded before release by 0.2.7. Makes readerMaxRuleset default null, omitting READER_MAX_RULESET so legacy reads remain unchanged.'
    - id: session-read-api-0.2.5
      status: shipped
      charts: { session-read-api: 0.2.5 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'Adds managed readerMaxRuleset (READER_MAX_RULESET), default 8 and restricted to 8, 9 or 10. Raising it requires an independently qualified image containing relayhistory-pipeline #489 at 0ad0813c or a reviewed successor. This reader ceiling neither selects a writer ruleset nor enables a workload.'
    - id: session-read-api-0.2.4
      status: shipped
      charts: { session-read-api: 0.2.4 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'Adds the default-off coordinationOverlaps.enabled switch. It emits READ_API_COORDINATION_OVERLAPS_ENABLED=true only when selected and reserves that env name from extraEnv. No image, workload, Secret, database or migration default changes.'
    - id: session-read-api-0.2.3
      status: shipped
      charts: { session-read-api: 0.2.3 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'Adds managed default-off native collector adapters. Each service uses a component-bound Secret reference, an opaque installation ID, HTTPS and optional public additional CA trust. Preflight/bootstrap has no analytics credentials. No application image default, SQL, admission mode, profile or runtime is changed; a qualified source71801741-or-later image and operator registrations remain required.'
    - id: session-read-api-0.2.2
      status: shipped
      charts: { session-read-api: 0.2.2 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'Admits exactly "*" for directoryWorkspaces with auth.mode=self_issued.'
    - id: session-read-api-0.2.1
      status: planned
      charts: { session-read-api: 0.2.1 }
      images:
        session-read-api: { repository: ghcr.io/agentworkforce/96bulls-services, digest_required: true }
      notes: 'Defaults READ_API_COMPLETE_SINCE to epoch for a new self-host store populated only by its own ingest. Partial legacy imports must retain an explicit real coverage floor matching the indexer. Image, auth, routing and enabled defaults are unchanged; this does not assert coverage for an imported store or qualify a runtime.'
    - id: sessions-pipeline-0.8.22
