  - id: opt.sessions-read-api
    kind: option
    title: Default-off self-host session read API container
    description: |
      The standalone session-read-api chart, carried by sessions-pipeline as the
      default-off sessionReadApi dependency. Requires an explicitly pinned
      compatible image, read-role configuration JSON in a Secret, an explicit
      coverage floor and workspace allowlist, a public token audience, an explicit
      postgres.tlsProfile, and one of auth.mode=relaycontrol_only (the default,
      with enabled introspection and empty legacy issuer settings), an
      explicitly configured temporary issuer (legacy), or self_issued. self_issued
      requires auth.selfIssued.internalSecret (at least 32 characters, checked by
      the service at startup), relaycontrol.enabled=false, login.advertisesSync=false
      and networkPolicy.enabled with controlFrom selecting the Control pods.
      accessTokenTtlSeconds is 60 to 300. The optional ingress routes only /v1,
      so /internal/* is not published; publicFrom peers share the service port
      and must route only /v1. events.messageIds (default off) requires
      LOCKER_BUCKET. A LOCKER_BUCKET extraEnv
      entry requires a nonempty literal bucket, literal
      PIPELINE_ORG_FROM_PREFIX=true and PIPELINE_KEY_PREFIX=96bulls. Missing/false
      flags, org-suffixed roots and valueFrom references for these layout inputs
      refuse rendering. Bucket literals reject surrounding whitespace; when both
      services are enabled, the configured reader bucket must equal
      ingestEdge.locker.bucket. Search is selected via SEARCH_INDEX_BACKEND
      (postgres by default); search.clickhouse.enabled reads an external
      ClickHouse from the read API Secret. Introspection uses its own Secret
      reference. Readiness requires health JSON enabled:true; dormant HTTP 200 is
      insufficient. The aws-rds-native profile is the only install profile that
      enables this option, through a mandatory qualified release overlay. The old
      sessions-pipeline readApi key refuses to render with a migration message.
      Source configuration alone does not claim runtime availability or proof.
      coordinationOverlaps.enabled is default off in the standalone leaf. The
      sessions-pipeline adapter defaults it on when the dependency is enabled,
      emitting READ_API_COORDINATION_OVERLAPS_ENABLED=true and the managed
      READ_API_COORDINATION_OVERLAPS_BACKEND=postgres selection. It requires a
      qualified fe62ed80-or-later services image and migration
      20261105047000_coordination_fact_readers.
    chart: session-read-api
    values: [fullnameOverride, replicas, image.*, imagePullSecrets, port, probeRuntime, origin, completeSince, directoryWorkspaces, login.advertisesSync, turns.assumeNoLegacy, events.messageIds, coordinationOverlaps.enabled, serviceAccountCreate, allowInClusterHttp, config.*, postgres.*, postgresCa.*, search.*, auth.*, cors.*, ingress.*, networkPolicy.*, extraEnv, extraVolumes, extraVolumeMounts, serviceAccountName, nodeSelector, tolerations, affinity, podAnnotations, resources]
    env: [SERVICE, RELAYHISTORY_SELFHOST_READ_API, RELAYHISTORY_READ_API_PORT, RELAYHISTORY_READ_API_SECRET, READ_API_ORIGIN, READ_API_AUTH_MODE, READ_API_COMPLETE_SINCE, READ_API_DIRECTORY_WORKSPACES, READ_API_CORS_ALLOWED_ORIGINS, RELAYHISTORY_SELFHOST_LOGIN_ADVERTISES_SYNC, READ_API_TURNS_ASSUME_NO_LEGACY, READ_API_EVENT_MESSAGE_IDS, READ_API_COORDINATION_OVERLAPS_ENABLED, READ_API_COORDINATION_OVERLAPS_BACKEND, READ_API_INTERNAL_SECRET, READ_API_INTERNAL_SECRET_PREVIOUS, READ_API_ACCESS_TOKEN_TTL_SECONDS, SEARCH_INDEX_POSTGRES_BACKEND_ID, SEARCH_INDEX_OPENSEARCH_URL, SEARCH_INDEX_OPENSEARCH_AUTH, SEARCH_INDEX_OPENSEARCH_AWS_REGION, SEARCH_INDEX_OPENSEARCH_INDEX_PREFIX, PIPELINE_ORG_FROM_PREFIX, PIPELINE_KEY_PREFIX, SEARCH_INDEX_BACKEND, ALLOW_IN_CLUSTER_HTTP, SESSION_POSTGRES_TLS_PROFILE, SESSION_POSTGRES_CA_FILE, SESSION_POSTGRES_CA_SHA256, RELAYAUTH_JWKS_URL, RELAYAUTH_ISSUER, RELAYHISTORY_ACCEPT_RELAYCONTROL_TOKENS, RELAYCONTROL_INTROSPECT_URL, RELAYCONTROL_INTROSPECT_SECRET]
    profiles: [selfhost-postgres, migration, external-selfhosted, external-rds, aws-rds-native, external-supabase, aws-cnpg, aws-supabase, gcp-cloudsql]
    status: shipped
    provided_by: operator
    default: disabled
    profile_default: { default: disabled, aws-rds-native: enabled }
    choices:
      - { value: disabled }
      - { value: enabled, note: Requires an owner-approved compatible runtime. }
    secrets:
      - name: { default: "<read API configuration Secret>", aws-rds-native: agent-relay-read-api }
        name_paths: [sessionReadApi.config.existingSecret, "session-read-api:config.existingSecret"]
        keys:
          - { key: RELAYHISTORY_READ_API_SECRET, key_path: "session-read-api:config.key" }
      - name: { default: "<read API introspection Secret>", aws-rds-native: "<not used: self-issued auth>" }
        name_paths: [sessionReadApi.auth.relaycontrol.existingSecret, "session-read-api:auth.relaycontrol.existingSecret"]
        keys:
          - { key: RELAYCONTROL_INTROSPECT_SECRET, key_path: "session-read-api:auth.relaycontrol.key" }
      - name: { default: "<read API internal Secret>", aws-rds-native: agent-relay-secrets }
        name_paths: [sessionReadApi.auth.selfIssued.internalSecret.existingSecret, "session-read-api:auth.selfIssued.internalSecret.existingSecret"]
        keys:
          - { key: { default: READ_API_INTERNAL_SECRET, aws-rds-native: session-read-api-secret }, key_path: [sessionReadApi.auth.selfIssued.internalSecret.key, "session-read-api:auth.selfIssued.internalSecret.key"] }
      - name: { default: "<read API previous internal Secret>", aws-rds-native: "<not configured>" }
        name_paths: [sessionReadApi.auth.selfIssued.previousInternalSecret.existingSecret, "session-read-api:auth.selfIssued.previousInternalSecret.existingSecret"]
        keys:
          - { key: READ_API_INTERNAL_SECRET_PREVIOUS, key_path: "session-read-api:auth.selfIssued.previousInternalSecret.key" }
    verify:
      default: Leave disabled until the image and assembly contract land; render/schema/probe tests prove plumbing only.
