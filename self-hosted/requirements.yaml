      - "charts/relay-control/templates/_helpers.tpl"

  - id: opt.relay-control.encryption-rotation
    kind: option
    title: Previous encryption key during a key rotation
    description: |
      During a rotation the API decrypts with the previous key and encrypts
      with the active one. encryption.previousKeyId and
