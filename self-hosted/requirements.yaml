  - id: opt.agent-relay.single-host
    kind: option
    title: Single-host mode for the dashboard and the control API
    description: |
      global.singleHost.host (off when empty) puts the dashboard and the
      self-host control API on one host: / to the dashboard and /cloud/api,
      /login and /api to relay-cloud-api (flows workers and the integrations
      OAuth callback use <publicUrl>/api/v1/...). relay-cloud-api.publicUrl
      and relay-dashboard.runtime.publicUrl are derived as https://<host>, and
      relay-dashboard.ingress.host as the bare <host>; each must be left empty
      or equal its derived value. The GKE
      Ingress then renders no api host and its ManagedCertificate drops it;
      the api and cast BackendConfigs are unchanged. The leaf dashboard
      Ingress (non-GKE edges) adds the /api route. Relaycast, Relay History,
      Relayfile and durable-actors cannot run under a path prefix without app
      changes, so they keep their own hosts and the chart fails when any of
      their public URLs or leaf ingress hosts uses the single host. No service
      on the single host needs a path rewrite, so the GCE Ingress is kept
      rather than Gateway API.
    chart: [agent-relay, relay-cloud-api, relay-dashboard]
    values:
      - global.singleHost.host
      - "relay-cloud-api:global.singleHost.host"
      - "relay-cloud-api:publicUrl"
      - "relay-dashboard:global.singleHost.host"
      - "relay-dashboard:runtime.publicUrl"
      - "relay-dashboard:ingress.host"
    env: [SELFHOST_PUBLIC_URL, DASHBOARD_PUBLIC_URL]
    profiles: [agent-relay]
    status: shipped
    provided_by: operator
    default: disabled
    choices:
      - { value: disabled, note: "per-service hosts (gkeIngress.hosts.root/api/cast/history)" }
      - { value: enabled, note: "global.singleHost.host plus gkeIngress.hosts.cast/history" }
    verify: render has one rule for the single host (/cloud/api, /login, /api to relay-cloud-api, / to the dashboard), no api host, and SELFHOST_PUBLIC_URL = DASHBOARD_PUBLIC_URL = https://<host>
    sources:
      - "charts/agent-relay/templates/gke-ingress.yaml"
      - "charts/agent-relay/templates/_helpers.tpl"
      - "charts/agent-relay/values-single-host-example.yaml"
      - "charts/relay-dashboard/templates/ingress.yaml"
      - "ci/agent-relay/render.sh"
      - "ci/agent-relay/subdomain-golden.sh"

  - id: opt.relay-dashboard.ingress
    kind: option
    title: Dashboard ingress and same-origin API proxy
    description: |
      The dashboard ingress routes /cloud/api to relay-cloud-api and / to the
