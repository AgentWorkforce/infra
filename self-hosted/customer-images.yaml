# Machine-readable image and source audit for the agent-relay GCP customer
# profile. This file records evidence; it is not an image approval list.
apiVersion: selfhost.agentrelay.com/v1alpha1
kind: CustomerImageSourceManifest
# Top-level per the gate schema (see the positive fixture in
# ci/customer-release-gate); the release gate refuses anything but "ready".
status: blocked
metadata:
  name: agent-relay-gcp
  auditedAt: "2026-11-11"
  chart:
    name: agent-relay
    version: 0.6.37
    values:
      - charts/agent-relay/values-gcp.yaml
      - charts/agent-relay/values-gcp-native.yaml

scope:
  description: >-
    Unique images rendered by the supported GCP native History profile
    (values-gcp.yaml plus values-gcp-native.yaml). RelayAuth and standalone
    RelayHistory are disabled; the Sessions Pipeline provides ingest, read,
    indexing and worker workloads. Durable actors, Relayfile and Relayflows
    are optional components, off in this profile, and are not part of this
    matrix. Every active row is an immutable digest rendered by the two
    profile values files.
    The active customer profiles are the reader-first release phase: every
    Sessions services workload receives READER_MAX_RULESET=10 while the scrub
    engine remains unchanged. values-scrub-wasm-bindgen.yaml is a separate,
    explicit cutover overlay and is not active in this phase-1 inventory.
  activeUniqueImages: 5
  excludedConditionalImages:
    - image: cgr.dev/chainguard/minio
      reason: sessions-pipeline.locker.enabled=false in the GCP profile
    - image: otel/opentelemetry-collector-contrib
      reason: sessions-pipeline.otel.enabled=false
    - image: docker.io/alpine/k8s
      reason: all three privileged SQL bootstrap Jobs are disabled
    - image: ghcr.io/agentworkforce/relayauth
      reason: components.relayauth=false in values-gcp-native.yaml
    - image: ghcr.io/agentworkforce/relayhistory
      reason: components.relayhistory=false in values-gcp-native.yaml
    - image: ghcr.io/agentworkforce/durable-actors-control-plane
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/agentworkforce/durable-actors-typescript
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/agentworkforce/relaycast-actors-gateway
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/agentworkforce/relaycast-actors-deployer
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/agentworkforce/relayfile-actors
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/agentworkforce/relayfile-actors-workspace
      reason: >-
        components.durableActors and the Relaycast/Relayfile actor modes are
        off in the GCP profile; recorded below as an inactive entry with its
        values-eks-actors.yaml digest.
    - image: ghcr.io/cloudnative-pg/postgresql
      reason: >-
        The HoopDb Cluster is disabled, but this image is still active below
        as the Sessions migration wait-for-role init container.

policy:
  customerReadyRequires:
    - immutable digest in customer values
    - exact source repository and committed revision
    - approved source and binary distribution license
    - reviewed release workflow that builds the committed revision
    - required linux platform manifests
    - approved customer-accessible source registry or vendor promotion path
    - recorded SBOM, provenance, vulnerability review, and release approval
  proofRegistryIsCustomerChannel: false
  mutableTagsAllowedInCustomerValues: false
  unknownOrUnapprovedImageIsBlocking: true

