kind: Secret
metadata:
  name: search-indexer-runtime
  namespace: agent-relay
type: Opaque
stringData:
  RELAYHISTORY_PIPELINE_CONSUMER_SECRET: '{"hoopdb_url":"postgresql://search_consumer_runtime:c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4@shared-db.abc123example.us-east-1.rds.amazonaws.com:5432/hoopdb?sslmode=verify-full"}'
