# EXAMPLE ONLY: every value below is fake. scripts/selfhost/configure-rds.sh
# writes the real Secret, in this shape, from ~/.agent-relay-install/secret-files.
# Writing it by hand is the bring-your-own option: each database URL must log in
# as its own dedicated login (never the RDS master), or helm install refuses it
# (databaseGuard, docs/self-hosted-rds-manual-setup.md §1.13). Never commit real ones.
apiVersion: v1
kind: Secret
metadata:
  name: search-indexer-owner
  namespace: agent-relay
type: Opaque
stringData:
  # Same dedicated hoopdb_owner URL as HOOPDB_MIGRATION_URL; it is not rds_superuser.
  RELAYHISTORY_PIPELINE_CONSUMER_SECRET: '{"hoopdb_url":"postgresql://hoopdb_owner:5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5@shared-db.abc123example.us-east-1.rds.amazonaws.com:5432/hoopdb?sslmode=verify-full"}'
