# External Secrets Operator overlay for the GKE install: the five install
# Secrets come from Google Secret Manager instead of step 10's kubectl or
# helm-secrets (0-START-HERE.md, step 10 d). Pass it after values.yaml:
#
#   helm upgrade --install ... -f values.yaml -f external-secrets-values.yaml
#
# It expects the 19 secrets that `VALS_GCPSM=<project id> bash
# helm-secrets-prepare.sh` writes, named agent-relay--<Secret>--<key>.
#
# The chart renders one SecretStore and five ExternalSecrets. ESO reads Secret
# Manager as the Kubernetes ServiceAccount below through GKE Workload
# Identity, with no service account key.
externalSecrets:
  enabled: true
  refreshInterval: 1h
  store:
    create: true
    provider:
      gcpsm:
        projectID: __GCP_PROJECT_ID__
        auth:
          workloadIdentity:
            # The GKE cluster the ServiceAccount token is issued for.
            clusterProjectID: __GCP_PROJECT_ID__
            clusterLocation: __REGION__
            clusterName: __GKE_CLUSTER__
            # A ServiceAccount in the release namespace that you create
            # (step 10 d). It needs roles/secretmanager.secretAccessor on the
            # secrets and nothing else.
            serviceAccountRef:
              name: agent-relay-external-secrets
  secrets:
    agent-relay-secrets:
      data:
        database-migrations-url: agent-relay--agent-relay-secrets--database-migrations-url
        database-url: agent-relay--agent-relay-secrets--database-url
        HOOPDB_URL: agent-relay--agent-relay-secrets--HOOPDB_URL
        database-owner-url: agent-relay--agent-relay-secrets--database-owner-url
        database-runtime-url: agent-relay--agent-relay-secrets--database-runtime-url
        HOOPDB_MIGRATION_URL: agent-relay--agent-relay-secrets--HOOPDB_MIGRATION_URL
        selfhost-bootstrap-token: agent-relay--agent-relay-secrets--selfhost-bootstrap-token
        selfhost-setup-key: agent-relay--agent-relay-secrets--selfhost-setup-key
        relaycast-internal-secret: agent-relay--agent-relay-secrets--relaycast-internal-secret
        relaycast-workspace-bootstrap-secret: agent-relay--agent-relay-secrets--relaycast-workspace-bootstrap-secret
        relaycontrol-introspect-secret: agent-relay--agent-relay-secrets--relaycontrol-introspect-secret
        session-read-api-secret: agent-relay--agent-relay-secrets--session-read-api-secret
        selfhost-encryption-key: agent-relay--agent-relay-secrets--selfhost-encryption-key
        SUMMARY_MASTER_KEYS: agent-relay--agent-relay-secrets--SUMMARY_MASTER_KEYS
    agent-relay-read-api:
      data:
        RELAYHISTORY_READ_API_SECRET: agent-relay--agent-relay-read-api--RELAYHISTORY_READ_API_SECRET
    agent-relay-ingest-edge-runtime:
      data:
        database-url: agent-relay--agent-relay-ingest-edge-runtime--database-url
        introspect-secret: agent-relay--agent-relay-ingest-edge-runtime--introspect-secret
    search-indexer-runtime:
      data:
        RELAYHISTORY_PIPELINE_CONSUMER_SECRET: agent-relay--search-indexer-runtime--RELAYHISTORY_PIPELINE_CONSUMER_SECRET
    search-indexer-owner:
      data:
        RELAYHISTORY_PIPELINE_CONSUMER_SECRET: agent-relay--search-indexer-owner--RELAYHISTORY_PIPELINE_CONSUMER_SECRET
