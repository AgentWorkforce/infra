      artifacthub.io/license: Apache-2.0
    apiVersion: v2
    appVersion: 0.1.0
    created: "2026-11-12T05:59:12.482719886Z"
    dependencies:
    - alias: worker
      name: sessions-pipeline-worker
      repository: file://../sessions-pipeline-worker
      version: 0.7.8
    - alias: alleyoop
      name: session-ingest-api
      repository: file://../session-ingest-api
      version: 0.4.5
    - alias: sessionReadApi
      condition: sessionReadApi.enabled
      name: session-read-api
      repository: file://../session-read-api
      version: 0.2.11
    - alias: hoopdb
      condition: hoopdb.enabled
      name: cluster
      repository: https://cloudnative-pg.github.io/charts
      version: 0.9.0
    - alias: session-object-storage
      condition: session-object-storage.enabled
      name: minio
      repository: https://charts.min.io/
      version: 5.4.0
    - alias: otel
      condition: otel.enabled
      name: opentelemetry-collector
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      version: 0.178.0
    description: 'The sessions pipeline in one release: the sessions-pipeline-worker
      and session-ingest-api app charts, plus optional Postgres (CloudNativePG Cluster),
      session-object-storage (MinIO) and an OpenTelemetry collector. Hook-free, so
      `helm install` and Alchemy''s `helm template --no-hooks` + server-side apply
      behave the same. Requires the CloudNativePG operator when hoopdb.enabled (see
      deps/PINS.md). '
