# Hand-written from the docs' description plus the annotations list (DOCS-GAP: no by-hand Ingress in docs).
# Apply: sed "s|arn:aws:acm:us-west-2:<acct>:certificate/00000000-0000-0000-0000-000000000000|$CERT_ARN|" ingress.yaml | kubectl apply -f -
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-relay
  namespace: agent-relay
  labels: {owner: layered-infra-ops, purpose: eks-selfhost-proof}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-west-2:<acct>:certificate/00000000-0000-0000-0000-000000000000
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/tags: owner=layered-infra-ops,purpose=eks-selfhost-proof
    alb.ingress.kubernetes.io/actions.edge-deny: '{"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"not found"}}'
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - eks-proof.agentrelay.com
        - api.eks-proof.agentrelay.com
        - cast.eks-proof.agentrelay.com
        - history.eks-proof.agentrelay.com
  rules:
    - host: eks-proof.agentrelay.com
      http:
        paths:
          - {path: "/cloud/api", pathType: Prefix, backend: {service: {name: relay-control, port: {number: 80}}}}
          - {path: "/login", pathType: Prefix, backend: {service: {name: relay-control, port: {number: 80}}}}
          - {path: "/relay-node", pathType: Prefix, backend: {service: {name: relay-control, port: {number: 80}}}}
          - {path: "/", pathType: Prefix, backend: {service: {name: relay-webapp, port: {number: 8080}}}}
    - host: api.eks-proof.agentrelay.com
      http:
        paths:
          - {path: "/internal", pathType: Prefix, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "//internal*", pathType: ImplementationSpecific, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "/*", pathType: ImplementationSpecific, backend: {service: {name: relay-control, port: {number: 80}}}}
    - host: cast.eks-proof.agentrelay.com
      http:
        paths:
          - {path: "/internal", pathType: Prefix, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "//internal*", pathType: ImplementationSpecific, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "/v1/workspaces", pathType: Exact, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "/v1/workspaces/", pathType: Exact, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "/*", pathType: ImplementationSpecific, backend: {service: {name: relaycast, port: {number: 8787}}}}
    - host: history.eks-proof.agentrelay.com
      http:
        paths:
          - {path: "/v1/delivery/batches", pathType: Exact, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/turns/batches", pathType: Exact, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/delivery/limits", pathType: Exact, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/auth/token/refresh", pathType: Exact, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/delivery/records", pathType: Exact, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/cli/login", pathType: Exact, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/events", pathType: Exact, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/auth/token/revoke", pathType: Exact, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/sessions", pathType: Prefix, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/digest", pathType: Prefix, backend: {service: {name: agent-relay-read-api, port: {number: 80}}}}
          - {path: "/v1/delivery", pathType: Prefix, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/turns", pathType: Prefix, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/v1/onboarding", pathType: Prefix, backend: {service: {name: agent-relay-ingest-edge, port: {number: 80}}}}
          - {path: "/internal", pathType: Prefix, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "//internal*", pathType: ImplementationSpecific, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
          - {path: "/*", pathType: ImplementationSpecific, backend: {service: {name: edge-deny, port: {name: use-annotation}}}}
