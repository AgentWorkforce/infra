# Temporary: syncs the DB-setup passwords from SSM into a Secret in ar-proof-setup for the psql pod. Delete at teardown/after phase 2.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: ar-proof-ssm, namespace: ar-proof-setup}
spec:
  provider: {aws: {service: ParameterStore, region: us-west-2}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: ar-proof-dbsetup, namespace: ar-proof-setup}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ar-proof-ssm}
  target: {name: ar-proof-dbsetup, creationPolicy: Owner}
  data:
    - {secretKey: PGPASSWORD, remoteRef: {key: /agent-relay/proof/_dbsetup/PGPASSWORD}}
    - {secretKey: PW_control_owner, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_control_owner}}
    - {secretKey: PW_control_api_runtime, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_control_api_runtime}}
    - {secretKey: PW_relaycast_owner, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_relaycast_owner}}
    - {secretKey: PW_relaycast_runtime, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_relaycast_runtime}}
    - {secretKey: PW_sessions_pipeline_runtime, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_sessions_pipeline_runtime}}
    - {secretKey: PW_bulls96_read_api, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_bulls96_read_api}}
    - {secretKey: PW_bulls96_session_ingest, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_bulls96_session_ingest}}
    - {secretKey: PW_search_consumer_runtime, remoteRef: {key: /agent-relay/proof/_dbsetup/PW_search_consumer_runtime}}
