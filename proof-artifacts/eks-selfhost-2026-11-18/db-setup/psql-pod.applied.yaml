# Apply with: sed -e "s|ar-proof-pg.xxxxxxxxxxxx.us-west-2.rds.amazonaws.com|$RDS_HOST|" -e "s|ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3|$PSQL_IMAGE|" psql-pod.yaml | kubectl apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: ar-proof-psql
  namespace: ar-proof-setup
  labels: {owner: layered-infra-ops, purpose: eks-selfhost-proof}
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
      command: ["sleep", "28800"]
      envFrom: [{secretRef: {name: ar-proof-dbsetup}}]
      env:
        - {name: PGHOST, value: ar-proof-pg.xxxxxxxxxxxx.us-west-2.rds.amazonaws.com}
        - {name: PGPORT, value: "5432"}
        - {name: PGUSER, value: proof_master}
        - {name: PGSSLMODE, value: verify-full}
        - {name: PGSSLROOTCERT, value: /rds-ca/ca.crt}
        - {name: AWS_REGION, value: us-west-2}
      volumeMounts:
        - {name: rds-ca, mountPath: /rds-ca, readOnly: true}
        - {name: sql, mountPath: /sql, readOnly: true}
      resources: {requests: {cpu: 50m, memory: 128Mi}}
  volumes:
    - {name: rds-ca, configMap: {name: rds-ca}}
    - {name: sql, configMap: {name: ar-proof-hoopdb-sql}}
