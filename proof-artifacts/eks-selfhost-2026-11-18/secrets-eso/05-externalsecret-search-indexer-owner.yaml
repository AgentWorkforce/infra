apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: search-indexer-owner
  namespace: agent-relay
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ar-proof-ssm}
  target:
    name: search-indexer-owner
    creationPolicy: Owner
  data:
    - secretKey: RELAYHISTORY_PIPELINE_CONSUMER_SECRET
      remoteRef:
        key: /agent-relay/proof/search-indexer-owner/RELAYHISTORY_PIPELINE_CONSUMER_SECRET
