apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-relay-ingest-edge-runtime
  namespace: agent-relay
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ar-proof-ssm}
  target:
    name: agent-relay-ingest-edge-runtime
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: /agent-relay/proof/agent-relay-ingest-edge-runtime/database-url
    - secretKey: introspect-secret
      remoteRef:
        key: /agent-relay/proof/agent-relay-ingest-edge-runtime/introspect-secret
