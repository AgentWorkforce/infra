apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-relay-secrets
  namespace: agent-relay
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ar-proof-ssm}
  target:
    name: agent-relay-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/database-url
    - secretKey: database-migrations-url
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/database-migrations-url
    - secretKey: HOOPDB_URL
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/HOOPDB_URL
    - secretKey: HOOPDB_MIGRATION_URL
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/HOOPDB_MIGRATION_URL
    - secretKey: database-owner-url
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/database-owner-url
    - secretKey: database-runtime-url
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/database-runtime-url
    - secretKey: selfhost-bootstrap-token
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/selfhost-bootstrap-token
    - secretKey: selfhost-setup-key
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/selfhost-setup-key
    - secretKey: selfhost-encryption-key
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/selfhost-encryption-key
    - secretKey: relaycast-internal-secret
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/relaycast-internal-secret
    - secretKey: relaycast-workspace-bootstrap-secret
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/relaycast-workspace-bootstrap-secret
    - secretKey: relaycontrol-introspect-secret
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/relaycontrol-introspect-secret
    - secretKey: session-read-api-secret
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/session-read-api-secret
    - secretKey: SUMMARY_MASTER_KEYS
      remoteRef:
        key: /agent-relay/proof/agent-relay-secrets/SUMMARY_MASTER_KEYS
