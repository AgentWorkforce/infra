# Variant B overlay: helm upgrade agent-relay <main chart> -f examples/aws/values.yaml(domain-edited) -f this
externalSecrets:
  enabled: true
  refreshInterval: 1h
  creationPolicy: Owner   # use Merge + delete --cascade=orphan path if adoption is not used
  store:
    create: true          # renders SecretStore agent-relay-external-secrets
    provider:
      aws:
        service: ParameterStore
        region: us-west-2
  secrets:
    agent-relay-secrets:
      data:
        database-url: /agent-relay/proof/agent-relay-secrets/database-url
        database-migrations-url: /agent-relay/proof/agent-relay-secrets/database-migrations-url
        HOOPDB_URL: /agent-relay/proof/agent-relay-secrets/HOOPDB_URL
        HOOPDB_MIGRATION_URL: /agent-relay/proof/agent-relay-secrets/HOOPDB_MIGRATION_URL
        database-owner-url: /agent-relay/proof/agent-relay-secrets/database-owner-url
        database-runtime-url: /agent-relay/proof/agent-relay-secrets/database-runtime-url
        selfhost-bootstrap-token: /agent-relay/proof/agent-relay-secrets/selfhost-bootstrap-token
        selfhost-setup-key: /agent-relay/proof/agent-relay-secrets/selfhost-setup-key
        selfhost-encryption-key: /agent-relay/proof/agent-relay-secrets/selfhost-encryption-key
        relaycast-internal-secret: /agent-relay/proof/agent-relay-secrets/relaycast-internal-secret
        relaycast-workspace-bootstrap-secret: /agent-relay/proof/agent-relay-secrets/relaycast-workspace-bootstrap-secret
        relaycontrol-introspect-secret: /agent-relay/proof/agent-relay-secrets/relaycontrol-introspect-secret
        session-read-api-secret: /agent-relay/proof/agent-relay-secrets/session-read-api-secret
        SUMMARY_MASTER_KEYS: /agent-relay/proof/agent-relay-secrets/SUMMARY_MASTER_KEYS
    agent-relay-read-api:
      data:
        RELAYHISTORY_READ_API_SECRET: /agent-relay/proof/agent-relay-read-api/RELAYHISTORY_READ_API_SECRET
    agent-relay-ingest-edge-runtime:
      data:
        database-url: /agent-relay/proof/agent-relay-ingest-edge-runtime/database-url
        introspect-secret: /agent-relay/proof/agent-relay-ingest-edge-runtime/introspect-secret
    search-indexer-runtime:
      data:
        RELAYHISTORY_PIPELINE_CONSUMER_SECRET: /agent-relay/proof/search-indexer-runtime/RELAYHISTORY_PIPELINE_CONSUMER_SECRET
    search-indexer-owner:
      data:
        RELAYHISTORY_PIPELINE_CONSUMER_SECRET: /agent-relay/proof/search-indexer-owner/RELAYHISTORY_PIPELINE_CONSUMER_SECRET
