# Variant A store. Distinct name so Variant B's chart-made store can coexist.
# No auth block: uses the ESO controller's Pod Identity credentials.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ar-proof-ssm
  namespace: agent-relay
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-2
