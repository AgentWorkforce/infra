apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-relay-read-api
  namespace: agent-relay
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: ar-proof-ssm}
  target:
    name: agent-relay-read-api
    creationPolicy: Owner
  data:
    - secretKey: RELAYHISTORY_READ_API_SECRET
      remoteRef:
        key: /agent-relay/proof/agent-relay-read-api/RELAYHISTORY_READ_API_SECRET
