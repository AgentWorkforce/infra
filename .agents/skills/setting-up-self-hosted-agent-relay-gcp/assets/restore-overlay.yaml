# restore-overlay.yaml: no migration, init or backup Jobs during a restore.
relay-control:
  migrations:
    enabled: false
sessions-pipeline:
  worker:
    migrations:
      enabled: false
    lockerInit:
      enabled: false
relaycast:
  backup:
    enabled: false
# Relayflows in standalone mode is a Job; keep it off until the restore is
# verified, then re-enable it in a reviewed upgrade.
components:
  relayflows: false
