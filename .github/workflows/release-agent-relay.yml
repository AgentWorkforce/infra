name: Publish Agent Relay Chart

# Leaf charts (relaycast, relayauth, sessions-pipeline, ...) are published by
# release.yml on every push to main. This workflow publishes only the
# agent-relay umbrella, from an agent-relay-X.Y.Z tag, with build provenance.
on:
  push:
    # The shell gate below applies a strict agent-relay-X.Y.Z regex. GitHub's
    # tag filter is intentionally only a coarse pre-filter. The tag scheme
    # is the customer release version (for example 2026.11.0). The manifest
    # records the independently versioned Helm chart carried by that release.
    tags:
      - agent-relay-*

permissions:
  contents: read

concurrency:
  group: publish-agent-relay
  cancel-in-progress: false

env:
  CHART_DIR: charts/agent-relay
  CHART_NAME: agent-relay
  HELM_VERSION: v4.3.1

jobs:
  # Reusable workflows do not inherit secrets. lint.yml's
  # search-worker-role-kind job runs on every non-pull_request event and fails
  # closed without this token, so omitting it would block every publish.
  lint:
    uses: ./.github/workflows/lint.yml
    secrets:
      BULLS96_READ_TOKEN: ${{ secrets.BULLS96_READ_TOKEN }}

  publish:
    name: Lint, attest, and publish
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install Cosign for Sessions provenance
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Validate release tag and commit
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::This workflow only accepts tag events."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" =~ ^agent-relay-((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::Release tags must be exactly agent-relay-X.Y.Z (stable SemVer)."
            exit 1
          fi

          chart_metadata="$(helm show chart "$CHART_DIR")"
          chart_name="$(awk '/^name:/ { print $2; exit }' <<<"$chart_metadata")"
          chart_version="$(awk '/^version:/ { print $2; exit }' <<<"$chart_metadata")"
          chart_type="$(awk '/^type:/ { print $2; exit }' <<<"$chart_metadata")"
          [[ "$chart_name" == "$CHART_NAME" ]] \
            || { echo "::error::Expected chart name $CHART_NAME, got $chart_name."; exit 1; }
          [[ "$chart_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::Chart version $chart_version is not stable SemVer."; exit 1; }
          [[ "$chart_type" == "application" ]] \
            || { echo "::error::The release target must be an application chart."; exit 1; }

          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]] \
            || { echo "::error::The checkout does not match the release tag."; exit 1; }
          git show-ref --verify --quiet refs/remotes/origin/main \
            || { echo "::error::origin/main is unavailable; refusing to publish."; exit 1; }
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main \
            || { echo "::error::The tagged commit is not reachable from origin/main."; exit 1; }

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"

      - name: Reverify candidate policy and build provenance
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.BULLS96_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate_pins="releases/agent-relay-${VERSION}/pins.json"
          candidate_values="releases/agent-relay-${VERSION}/values.yaml"
          python3 scripts/release/update-release-candidate.py validate \
            --pins "$candidate_pins" \
            --values "$candidate_values" \
            --version "$VERSION"
          mapfile -t components < <(jq -er '.pins | keys[]' "$candidate_pins")
          [[ "${#components[@]}" -gt 0 ]] \
            || { echo "::error::The release candidate has no component pins."; exit 1; }

          printf '%s' "$GH_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          for component in "${components[@]}"; do
            pin="$(jq -cer --arg component "$component" '.pins[$component]' "$candidate_pins")"
            repository="$(jq -er '.repository' <<<"$pin")"
            digest="$(jq -er '.digest' <<<"$pin")"
            source_repository="$(jq -er '.sourceRepository' <<<"$pin")"
            source_sha="$(jq -er '.sourceRevision' <<<"$pin")"
            metadata="$(python3 scripts/release/update-release-candidate.py describe \
              --component "$component")"
            expected_repository="$(jq -er '.imageRepository' <<<"$metadata")"
            expected_source_repository="$(jq -er '.sourceRepository' <<<"$metadata")"
            signer_workflow="$(jq -er '.signerWorkflow' <<<"$metadata")"
            [[ "$repository" == "$expected_repository" \
              && "$source_repository" == "$expected_source_repository" ]] \
              || { echo "::error::Candidate repository drift for $component."; exit 1; }

            policy_args=(
              --blocked scripts/release/blocked-image-digests.json
              --component "$component"
              --digest "$digest"
              --source-sha "$source_sha"
            )
            if [[ "$component" == "sessions-pipeline" ]]; then
              scrub_pin="$RUNNER_TEMP/${component}-scrub-bindgen-pin.json"
              gh api \
                "repos/${source_repository}/contents/packages/pipeline/scrub-bindgen-pin.json?ref=${source_sha}" \
                --jq .content | base64 --decode > "$scrub_pin"
              policy_args+=(--scrub-pin "$scrub_pin")
            fi
            python3 scripts/release/update-release-candidate.py check-policy \
              "${policy_args[@]}"

            if [[ "$component" == "sessions-pipeline" ]]; then
              publish_run_id="$(jq -er '.publishRunId' <<<"$pin")"
              receipt_dir="$RUNNER_TEMP/${component}-release-receipt"
              mkdir "$receipt_dir"
              gh run download "$publish_run_id" \
                --repo AgentWorkforce/relayhistory-pipeline \
                --name release-receipt \
                --dir "$receipt_dir"
              python3 scripts/release/verify-sessions-pipeline-sigstore.py \
                --receipt-dir "$receipt_dir" \
                --digest "$digest" \
                --source-sha "$source_sha" \
                --publish-run-id "$publish_run_id"
            else
              attestation="$RUNNER_TEMP/${component}-verified-attestation.json"
              gh attestation verify "oci://${repository}@${digest}" \
                --repo "$source_repository" \
                --signer-workflow "$source_repository/$signer_workflow" \
                --source-digest "$source_sha" \
                --source-ref refs/heads/main \
                --format json > "$attestation"
              jq -e \
                --arg repository "https://github.com/$source_repository" \
                --arg workflow "$signer_workflow" '
                  length > 0 and all(.[].verificationResult.statement.predicate;
                    .buildDefinition.externalParameters.workflow.repository == $repository and
                    .buildDefinition.externalParameters.workflow.path == $workflow and
                    .buildDefinition.externalParameters.workflow.ref == "refs/heads/main")
                ' "$attestation" >/dev/null
            fi
          done

      - name: Add locked dependency repositories
        shell: bash
        run: |
          set -euo pipefail
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add minio https://charts.min.io/
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Build locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Helm does not recursively vendor file:// dependencies.
          helm dependency build charts/sessions-pipeline
          helm dependency build "$CHART_DIR"
          git diff --exit-code -- charts/sessions-pipeline/Chart.lock "$CHART_DIR/Chart.lock" \
            || { echo "::error::Dependency build changed a lock file."; exit 1; }

      - name: Lint and render the umbrella chart
        shell: bash
        run: |
          set -euo pipefail
          helm lint --strict "$CHART_DIR" \
            -f "$CHART_DIR/values-gcp-proof.yaml" \
            -f "$CHART_DIR/ci/gcp-proof-values.yaml"
          ci/agent-relay/render.sh
          git diff --exit-code -- charts/sessions-pipeline/Chart.lock "$CHART_DIR/Chart.lock" \
            || { echo "::error::Linting changed a lock file."; exit 1; }

      - name: Package chart and build pull-release assets
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHART_VERSION: ${{ steps.release.outputs.chart_version }}
        run: |
          set -euo pipefail
          mkdir -p .release
          helm package "$CHART_DIR" --destination .release

          package=".release/${CHART_NAME}-${CHART_VERSION}.tgz"
          [[ -f "$package" ]] \
            || { echo "::error::Helm did not create the expected package $package."; exit 1; }
          [[ "$(find .release -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1 ]] \
            || { echo "::error::Expected exactly one chart archive."; exit 1; }

          packaged_metadata="$(helm show chart "$package")"
          [[ "$(awk '/^name:/ { print $2; exit }' <<<"$packaged_metadata")" == "$CHART_NAME" ]]
          [[ "$(awk '/^version:/ { print $2; exit }' <<<"$packaged_metadata")" == "$CHART_VERSION" ]]

          candidate_dir="releases/agent-relay-${VERSION}"
          candidate_pins="${candidate_dir}/pins.json"
          candidate_values="${candidate_dir}/values.yaml"
          [[ -f "$candidate_pins" && -f "$candidate_values" ]] \
            || { echo "::error::The tagged release has no candidate pins and values."; exit 1; }
          cp "$candidate_pins" .release/candidate-pins.json
          receipt_dir="$RUNNER_TEMP/sessions-pipeline-release-receipt"
          for receipt_file in \
            release-receipt.json \
            services-index.json \
            build-provenance.sigstore.json \
            reviewed-source.sigstore.json; do
            [[ -f "$receipt_dir/$receipt_file" && ! -L "$receipt_dir/$receipt_file" ]] \
              || { echo "::error::Verified Sessions receipt file is unavailable: $receipt_file"; exit 1; }
            cp "$receipt_dir/$receipt_file" ".release/$receipt_file"
          done

          helm template "$CHART_NAME" "$CHART_DIR" \
            -f "$CHART_DIR/values-gcp.yaml" \
            -f "$candidate_values" \
            > .release/customer-pack-render.yaml
          yq -N -r \
            '.. | select(tag == "!!map") | select(has("image") or has("imageName")) | (.image // .imageName) | select(tag == "!!str")' \
            .release/customer-pack-render.yaml \
            > .release/customer-images.txt
          # The pull upgrader currently supports EKS profiles. Include their
          # approved collector-capable Relaycast and migration/export pins
          # instead of allowing the GCP render's Postgres Relaycast pin to
          # overwrite either EKS customer value. RelayAuth is default-off in
          # native History profiles but remains an optional pinned component.
          yq -N -r \
            '.images[] | select(.id == "relaycast-eks-collector" or .id == "relaycast-postgres" or .id == "relayauth") | .current.repository + "@" + .current.digest' \
            self-hosted/customer-images.yaml \
            >> .release/customer-images.txt
          sort -u -o .release/customer-images.txt .release/customer-images.txt
          yq -N -r \
            '.images[] | [.id, .current.repository, .current.digest, .approval.status] | @tsv' \
            self-hosted/customer-images.yaml \
            > .release/customer-image-inventory.tsv
          python3 scripts/release/build-agent-relay-release-manifest.py \
            --version "$VERSION" \
            --infra-commit "$GITHUB_SHA" \
            --chart-path "$CHART_DIR" \
            --chart-version "$CHART_VERSION" \
            --values-overlay-profile eks \
            --images .release/customer-images.txt \
            --inventory .release/customer-image-inventory.tsv \
            --candidate-pins .release/candidate-pins.json \
            --output .release/release-manifest.json \
            --values-overlay-output .release/release-images.values.yaml
          install_pack=".release/agent-relay-${VERSION}-install-pack.tar.gz"
          python3 scripts/release/build-agent-relay-install-pack.py \
            --version "$VERSION" \
            --base-values "$CHART_DIR/values-eks.yaml" \
            --platform-overlay "$CHART_DIR/values-eks-rds-native.yaml" \
            --image-overlay .release/release-images.values.yaml \
            --manifest .release/release-manifest.json \
            --candidate-pins .release/candidate-pins.json \
            --output "$install_pack"
          {
            printf '# Agent Relay %s\n\n' "$VERSION"
            printf 'Immutable chart and customer image pull manifest for infra commit `%s`.\n' "$GITHUB_SHA"
            printf '\nThe customer-neutral AWS install pack contains `values.yaml`, `overlay.yaml`, the accepted image/provenance pins, and an inner `SHA256SUMS`. Apply the release image overlay last after mirroring its immutable digests.\n'
            printf '\nThe customer profiles apply the ruleset-10 reader-first phase. Existing installs must verify every Sessions workload before a separate revision adds `values-scrub-wasm-bindgen.yaml`; fresh empty installs may apply that overlay at install time.\n'
            printf '\nThe four Sessions provenance receipt files are retained as release assets after their source workflow artifact expires.\n'
          } > .release/release-notes.md

          (
            cd .release
            sha256sum \
              "${CHART_NAME}-${CHART_VERSION}.tgz" \
              "agent-relay-${VERSION}-install-pack.tar.gz" \
              candidate-pins.json \
              release-receipt.json \
              services-index.json \
              build-provenance.sigstore.json \
              reviewed-source.sigstore.json \
              release-manifest.json \
              release-images.values.yaml \
              release-notes.md \
              > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "install_pack=$install_pack" >> "$GITHUB_OUTPUT"

      - name: Store package and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-relay-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.install_pack }}
            .release/candidate-pins.json
            .release/release-receipt.json
            .release/services-index.json
            .release/build-provenance.sigstore.json
            .release/reviewed-source.sigstore.json
            .release/release-manifest.json
            .release/release-images.values.yaml
            .release/release-notes.md
            .release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # This creates keyless build provenance through GitHub OIDC. It must
      # succeed before the package can be pushed to GHCR.
      - name: Attest package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.package.outputs.path }}

      - name: Attest pull-release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            .release/release-manifest.json
            .release/candidate-pins.json
            .release/release-receipt.json
            .release/services-index.json
            .release/build-provenance.sigstore.json
            .release/reviewed-source.sigstore.json
            .release/release-images.values.yaml
            ${{ steps.package.outputs.install_pack }}
            .release/SHA256SUMS

      - name: Publish only the Helm OCI artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_VERSION: ${{ steps.release.outputs.chart_version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${owner}/charts/${CHART_NAME}"
          registry="oci://ghcr.io/${owner}/charts"
          package="${{ steps.package.outputs.path }}"

          # A lookup failure other than a definitive 404 is fatal. Existing
          # versions are never overwritten or treated as a successful no-op.
          registry_token="$(curl --fail --silent --show-error \
            --user "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${repository}:pull" \
            https://ghcr.io/token \
            | jq --exit-status --raw-output '.token // .access_token')"
          [[ -n "$registry_token" ]] \
            || { echo "::error::GHCR did not issue a pull token; refusing to publish."; exit 1; }
          status="$(curl --silent --show-error --output /tmp/ghcr-manifest \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${registry_token}" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${repository}/manifests/${CHART_VERSION}")"
          unset registry_token
          already_published=false

          printf '%s' "$GITHUB_TOKEN" \
            | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'helm registry logout ghcr.io >/dev/null 2>&1 || true' EXIT

          case "$status" in
            404) ;;
            200)
              mkdir -p .release/existing
              helm pull "${registry}/${CHART_NAME}" \
                --version "$CHART_VERSION" \
                --destination .release/existing
              existing=".release/existing/${CHART_NAME}-${CHART_VERSION}.tgz"
              if ! cmp --silent "$package" "$existing"; then
                echo "::error::ghcr.io/${repository}:${CHART_VERSION} already exists with different bytes."
                exit 1
              fi
              already_published=true
              ;;
            *)
              echo "::error::GHCR existence check failed with HTTP ${status}; refusing to publish."
              exit 1
              ;;
          esac

          # There are deliberately no Docker/buildx operations in this
          # workflow: proof-only container images can never be published here.
          if [[ "$already_published" != true ]]; then
            helm push "$package" "$registry"
          fi

          mkdir -p .release/verify
          helm pull "${registry}/${CHART_NAME}" \
            --version "$CHART_VERSION" \
            --destination .release/verify
          expected="$(awk -v file="${CHART_NAME}-${CHART_VERSION}.tgz" '$2 == file { print $1 }' .release/SHA256SUMS)"
          [[ -n "$expected" ]] \
            || { echo "::error::The chart is absent from SHA256SUMS."; exit 1; }
          actual="$(sha256sum ".release/verify/${CHART_NAME}-${CHART_VERSION}.tgz" | awk '{ print $1 }')"
          [[ "$actual" == "$expected" ]] \
            || { echo "::error::The package pulled from GHCR does not match SHA256SUMS."; exit 1; }

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "${{ steps.package.outputs.path }}"
            "${{ steps.package.outputs.install_pack }}"
            .release/candidate-pins.json
            .release/release-receipt.json
            .release/services-index.json
            .release/build-provenance.sigstore.json
            .release/reviewed-source.sigstore.json
            .release/release-manifest.json
            .release/release-images.values.yaml
            .release/SHA256SUMS
            .release/release-notes.md
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --clobber "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Agent Relay $VERSION" \
              --notes-file .release/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Agent Relay $VERSION" \
              --notes-file .release/release-notes.md \
              "${assets[@]}"
          fi
