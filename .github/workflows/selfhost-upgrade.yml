# Reusable workflow: a self-hosted customer pulls an Agent Relay release into
# their own EKS install from their own GitHub repository. It wraps
# scripts/selfhost/agent-relay-upgrade.sh (verified release, ECR mirror,
# RDS snapshot, helm upgrade, or with first-install the documented first
# install). See docs/enterprise-aws-install.md, "Upgrades", and
# docs/selfhost-upgrades-github-actions.md.
#
# The plan job only reads; the apply job runs in the caller's GitHub
# environment (default "agent-relay-upgrade"), so the required reviewers the
# customer sets on that environment approve every upgrade. AWS access is
# GitHub OIDC -> the customer's IAM roles: a read-only role for plan and a
# write role trusted only for the approval environment, so changing a workflow
# on a branch can never obtain write access without an approval. Nothing
# long-lived is stored.
# Callers pin this workflow to a release tag or commit.
name: Self-hosted upgrade

on:
  workflow_call:
    inputs:
      version:
        description: Release to install (2026.11.1). Empty selects the newest agent-relay-* release.
        type: string
        default: ""
      runs-on:
        description: JSON runner labels; a self-hosted runner that can reach the cluster API.
        type: string
        default: '["self-hosted"]'
      aws-region: { type: string, required: true }
      aws-plan-role-arn: { description: "Read-only IAM role for the plan job (trusted for the caller's main branch).", type: string, required: true }
      aws-apply-role-arn: { description: "IAM role for the apply job, trusted ONLY for the caller's approval environment.", type: string, required: true }
      eks-cluster: { type: string, required: true }
      registry: { description: "<account>.dkr.ecr.<region>.amazonaws.com", type: string, required: true }
      profile: { description: "eks, eks-native or eks-rds-native: the profile the install already uses.", type: string, required: true }
      values: { description: Newline-separated values files in the caller repository., type: string, required: true }
      db-instance: { description: RDS instance snapshotted before every upgrade., type: string, required: true }
      namespace: { type: string, default: agent-relay }
      release: { type: string, default: agent-relay }
      environment: { description: Caller environment that gates the apply job., type: string, default: agent-relay-upgrade }
      first-install:
        description: "The release does not exist yet: helm install plus the migration barrier. Refused if it exists."
        type: boolean
        default: false
      rds-setup:
        description: "The databases are managed with scripts/selfhost/rds-setup.sh (implied by eks-rds-native): post on first install, refresh-admin before each upgrade."
        type: boolean
        default: false
      rds-host: { description: "rds-setup only: terraform output -raw database_host.", type: string, default: "" }
      rds-admin-secret-arn: { description: "rds-setup only: terraform output -raw database_admin_secret_arn (an ARN, not the secret).", type: string, default: "" }
      state-dir: { description: "rds-setup only: directory on the runner holding the files 'rds-setup.sh pre' wrote.", type: string, default: "" }
      relaycast-actors:
        description: "Opt-in Relaycast PostgreSQL -> durable-actors migration on the deployed chart version (eks-rds-native): empty (default), credentials or cutover. See docs/relaycast-postgres-to-actors-migration.md."
        type: string
        default: ""
      actors-values: { description: "cutover only: newline-separated values files (overrides for values-eks-actors.yaml) in the caller repository.", type: string, default: "" }
      reregister-legacy: { description: "cutover only: accept that holders of never-upgraded legacy Relaycast credentials re-register afterwards.", type: boolean, default: false }
      apply:
        description: "auto: apply (after approval) only when the rendered release changes; always; never."
        type: string
        default: auto
    outputs:
      version: { value: "${{ jobs.plan.outputs.version }}" }
      changes: { value: "${{ jobs.plan.outputs.changes }}" }

permissions:
  contents: read
  id-token: write
  attestations: read

env:
  INFRA_REPO: AgentWorkforce/infra

jobs:
  plan:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    env:
      ROLE_ARN: ${{ inputs.aws-plan-role-arn }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - &tools
        name: Runner tools
        run: |
          missing=""
          for t in gh curl jq yq helm kubectl tar aws crane; do command -v "$t" >/dev/null || missing="$missing $t"; done
          command -v sha256sum >/dev/null || command -v shasum >/dev/null || missing="$missing sha256sum|shasum"
          [ -z "$missing" ] || { echo "::error::runner is missing:$missing"; exit 1; }
      - name: Caller configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: site, persist-credentials: false }
      - name: Select release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$WANT" ]; then
            # Newest first; page through every release (service charts are released here too).
            tag=$(gh api --paginate "repos/$INFRA_REPO/releases?per_page=100" \
              --jq '.[] | select((.draft or .prerelease) | not) | .tag_name | select(startswith("agent-relay-"))' \
              | awk 'NR == 1' || true)
            [ -n "$tag" ] || { echo "::error::no agent-relay release found"; exit 1; }
            WANT=${tag#agent-relay-}
          fi
          [[ "$WANT" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "::error::invalid version $WANT"; exit 1; }
          echo "version=$WANT" >> "$GITHUB_OUTPUT"
      - name: Upgrade script from the release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AgentWorkforce/infra
          ref: agent-relay-${{ steps.version.outputs.version }}
          path: infra
          persist-credentials: false
          sparse-checkout: scripts/selfhost
      - &aws
        name: AWS credentials (GitHub OIDC)
        env:
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          # Keep both bearer tokens out of argv (visible to other processes on a
          # shared self-hosted runner): the request token goes to curl via a
          # 0600 header file, the OIDC JWT to the AWS CLI via file://.
          umask 077
          oidc_dir=$(mktemp -d "$RUNNER_TEMP/oidc.XXXXXX")
          trap 'rm -rf "$oidc_dir"' EXIT
          printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$oidc_dir/header"
          curl -sSf -H "@$oidc_dir/header" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -ejr '.value | select(type == "string" and length > 0)' > "$oidc_dir/jwt" \
            || { echo "::error::GitHub OIDC token response had no non-empty .value"; exit 1; }
          creds=$(aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" \
            --role-session-name "agent-relay-upgrade-${GITHUB_RUN_ID}" \
            --web-identity-token "file://$oidc_dir/jwt" \
            --duration-seconds 3600 --output json)
          for k in AccessKeyId:AWS_ACCESS_KEY_ID SecretAccessKey:AWS_SECRET_ACCESS_KEY SessionToken:AWS_SESSION_TOKEN; do
            v=$(jq -r ".Credentials.${k%%:*}" <<<"$creds"); echo "::add-mask::$v"; echo "${k##*:}=$v" >> "$GITHUB_ENV"
          done
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - &kube
        name: Cluster access
        env:
          CLUSTER: ${{ inputs.eks-cluster }}
          AWS_REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG" >/dev/null
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
          PROFILE: ${{ inputs.profile }}
          VALUES: ${{ inputs.values }}
          NS: ${{ inputs.namespace }}
          REL: ${{ inputs.release }}
          FIRST_INSTALL: ${{ inputs.first-install }}
          RDS_SETUP: ${{ inputs.rds-setup }}
          RELAYCAST_ACTORS: ${{ inputs.relaycast-actors }}
          # The cutover's plan reads the credentials phase's record from the same STATE_DIR.
          STATE_DIR_INPUT: ${{ inputs.state-dir }}
          ACTORS_VALUES: ${{ inputs.actors-values }}
          REREGISTER_LEGACY: ${{ inputs.reregister-legacy }}
        run: |
          set -euo pipefail
          if [ -n "$STATE_DIR_INPUT" ]; then export STATE_DIR="$STATE_DIR_INPUT"; fi
          args=(--version "$VERSION" --registry "$REGISTRY" --profile "$PROFILE" --namespace "$NS" --release "$REL")
          if [ "$FIRST_INSTALL" = true ]; then args+=(--first-install); fi
          if [ "$RDS_SETUP" = true ]; then args+=(--rds-setup); fi
          while IFS= read -r v; do [ -z "$v" ] || args+=(--values "site/$v"); done <<<"$VALUES"
          if [ -n "$RELAYCAST_ACTORS" ]; then
            args+=(--relaycast-actors "$RELAYCAST_ACTORS")
            while IFS= read -r v; do [ -z "$v" ] || args+=(--actors-values "site/$v"); done <<<"$ACTORS_VALUES"
            if [ "$REREGISTER_LEGACY" = true ]; then args+=(--reregister-legacy); fi
          fi
          infra/scripts/selfhost/agent-relay-upgrade.sh "${args[@]}" | tee "$RUNNER_TEMP/plan.txt"
          # Any rendered-manifest difference (chart, values or images) counts; a
          # plan without the explicit no-change line is treated as a change.
          # A migration phase is always a change: auto must not skip it.
          if [ -z "$RELAYCAST_ACTORS" ] && grep -qx 'plan: changes=false' "$RUNNER_TEMP/plan.txt"; then echo "changes=false" >> "$GITHUB_OUTPUT"; else echo "changes=true" >> "$GITHUB_OUTPUT"; fi
          { echo "## Agent Relay $VERSION plan"; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: inputs.apply == 'always' || (inputs.apply == 'auto' && needs.plan.outputs.changes == 'true')
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    concurrency: { group: "agent-relay-upgrade-${{ inputs.release }}", cancel-in-progress: false }
    env:
      ROLE_ARN: ${{ inputs.aws-apply-role-arn }}
    steps:
      - *tools
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { path: site, persist-credentials: false }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AgentWorkforce/infra
          ref: agent-relay-${{ needs.plan.outputs.version }}
          path: infra
          persist-credentials: false
          sparse-checkout: scripts/selfhost
      - *aws
      - *kube
      - name: Snapshot and upgrade
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
          PROFILE: ${{ inputs.profile }}
          VALUES: ${{ inputs.values }}
          NS: ${{ inputs.namespace }}
          REL: ${{ inputs.release }}
          DB: ${{ inputs.db-instance }}
          FIRST_INSTALL: ${{ inputs.first-install }}
          RDS_SETUP: ${{ inputs.rds-setup }}
          RELAYCAST_ACTORS: ${{ inputs.relaycast-actors }}
          ACTORS_VALUES: ${{ inputs.actors-values }}
          REREGISTER_LEGACY: ${{ inputs.reregister-legacy }}
          # Read by rds-setup.sh from the environment; AWS_REGION comes from the credentials step.
          RDS_HOST: ${{ inputs.rds-host }}
          RDS_ADMIN_SECRET_ARN: ${{ inputs.rds-admin-secret-arn }}
          STATE_DIR_INPUT: ${{ inputs.state-dir }}
        run: |
          set -euo pipefail
          if [ -n "$STATE_DIR_INPUT" ]; then export STATE_DIR="$STATE_DIR_INPUT"; fi
          args=(--version "$VERSION" --registry "$REGISTRY" --profile "$PROFILE" --namespace "$NS" --release "$REL" --db-instance "$DB" --apply --yes)
          if [ "$FIRST_INSTALL" = true ]; then args+=(--first-install); fi
          if [ "$RDS_SETUP" = true ]; then args+=(--rds-setup); fi
          while IFS= read -r v; do [ -z "$v" ] || args+=(--values "site/$v"); done <<<"$VALUES"
          if [ -n "$RELAYCAST_ACTORS" ]; then
            args+=(--relaycast-actors "$RELAYCAST_ACTORS")
            while IFS= read -r v; do [ -z "$v" ] || args+=(--actors-values "site/$v"); done <<<"$ACTORS_VALUES"
            if [ "$REREGISTER_LEGACY" = true ]; then args+=(--reregister-legacy); fi
          fi
          infra/scripts/selfhost/agent-relay-upgrade.sh "${args[@]}" | tee "$RUNNER_TEMP/apply.txt"
          { echo "## Agent Relay $VERSION apply"; echo '```'; cat "$RUNNER_TEMP/apply.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
