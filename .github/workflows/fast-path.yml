  lint-search-worker-role-kind:
    if: inputs.stage == 'charts'
    needs:
    - gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.sha }}
        fetch-depth: 0
    - name: Changed?
      id: changed
      run: |
        if [ "${{ github.event_name }}" != pull_request ] \
          || git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(charts/sessions-pipeline/|charts/sessions-pipeline-worker/|deps/cnpg-|deps/pins\.txt$|ci/sessions-pipeline-search-worker-role/|ci/sessions-pipeline-profiles/|\.github/workflows/(lint|release|release-agent-relay)\.yml$)'; then
          echo run=true >> "$GITHUB_OUTPUT"
        fi
    - name: Pinned sessions-pipeline commit
      if: steps.changed.outputs.run == 'true'
      id: pin
      run: |
        sha=$(tr -d '[:space:]' < ci/sessions-pipeline-search-worker-role/services-commit)
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::services-commit must be a full 40-hex commit sha"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - name: Require the sessions-pipeline read token
      if: steps.changed.outputs.run == 'true'
      env:
        BULLS96_READ_TOKEN: ${{ secrets.BULLS96_READ_TOKEN }}
      run: |
        if [ -z "$BULLS96_READ_TOKEN" ]; then
          echo "::error::BULLS96_READ_TOKEN is not available to this run (fork pull request, or the Actions secret is missing). This job builds the private sessions-pipeline services image and is required: it fails rather than skips. A maintainer must run it from a branch in AgentWorkforce/infra."
          exit 1
        fi
    - uses: actions/checkout@v4
      if: steps.changed.outputs.run == 'true'
      with:
        repository: AgentWorkforce/sessions-pipeline
        ref: ${{ steps.pin.outputs.sha }}
        token: ${{ secrets.BULLS96_READ_TOKEN }}
        path: .services-src
        persist-credentials: false
    - name: Build the services image (local only, never pushed)
      if: steps.changed.outputs.run == 'true'
      run: |
        [ "$(git -C .services-src rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}" ] || { echo "::error::checked out the wrong commit"; exit 1; }
        docker build -f .services-src/docker/services.Dockerfile -t "ghcr.io/agentworkforce/96bulls-services:kind-${{ steps.pin.outputs.sha }}" .services-src
    - uses: azure/setup-helm@v4
      if: steps.changed.outputs.run == 'true'
      with:
        version: ${{ env.HELM_VERSION }}
    - uses: helm/kind-action@v1.15.1
      if: steps.changed.outputs.run == 'true'
      with:
        cluster_name: sessions-pipeline-role
    - name: Role converges; drift refused; full release incl. phase-2-only failure
      if: steps.changed.outputs.run == 'true'
      env:
        SERVICES_IMAGE: ghcr.io/agentworkforce/96bulls-services:kind-${{ steps.pin.outputs.sha }}
        SERVICES_SRC: .services-src
      run: ci/sessions-pipeline-search-worker-role/kind.sh
    env:
      HELM_VERSION: v4.3.1
      KUBECONFORM_VERSION: v0.8.0
      ESO_VERSION: v2.14.0
    permissions:
      contents: read
  charts:
    if: inputs.stage == 'charts'
    needs:
    - gate
    - lint-static
    - lint-customer-release-gate
    - lint-agent-skill
    - lint-kind
    - lint-relaycast-smoke
    - lint-search-worker-role-kind
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.gate.outputs.sha }}
        fetch-depth: 0
    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: v4.3.1
    - name: Add dependency repositories
      run: |
        helm repo add cnpg https://cloudnative-pg.github.io/charts
        helm repo add minio https://charts.min.io/
        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo update
    - name: Exclude the tag-published agent-relay umbrella and vendored upstream charts
      run: rm -rf charts/agent-relay charts/durable-actors
    - name: Run chart-releaser
      id: cr
      uses: helm/chart-releaser-action@v1.6.0
      with:
        charts_dir: charts
        pages_branch: gh-pages
        skip_existing: true
      env:
        CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Push charts to GHCR (OCI)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        registry="oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
        printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        mkdir -p .oci-packages
        for dir in charts/*/; do
          chart=$(basename "$dir")
          # Published (and attested) only by release-agent-relay.yml.
          [ "$chart" = agent-relay ] && continue
          # Vendored upstream chart (UPSTREAM.md); upstream publishes it.
          [ "$chart" = durable-actors ] && continue
          version=$(sed -n 's/^version: *//p' "$dir/Chart.yaml" | tr -d '"')
          # Only versions chart-releaser has published to the Pages repo.
          git ls-remote --exit-code --tags origin "refs/tags/$chart-$version" >/dev/null || continue
          if helm show chart "$registry/$chart" --version "$version" >/dev/null 2>&1; then
            echo "$chart $version already in GHCR"
            continue
          fi
          helm dependency build "$dir" >/dev/null 2>&1 || true
          helm package "$dir" --destination .oci-packages >/dev/null
          helm push ".oci-packages/$chart-$version.tgz" "$registry"
        done
    - name: Summary
      if: always()
      shell: bash
      env:
        CHANGED: ${{ steps.cr.outputs.changed_charts }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2016 # the backticks are literal Markdown
        {
          echo "- chart-releaser changed charts: ${CHANGED:-none}"
          echo "- chart versions at this commit (OCI: oci://ghcr.io/agentworkforce/charts/<chart>):"
          for chart in charts/*/Chart.yaml; do
            printf -- '  - `%s` %s\n' "$(basename "$(dirname "$chart")")" \
              "$(sed -n 's/^version: *//p' "$chart" | tr -d '"')"
          done
        } >> "$GITHUB_STEP_SUMMARY"
    concurrency:
      group: fast-path-charts
      cancel-in-progress: false
