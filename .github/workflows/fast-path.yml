# GENERATED by scripts/ci/render-fast-path.py from release-candidate.yml,
# release-candidate-tag.yml, lint.yml and release.yml. Do not edit by hand:
# change the source workflow, then run `python3 scripts/ci/render-fast-path.py`.
#
# Fast path: infra's release steps on Blacksmith runners, outside the shared
# GitHub-hosted queue. Anyone with write access (people or agents) may start
# it; nothing runs until Khaliq (khaliqgant) approves the `fast-path`
# environment on the first job. Every later job needs that job. The stages:
#
#   candidate  release-candidate.yml: verify a published component image
#              (policy, provenance) and pin it on the release/agent-relay-X.Y.Z
#              PR, then request exact-head acceptance (which runs on the
#              self-hosted acceptance runner, not the shared queue).
#   tag        release-candidate-tag.yml for a merged release PR: validate the
#              exact-head gate evidence and push the agent-relay-X.Y.Z tag.
#   charts     every Lint Charts job, then release.yml: chart-releaser and the
#              GHCR OCI push for leaf charts whose version is not yet published.
#
# Every guard is the source workflow's own step, unchanged: FROZEN candidates,
# digest/commit validation, blocked digests, attestation and Sigstore checks,
# exact-head acceptance and approvals, the tag-moves-never rule, chart-releaser
# skip_existing and the already-in-GHCR check. `ref` must be the current main
# head, which is what the source workflows check out.
#
# Not here, on purpose: release-agent-relay.yml (the umbrella chart and the
# release assets the agent-relay-X.Y.Z tag triggers). Customer upgrades verify
# those attestations with --deny-self-hosted-runners and the
# release-agent-relay.yml signer, and Blacksmith runners count as self-hosted,
# so that publish stays on GitHub-hosted runners.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to run from; must be the current main head
        required: true
        default: main
        type: string
      reason:
        description: Why this needs the fast path
        required: true
        type: string
      stage:
        description: candidate (pin an image on the release PR), tag (tag a merged release PR) or charts (lint and publish leaf charts)
        required: true
        type: choice
        options:
        - candidate
        - tag
        - charts
      version:
        description: 'candidate: Stable SemVer release version; blank selects the one open release PR'
        required: false
        type: string
      component:
        description: 'candidate: Published component (sessions-pipeline, relay-control, relay-webapp)'
        required: false
        type: string
      digest:
        description: 'candidate: Immutable sha256 image digest'
        required: false
        type: string
      source_sha:
        description: 'candidate: Full lowercase source commit'
        required: false
        type: string
      publish_run_id:
        description: 'candidate: relayhistory-pipeline publish run; required only for sessions-pipeline'
        required: false
        type: string
      override_frozen:
        description: 'candidate: Approver-only override for a FROZEN qualified candidate'
        required: false
        default: false
        type: boolean
      override_reason:
        description: 'candidate: Audit reason; required when override_frozen is true'
        required: false
        type: string
      pr_number:
        description: 'tag: number of the merged release/agent-relay-X.Y.Z pull request'
        required: false
        type: string
permissions:
  contents: read
jobs:
  gate:
    environment: fast-path
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
    - name: Resolve ref and require the current main head
      id: sha
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        REASON: ${{ inputs.reason }}
        STAGE: ${{ inputs.stage }}
      run: |
        set -euo pipefail
        sha="$(git rev-parse HEAD)"
        git fetch --no-tags origin main
        main="$(git rev-parse origin/main)"
        # The source workflows run main's automation; so does the fast path.
        if [[ "$sha" != "$main" ]]; then
          echo "::error::ref resolves to $sha; the infra fast path runs only the current main head ($main)."
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2016 # the backticks are literal Markdown
        {
          echo "### infra fast path: $STAGE"
          printf -- '- ref: `%s` at `%s`\n' "$REF" "$sha"
          printf -- '- reason: %s\n' "$REASON"
        } >> "$GITHUB_STEP_SUMMARY"
  candidate:
    if: inputs.stage == 'candidate'
    needs:
    - gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
      COMPONENT: ${{ github.event.inputs.component || github.event.client_payload.component }}
      DIGEST: ${{ github.event.inputs.digest || github.event.client_payload.digest }}
      SOURCE_SHA: ${{ github.event.inputs.source_sha || github.event.client_payload.source_sha }}
      PUBLISH_RUN_ID: ${{ github.event.inputs.publish_run_id || github.event.client_payload.publish_run_id || github.event.client_payload.publishRunId || '' }}
      OVERRIDE_FROZEN: ${{ inputs.override_frozen && 'true' || 'false' }}
      OVERRIDE_REASON: ${{ github.event.inputs.override_reason || '' }}
    steps:
    - name: Mint repository-scoped pusher token
      id: pusher
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ secrets.GH_APP_PUSHER_ID }}
        private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: infra
        permission-contents: write
        permission-pull-requests: write
    - name: Check out the automation from main
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.gate.outputs.sha }}
        fetch-depth: 0
        token: ${{ steps.pusher.outputs.token }}
    - name: Validate request and select release branch
      id: request
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        # The target release branch may predate this workflow. Carry the
        # reviewed default-branch implementation across the branch switch.
        install -m 0755 scripts/release/update-release-candidate.py \
          "$RUNNER_TEMP/update-release-candidate.py"
        install -m 0755 scripts/release/verify-sessions-pipeline-sigstore.py \
          "$RUNNER_TEMP/verify-sessions-pipeline-sigstore.py"
        python3 ci/agent-relay/test_release_candidate.py -v
        metadata="$(python3 "$RUNNER_TEMP/update-release-candidate.py" describe --component "$COMPONENT")"
        repository="$(jq -er '.imageRepository' <<<"$metadata")"
        source_repository="$(jq -er '.sourceRepository' <<<"$metadata")"
        signer_workflow="$(jq -er '.signerWorkflow' <<<"$metadata")"

        if [[ -n "$REQUESTED_VERSION" ]]; then
          version="$REQUESTED_VERSION"
        else
          mapfile -t branches < <(
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json headRefName \
              --jq '.[].headRefName | select(test("^release/agent-relay-(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))'
          )
          if [[ "${#branches[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one open release/agent-relay-X.Y.Z PR; found ${#branches[@]}."
            exit 1
          fi
          version="${branches[0]#release/agent-relay-}"
        fi
        if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::Release version must be stable SemVer."
          exit 1
        fi
        if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::Digest must be lowercase sha256:<64 hex>."
          exit 1
        fi
        if [[ ! "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
          echo "::error::source_sha must be a full lowercase Git commit."
          exit 1
        fi
        if [[ "$COMPONENT" == "sessions-pipeline" ]]; then
          if [[ ! "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]; then
            echo "::error::sessions-pipeline requires a positive publish_run_id."
            exit 1
          fi
        elif [[ -n "$PUBLISH_RUN_ID" ]]; then
          echo "::error::publish_run_id applies only to sessions-pipeline."
          exit 1
        fi

        branch="release/agent-relay-$version"
        frozen_path="releases/agent-relay-${version}/FROZEN"
        is_frozen="$(python3 "$RUNNER_TEMP/update-release-candidate.py" \
          check-frozen --path "$frozen_path")"
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          git fetch origin "$branch"
          if git cat-file -e "FETCH_HEAD:${frozen_path}" 2>/dev/null; then
            git show "FETCH_HEAD:${frozen_path}" > "$RUNNER_TEMP/remote-FROZEN"
            python3 "$RUNNER_TEMP/update-release-candidate.py" \
              check-frozen --path "$RUNNER_TEMP/remote-FROZEN" >/dev/null
            is_frozen=true
          fi
        fi
        allow_frozen=false
        if [[ "$is_frozen" == "true" ]]; then
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::agent-relay-${version} is FROZEN as a qualified candidate; repository_dispatch cannot overwrite it."
            exit 1
          fi
          if [[ "$OVERRIDE_FROZEN" != "true" ]]; then
            echo "::error::agent-relay-${version} is FROZEN; manual dispatch requires override_frozen=true."
            exit 1
          fi
          if [[ ${#OVERRIDE_REASON} -lt 10 || ${#OVERRIDE_REASON} -gt 200 \
            || "$OVERRIDE_REASON" == *$'\n'* || "$OVERRIDE_REASON" == *$'\r'* \
            || "$OVERRIDE_REASON" == *[![:print:]]* ]]; then
            echo "::error::A printable single-line 10-200 character override_reason is required."
            exit 1
          fi
          repository_permission="$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" \
            --jq '.permission // "none"')"
          case "$repository_permission" in
            admin|write) ;;
            *) echo "::error::FROZEN override requires an approver with repository push permission."; exit 1 ;;
          esac
          allow_frozen=true
          echo "::notice::FROZEN candidate override by ${GITHUB_ACTOR}: ${OVERRIDE_REASON}"
          printf 'FROZEN candidate override by `%s`: %s\n' \
            "$GITHUB_ACTOR" "$OVERRIDE_REASON" >> "$GITHUB_STEP_SUMMARY"
        elif [[ "$OVERRIDE_FROZEN" == "true" ]]; then
          echo "::error::override_frozen is valid only for an existing FROZEN candidate."
          exit 1
        fi
        {
          echo "version=$version"
          echo "branch=$branch"
          echo "repository=$repository"
          echo "source_repository=$source_repository"
          echo "signer_workflow=$signer_workflow"
          echo "allow_frozen=$allow_frozen"
        } >> "$GITHUB_OUTPUT"
    - name: Enforce image and scrubber policy
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.BULLS96_READ_TOKEN || secrets.GITHUB_TOKEN }}
        SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
      run: |
        set -euo pipefail
        args=(
          --blocked scripts/release/blocked-image-digests.json
          --component "$COMPONENT"
          --digest "$DIGEST"
          --source-sha "$SOURCE_SHA"
        )
        if [[ "$COMPONENT" == "sessions-pipeline" ]]; then
          gh api \
            "repos/${SOURCE_REPOSITORY}/contents/packages/pipeline/scrub-bindgen-pin.json?ref=${SOURCE_SHA}" \
            --jq .content | base64 --decode > "$RUNNER_TEMP/scrub-bindgen-pin.json"
          args+=(--scrub-pin "$RUNNER_TEMP/scrub-bindgen-pin.json")
        fi
        python3 "$RUNNER_TEMP/update-release-candidate.py" check-policy "${args[@]}"
    - name: Authenticate to GHCR
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.BULLS96_READ_TOKEN || secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
    - name: Install Cosign for Sessions provenance
      if: env.COMPONENT == 'sessions-pipeline'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
      with:
        cosign-release: v3.1.4
    - name: Verify component build provenance
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.BULLS96_READ_TOKEN || secrets.GITHUB_TOKEN }}
        IMAGE_REPOSITORY: ${{ steps.request.outputs.repository }}
        SOURCE_REPOSITORY: ${{ steps.request.outputs.source_repository }}
        SIGNER_WORKFLOW: ${{ steps.request.outputs.signer_workflow }}
      run: |
        set -euo pipefail
        if [[ "$COMPONENT" == "sessions-pipeline" ]]; then
          receipt_dir="$RUNNER_TEMP/sessions-pipeline-release-receipt"
          mkdir "$receipt_dir"
          gh run download "$PUBLISH_RUN_ID" \
            --repo AgentWorkforce/relayhistory-pipeline \
            --name release-receipt \
            --dir "$receipt_dir"
          python3 "$RUNNER_TEMP/verify-sessions-pipeline-sigstore.py" \
            --receipt-dir "$receipt_dir" \
            --digest "$DIGEST" \
            --source-sha "$SOURCE_SHA" \
            --publish-run-id "$PUBLISH_RUN_ID"
        else
          gh attestation verify "oci://${IMAGE_REPOSITORY}@${DIGEST}" \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "$SOURCE_REPOSITORY/$SIGNER_WORKFLOW" \
            --source-digest "$SOURCE_SHA" \
            --source-ref refs/heads/main \
            --format json > "$RUNNER_TEMP/verified-attestation.json"
          jq -e \
            --arg repository "https://github.com/$SOURCE_REPOSITORY" \
            --arg workflow "$SIGNER_WORKFLOW" '
              length > 0 and all(.[].verificationResult.statement.predicate;
                .buildDefinition.externalParameters.workflow.repository == $repository and
                .buildDefinition.externalParameters.workflow.path == $workflow and
                .buildDefinition.externalParameters.workflow.ref == "refs/heads/main")
            ' "$RUNNER_TEMP/verified-attestation.json" >/dev/null
        fi
    - name: Reconcile and push candidate state
      shell: bash
      env:
        BRANCH: ${{ steps.request.outputs.branch }}
        VERSION: ${{ steps.request.outputs.version }}
        ALLOW_FROZEN: ${{ steps.request.outputs.allow_frozen }}
      run: |
        set -euo pipefail
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        remote_exists=false
        if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
          remote_exists=true
        fi

        # Every dispatch gets its own run. If two component publications race,
        # a rejected push refetches the winner and reapplies this component so
        # neither event can disappear in GitHub's one-pending concurrency queue.
        pushed=false
        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if [[ "$remote_exists" == true ]]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -B "$BRANCH" origin/main
          fi
          update_args=(
            --version "$VERSION"
            --component "$COMPONENT"
            --digest "$DIGEST"
            --source-sha "$SOURCE_SHA"
          )
          if [[ "$COMPONENT" == "sessions-pipeline" ]]; then
            update_args+=(--publish-run-id "$PUBLISH_RUN_ID")
          fi
          if [[ "$ALLOW_FROZEN" == "true" ]]; then
            update_args+=(--allow-frozen)
          fi
          python3 "$RUNNER_TEMP/update-release-candidate.py" update "${update_args[@]}"
          git add "releases/agent-relay-${VERSION}"
          if ! git diff --cached --quiet; then
            git commit -m "release(agent-relay): candidate ${COMPONENT} pin"
          fi
          if git push origin "HEAD:${BRANCH}"; then
            pushed=true
            break
          fi
          remote_exists=true
          echo "Concurrent candidate update detected; retrying (${attempt}/5)."
        done
        [[ "$pushed" == true ]] \
          || { echo "::error::Could not reconcile the candidate branch after 5 attempts."; exit 1; }
    - name: Open or update the release pull request
      id: pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ steps.pusher.outputs.token }}
        BRANCH: ${{ steps.request.outputs.branch }}
        VERSION: ${{ steps.request.outputs.version }}
      run: |
        set -euo pipefail
        synchronized=false
        pr_number=""
        for attempt in 1 2 3 4 5; do
          # Render only from the latest remote candidate state. If another
          # run pushes while this body is being written, detect the new head
          # afterward and repeat so an older table cannot win the race.
          git fetch origin "$BRANCH"
          head_before="$(git rev-parse FETCH_HEAD)"
          git show "${head_before}:releases/agent-relay-${VERSION}/pins.json" \
            > "$RUNNER_TEMP/latest-pins.json"
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$BRANCH" --limit 100 --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json body --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
          else
            # shellcheck disable=SC2016 # the backticks are literal Markdown
            {
              printf 'Tracking PR for **agent-relay-%s**. Candidate pins are provenance-verified; acceptance and approval are separate release gates.\n\n' "$VERSION"
              printf '## After the release publishes: move the install guides to it\n\n'
              printf -- '- [ ] infra `docs/azure-install/README.md` and `docs/gcp-install/` (release, tag commit, chart tgz)\n'
              printf -- '- [ ] agentrelay.com `web/content/self-hosting/install-{aks,gke,eks}.md`, the image pins in `web/public/self-hosting/files/eks/values.yaml`, then `node web/scripts/selfhost-files.mjs write`\n'
              printf -- '- [ ] relay-agent `npm run selfhost-docs:sync -- --ref <agentrelay.com main>` and `npm run build:knowledge`\n'
              printf -- '- [ ] render each guide against the published assets (checksums OK, images match this release'"'"'s pins); say "render-only" unless it was installed\n'
            } > "$RUNNER_TEMP/pr-body.md"
          fi
          python3 "$RUNNER_TEMP/update-release-candidate.py" render-body \
            --pins "$RUNNER_TEMP/latest-pins.json" \
            --body "$RUNNER_TEMP/pr-body.md" \
            --output "$RUNNER_TEMP/updated-pr-body.md"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/updated-pr-body.md"
          elif url="$(gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$BRANCH" \
            --title "Release agent-relay-${VERSION}" \
            --body-file "$RUNNER_TEMP/updated-pr-body.md")"; then
            pr_number="${url##*/}"
          else
            # A concurrent first-component run may have created it.
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --head "$BRANCH" --limit 100 --json number --jq '.[0].number // empty')"
            [[ -n "$pr_number" ]] \
              || { echo "::error::Could not create or find the release PR."; exit 1; }
          fi
          git fetch origin "$BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" == "$head_before" ]]; then
            synchronized=true
            break
          fi
          echo "Candidate changed while updating its PR table; retrying (${attempt}/5)."
        done
        [[ "$synchronized" == true ]] \
          || { echo "::error::Could not synchronize the candidate PR table after 5 attempts."; exit 1; }
        url="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
        {
          echo "url=$url"
          echo "number=$pr_number"
          echo "head_sha=$head_before"
        } >> "$GITHUB_OUTPUT"
        printf 'Updated %s with `%s@%s`.\n' "$url" "$COMPONENT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
    - name: Request exact-head full acceptance
      shell: bash
      env:
        GH_TOKEN: ${{ steps.pusher.outputs.token }}
        PR_NUMBER: ${{ steps.pull_request.outputs.number }}
        HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
        VERSION: ${{ steps.request.outputs.version }}
      run: |
        set -euo pipefail
        gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
          -f event_type=release-candidate-acceptance \
          -F "client_payload[pr_number]=$PR_NUMBER" \
          -f "client_payload[version]=$VERSION" \
          -f "client_payload[head_sha]=$HEAD_SHA"
    permissions:
      contents: write
      pull-requests: write
      packages: read
      attestations: read
  tag:
    if: inputs.stage == 'tag'
    needs:
    - gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
    - name: Require a merged release pull request (the source's event filter)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] \
          || { echo "::error::pr_number must be a pull request number."; exit 1; }
        pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
        jq -e --arg repo "$GITHUB_REPOSITORY" '
          .merged == true and .base.ref == "main" and
          .head.repo.full_name == $repo and
          (.head.ref | startswith("release/agent-relay-"))
        ' <<<"$pr" >/dev/null \
          || { echo "::error::#$PR_NUMBER is not a merged release/agent-relay-* pull request into main."; exit 1; }
        gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
          --jq '.[].filename' | grep '^releases/' >/dev/null \
          || { echo "::error::#$PR_NUMBER changes nothing under releases/."; exit 1; }
    - name: Check out the trusted release gate
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ needs.gate.outputs.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Fetch and validate the exact-head gate evidence
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        evidence="$RUNNER_TEMP/release-gate"
        mkdir -p "$evidence"
        gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$evidence/pr.json"
        gh api --paginate --slurp \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
          > "$evidence/reviews.json"
        gh api --paginate --slurp \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
          > "$evidence/files.json"
        head_sha="$(jq -er '.head.sha' "$evidence/pr.json")"
        gh api \
          -H "Accept: application/vnd.github+json" \
          "repos/$GITHUB_REPOSITORY/commits/${head_sha}/check-runs?check_name=acceptance&filter=all&per_page=100" \
          > "$evidence/checks.json"
        external_id="$(jq -er --arg head "$head_sha" '
          [.check_runs[] |
            select(.name == "acceptance" and .head_sha == $head and
                   .app.slug == "github-actions")] |
          if length > 0 then max_by(.id) else error("acceptance check missing") end |
          select(.status == "completed" and .conclusion == "success") |
          .external_id
        ' "$evidence/checks.json")"
        [[ "$external_id" =~ ^agent-relay-acceptance:([1-9][0-9]*):${head_sha}$ ]]
        run_id="${BASH_REMATCH[1]}"
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}" \
          > "$evidence/acceptance-run.json"
        python3 scripts/release/validate-release-candidate-gate.py \
          --repository "$GITHUB_REPOSITORY" \
          --pr "$evidence/pr.json" \
          --reviews "$evidence/reviews.json" \
          --files "$evidence/files.json" \
          --checks "$evidence/checks.json" \
          --acceptance-run "$evidence/acceptance-run.json" \
          > "$evidence/selection.json"
        authorized_approval=false
        while IFS= read -r approver; do
          can_push="$(gh api \
            "repos/$GITHUB_REPOSITORY/collaborators/$approver/permission" \
            --jq '.user.permissions.push // false')"
          if [[ "$can_push" == "true" ]]; then
            authorized_approval=true
          fi
        done < <(jq -er '.approvers[]' "$evidence/selection.json")
        [[ "$authorized_approval" == "true" ]] \
          || { echo "::error::No exact-head approver has repository push permission."; exit 1; }
        {
          echo "version=$(jq -er .version "$evidence/selection.json")"
          echo "head_sha=$(jq -er .headSha "$evidence/selection.json")"
          echo "merge_sha=$(jq -er .mergeSha "$evidence/selection.json")"
        } >> "$GITHUB_OUTPUT"
    - name: Mint repository-scoped tag token
      id: pusher
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
      with:
        app-id: ${{ secrets.GH_APP_PUSHER_ID }}
        private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: infra
        permission-contents: write
    - name: Check out the accepted merge commit
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ steps.gate.outputs.merge_sha }}
        fetch-depth: 0
        fetch-tags: true
        token: ${{ steps.pusher.outputs.token }}
    - name: Validate candidate files and push the strict SemVer tag
      shell: bash
      env:
        VERSION: ${{ steps.gate.outputs.version }}
        HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        MERGE_SHA: ${{ steps.gate.outputs.merge_sha }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
        git fetch --no-tags origin main
        git merge-base --is-ancestor "$MERGE_SHA" origin/main
        git fetch --no-tags origin \
          "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/accepted-release-head"
        [[ "$(git rev-parse refs/remotes/origin/accepted-release-head)" == "$HEAD_SHA" ]]
        [[ "$(git rev-parse "$HEAD_SHA^{tree}")" == "$(git rev-parse "$MERGE_SHA^{tree}")" ]] \
          || { echo "::error::Accepted head and tagged merge trees differ."; exit 1; }
        candidate="releases/agent-relay-${VERSION}"
        [[ -f "$candidate/pins.json" && -f "$candidate/values.yaml" ]]
        jq -e --arg version "$VERSION" \
          '.schema == 1 and .version == $version and (.pins | type == "object" and length > 0)' \
          "$candidate/pins.json" >/dev/null

        tag="agent-relay-${VERSION}"
        existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
        if [[ -n "$existing" ]]; then
          [[ "$existing" == "$MERGE_SHA" ]] \
            || { echo "::error::$tag already points to a different commit."; exit 1; }
          echo "$tag already points to the accepted merge commit."
          exit 0
        fi
        git tag "$tag" "$MERGE_SHA"
        git push origin "refs/tags/$tag"
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    concurrency:
      group: fast-path-tag-${{ inputs.pr_number }}
      cancel-in-progress: false
