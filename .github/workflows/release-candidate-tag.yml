name: Tag accepted Agent Relay release candidate

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - "releases/**"

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: tag-agent-relay-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/agent-relay-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted release gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and validate the exact-head gate evidence
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/release-gate"
          mkdir -p "$evidence"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$evidence/pr.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$evidence/reviews.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$evidence/files.json"
          head_sha="$(jq -er '.head.sha' "$evidence/pr.json")"
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/${head_sha}/check-runs?check_name=acceptance&filter=all&per_page=100" \
            > "$evidence/checks.json"
          external_id="$(jq -er --arg head "$head_sha" '
            [.check_runs[] |
              select(.name == "acceptance" and .head_sha == $head and
                     .app.slug == "github-actions")] |
            if length > 0 then max_by(.id) else error("acceptance check missing") end |
            select(.status == "completed" and .conclusion == "success") |
            .external_id
          ' "$evidence/checks.json")"
          [[ "$external_id" =~ ^agent-relay-acceptance:([1-9][0-9]*):${head_sha}$ ]]
          run_id="${BASH_REMATCH[1]}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}" \
            > "$evidence/acceptance-run.json"
          python3 scripts/release/validate-release-candidate-gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$evidence/pr.json" \
            --reviews "$evidence/reviews.json" \
            --files "$evidence/files.json" \
            --checks "$evidence/checks.json" \
            --acceptance-run "$evidence/acceptance-run.json" \
            > "$evidence/selection.json"
          authorized_approval=false
          while IFS= read -r approver; do
            can_push="$(gh api \
              "repos/$GITHUB_REPOSITORY/collaborators/$approver/permission" \
              --jq '.user.permissions.push // false')"
            if [[ "$can_push" == "true" ]]; then
              authorized_approval=true
            fi
          done < <(jq -er '.approvers[]' "$evidence/selection.json")
          [[ "$authorized_approval" == "true" ]] \
            || { echo "::error::No exact-head approver has repository push permission."; exit 1; }
          {
            echo "version=$(jq -er .version "$evidence/selection.json")"
            echo "head_sha=$(jq -er .headSha "$evidence/selection.json")"
            echo "merge_sha=$(jq -er .mergeSha "$evidence/selection.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Mint repository-scoped tag token
        id: pusher
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.GH_APP_PUSHER_ID }}
          private-key: ${{ secrets.GH_APP_PUSHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: infra
          permission-contents: write

      - name: Check out the accepted merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.gate.outputs.merge_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.pusher.outputs.token }}

      - name: Validate candidate files and push the strict SemVer tag
        shell: bash
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          MERGE_SHA: ${{ steps.gate.outputs.merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/accepted-release-head"
          [[ "$(git rev-parse refs/remotes/origin/accepted-release-head)" == "$HEAD_SHA" ]]
          [[ "$(git rev-parse "$HEAD_SHA^{tree}")" == "$(git rev-parse "$MERGE_SHA^{tree}")" ]] \
            || { echo "::error::Accepted head and tagged merge trees differ."; exit 1; }
          candidate="releases/agent-relay-${VERSION}"
          [[ -f "$candidate/pins.json" && -f "$candidate/values.yaml" ]]
          jq -e --arg version "$VERSION" \
            '.schema == 1 and .version == $version and (.pins | type == "object" and length > 0)' \
            "$candidate/pins.json" >/dev/null

          tag="agent-relay-${VERSION}"
          existing="$(git ls-remote --tags origin "refs/tags/$tag" | awk '{print $1}')"
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$MERGE_SHA" ]] \
              || { echo "::error::$tag already points to a different commit."; exit 1; }
            echo "$tag already points to the accepted merge commit."
            exit 0
          fi
          git tag "$tag" "$MERGE_SHA"
          git push origin "refs/tags/$tag"
