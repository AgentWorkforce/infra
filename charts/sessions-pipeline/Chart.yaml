apiVersion: v2
name: sessions-pipeline
type: application
version: 0.8.4
# The Sessions Pipeline services image version the app subcharts default to.
appVersion: "0.1.0"
description: >
  The sessions pipeline in one release: the sessions-pipeline-worker and
  session-ingest-api app charts, plus optional Postgres (CloudNativePG Cluster),
  session-object-storage (MinIO) and an OpenTelemetry collector. Hook-free, so `helm install` and
  Alchemy's `helm template --no-hooks` + server-side apply behave the same.
  Requires the CloudNativePG operator when hoopdb.enabled (see deps/PINS.md).
annotations:
  artifacthub.io/license: Apache-2.0
  agentworkforce.dev/license-scope: "First-party chart code only; dependencies and images retain their own licenses."
home: https://github.com/AgentWorkforce/sessions-pipeline
keywords: [sessions-pipeline, sessions, pipeline, agentworkforce]
maintainers:
  - name: AgentWorkforce
    url: https://github.com/AgentWorkforce/infra
sources:
  - https://github.com/AgentWorkforce/infra/tree/main/charts/sessions-pipeline
# Third-party versions MUST match deps/pins.txt (scripts/ci/deps.sh checks).
dependencies:
  - name: sessions-pipeline-worker
    version: 0.7.2
    repository: file://../sessions-pipeline-worker
    alias: worker
  - name: session-ingest-api
    alias: alleyoop # retained values key; the published chart name is descriptive
    version: 0.4.1
    repository: file://../session-ingest-api
  - name: session-read-api
    alias: sessionReadApi
    version: 0.2.1
    repository: file://../session-read-api
    condition: sessionReadApi.enabled
  - name: cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    alias: hoopdb
    condition: hoopdb.enabled
  - name: minio
    version: 5.4.0
    repository: https://charts.min.io/
    alias: session-object-storage
    condition: session-object-storage.enabled
  - name: opentelemetry-collector
    version: 0.178.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    alias: otel
    condition: otel.enabled
