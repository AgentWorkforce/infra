{{- $c := .Values.readApi -}}
{{- if not (kindIs "bool" $c.enabled) }}{{ fail "readApi.enabled must be a boolean" }}{{ end -}}
{{- if $c.enabled -}}
{{- $name := default (printf "%s-read-api" .Release.Name) $c.fullnameOverride -}}
{{- if or (gt (len $name) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name)) }}{{ fail "readApi.fullnameOverride must be a DNS label of at most 63 characters" }}{{ end -}}
{{- $repository := required "readApi.image.repository is required" $c.image.repository -}}
{{- $digest := required "readApi.image.digest requires an owner-approved compatible image" $c.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "readApi.image.digest must be sha256:<64 lowercase hex characters>" }}{{ end -}}
{{- $secret := required "readApi.config.existingSecret is required" $c.config.existingSecret -}}
{{- $key := required "readApi.config.key is required" $c.config.key -}}
{{- $origin := required "readApi.origin is required" $c.origin -}}
{{- /* Same public service-origin contract as relay-cloud-api. Keep this
standalone chart independent of the API subchart's template namespace. */ -}}
{{- $publicOriginPattern := "^https://([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(:[0-9]{1,5})?$" -}}
{{- if or (not (regexMatch $publicOriginPattern $origin)) (regexMatch "(?i)\\.(localhost|local|internal|lan|invalid|test|example|home\\.arpa|onion)(:[0-9]{1,5})?$" $origin) (regexMatch "(?i)\\.example\\.(com|net|org)(:[0-9]{1,5})?$" $origin) }}{{ fail "readApi.origin must be a public HTTPS origin with multi-label DNS and no credentials, path, query, or fragment" }}{{ end -}}
{{- $portToken := regexFind ":[0-9]+$" $origin -}}
{{- if and $portToken (or (lt (int (trimPrefix ":" $portToken)) 1) (gt (int (trimPrefix ":" $portToken)) 65535)) }}{{ fail "readApi.origin port must be between 1 and 65535" }}{{ end -}}
{{- $backend := required "readApi.search.backend requires an explicit registered adapter" (trim $c.search.backend) -}}
{{- $since := required "readApi.completeSince requires an explicit coverage floor" $c.completeSince -}}
{{- if not (kindIs "string" $c.directoryWorkspaces) }}{{ fail "readApi.directoryWorkspaces must be a string" }}{{ end -}}
{{- $workspaces := required "readApi.directoryWorkspaces requires an explicit workspace allowlist" (trim $c.directoryWorkspaces) -}}
{{- if contains "*" $workspaces }}{{ fail "readApi.directoryWorkspaces must be an explicit allowlist string without '*'" }}{{ end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $c.port))) (lt (int $c.port) 1) (gt (int $c.port) 65535) }}{{ fail "readApi.port must be an integer from 1 to 65535" }}{{ end -}}
{{- if not (has $c.probeRuntime (list "bun" "node")) }}{{ fail "readApi.probeRuntime must be bun or node" }}{{ end -}}
{{- if not (kindIs "bool" $c.auth.relaycontrol.enabled) }}{{ fail "readApi.auth.relaycontrol.enabled must be a boolean" }}{{ end -}}
{{- $jwks := required "readApi.auth.relayauth.jwksUrl must explicitly configure the temporary issuer" (trim $c.auth.relayauth.jwksUrl) -}}
{{- $issuer := required "readApi.auth.relayauth.issuer must explicitly configure the temporary issuer" (trim $c.auth.relayauth.issuer) -}}
{{- $reserved := list "SERVICE" "RELAYHISTORY_SELFHOST_READ_API" "RELAYHISTORY_READ_API_PORT" "RELAYHISTORY_READ_API_SECRET" "READ_API_ORIGIN" "READ_API_COMPLETE_SINCE" "READ_API_DIRECTORY_WORKSPACES" "SEARCH_INDEX_BACKEND" "ALLOW_IN_CLUSTER_HTTP" "RELAYAUTH_JWKS_URL" "RELAYAUTH_ISSUER" "RELAYHISTORY_ACCEPT_RELAYCONTROL_TOKENS" "RELAYCONTROL_INTROSPECT_URL" "RELAYCONTROL_INTROSPECT_SECRET" -}}
{{- $seen := dict -}}
{{- range $e := $c.extraEnv -}}
{{- $envName := required "readApi.extraEnv entries require name" $e.name -}}
{{- if or (has $envName $reserved) (hasKey $seen $envName) }}{{ fail (printf "readApi.extraEnv duplicates a managed or repeated variable: %s" $envName) }}{{ end -}}
{{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_]*$" $envName) }}{{ fail "readApi.extraEnv has an invalid variable name" }}{{ end -}}
{{- if eq (hasKey $e "value") (hasKey $e "valueFrom") }}{{ fail "readApi.extraEnv requires exactly one of value or valueFrom" }}{{ end -}}
{{- if regexMatch "(?i)(^|_)(SECRET|TOKEN|PASSWORD|CREDENTIAL|DSN|API_KEY)$" $envName -}}
{{- if hasKey $e "value" }}{{ fail "sensitive readApi.extraEnv settings require valueFrom.secretKeyRef, never inline values" }}{{ end -}}
{{- if not (kindIs "map" $e.valueFrom) }}{{ fail "sensitive readApi.extraEnv settings require valueFrom.secretKeyRef" }}{{ end -}}
{{- if or (ne (len $e.valueFrom) 1) (not (hasKey $e.valueFrom "secretKeyRef")) }}{{ fail "sensitive readApi.extraEnv settings require valueFrom.secretKeyRef" }}{{ end -}}
{{- $ref := $e.valueFrom.secretKeyRef -}}
{{- if not (kindIs "map" $ref) }}{{ fail "readApi.extraEnv secretKeyRef must be an object" }}{{ end -}}
{{- if or (not (kindIs "string" $ref.name)) (not $ref.name) (not (kindIs "string" $ref.key)) (not $ref.key) }}{{ fail "readApi.extraEnv secretKeyRef requires nonempty string name and key" }}{{ end -}}
{{- end -}}
{{- $_ := set $seen $envName true -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-read-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: read-api
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  replicas: {{ $c.replicas }}
  selector:
    matchLabels: &selector
      app.kubernetes.io/name: session-read-api
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: read-api
  template:
    metadata:
      labels: *selector
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with $c.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: read-api
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: {{ $c.port }}, protocol: TCP }
          env:
            - { name: SERVICE, value: session-read-api }
            - { name: RELAYHISTORY_SELFHOST_READ_API, value: "true" }
            - { name: RELAYHISTORY_READ_API_PORT, value: {{ $c.port | quote }} }
            - name: RELAYHISTORY_READ_API_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $secret | quote }}, key: {{ $key | quote }} }
            - { name: READ_API_ORIGIN, value: {{ $origin | quote }} }
            - { name: READ_API_COMPLETE_SINCE, value: {{ $since | quote }} }
            - { name: READ_API_DIRECTORY_WORKSPACES, value: {{ $workspaces | quote }} }
            - { name: SEARCH_INDEX_BACKEND, value: {{ $backend | quote }} }
            - { name: ALLOW_IN_CLUSTER_HTTP, value: {{ $c.allowInClusterHttp | quote }} }
            - { name: RELAYAUTH_JWKS_URL, value: {{ $jwks | quote }} }
            - { name: RELAYAUTH_ISSUER, value: {{ $issuer | quote }} }
            - { name: RELAYHISTORY_ACCEPT_RELAYCONTROL_TOKENS, value: {{ $c.auth.relaycontrol.enabled | quote }} }
            {{- if $c.auth.relaycontrol.enabled }}
            - name: RELAYCONTROL_INTROSPECT_URL
              value: {{ required "readApi.auth.relaycontrol.url is required" $c.auth.relaycontrol.url | quote }}
            - name: RELAYCONTROL_INTROSPECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "readApi.auth.relaycontrol.existingSecret is required" $c.auth.relaycontrol.existingSecret | quote }}
                  key: {{ required "readApi.auth.relaycontrol.key is required" $c.auth.relaycontrol.key | quote }}
            {{- end }}
            {{- range $e := $c.extraEnv }}
            - name: {{ $e.name | quote }}
              {{- if hasKey $e "value" }}
              value: {{ $e.value | quote }}
              {{- else }}
              valueFrom:
                {{- toYaml $e.valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          # Dormant services return HTTP 200 but enabled:false. A status-only
          # readiness probe would falsely accept the disabled runtime.
          readinessProbe:
            exec:
              command:
                - {{ $c.probeRuntime | quote }}
                - -e
                - fetch('http://127.0.0.1:'+process.env.RELAYHISTORY_READ_API_PORT+'/healthz',{signal:AbortSignal.timeout(1500)}).then(async r=>{const v=await r.json();process.exit(r.ok&&v.ok===true&&v.enabled===true?0:1)}).catch(()=>process.exit(1))
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- with $c.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- with $c.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-read-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: read-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: session-read-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: read-api
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- end }}
