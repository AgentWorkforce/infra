{{- include "sessions-pipeline.analytics.validate" .Values.nativeConsumer.analytics -}}
{{- /* The native consumer's Locker slot is S3/MinIO only; it cannot read an Azure ingest edge. */ -}}
{{- if and .Values.nativeConsumer.enabled (eq .Values.ingestEdge.locker.provider "azure") }}{{ fail "ingestEdge.locker.provider=azure does not support nativeConsumer.enabled=true (its Locker settings are S3/MinIO only); use searchIndexer" }}{{ end -}}
{{- include "sessions-pipeline.nativeConsumer.validate" . -}}
{{- $c := mergeOverwrite (deepCopy .Values.nativeConsumer) (include "sessions-pipeline.rdsCa.block" (dict "root" . "block" "nativeConsumer") | fromJson) -}}
{{- if $c.enabled -}}
{{- $name := include "sessions-pipeline.nativeConsumer.name" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sessions-pipeline.nativeConsumer.contractName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-pipeline-consumer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: native-consumer
immutable: true
data:
  preflight.mjs: |
{{ .Files.Get "files/native-consumer/preflight.mjs" | indent 4 }}
  probe.mjs: |
{{ .Files.Get "files/native-consumer/probe.mjs" | indent 4 }}
{{- if or (not $c.bootstrap.enabled) (eq $c.bootstrap.phase "serve") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-pipeline-consumer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: native-consumer
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: &selector
      app.kubernetes.io/name: session-pipeline-consumer
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: native-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-pipeline-consumer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: native-consumer
        {{- if $c.analytics.enabled }}
        agentworkforce.dev/analytics-producer: "true"
        {{- end }}
      {{- with $c.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "sessions-pipeline.nativeConsumer.pod" (dict "root" . "bootstrap" false) | nindent 6 }}
{{- end }}
{{- end }}
