{{- $c := .Values.searchIndexer -}}
{{- if not (kindIs "bool" $c.enabled) }}{{ fail "searchIndexer.enabled must be a boolean" }}{{ end -}}
{{- if and (not (kindIs "invalid" $c.readerMaxRuleset)) (not (has (toString $c.readerMaxRuleset) (list "8" "9" "10"))) }}{{ fail "searchIndexer.readerMaxRuleset must be one of 8, 9, or 10" }}{{ end -}}
{{- if $c.enabled -}}
{{- $name := default (printf "%s-search-indexer" .Release.Name) $c.fullnameOverride -}}
{{- /* The bootstrap Job appends 19 characters; Job names are DNS-1123 labels. */ -}}
{{- if or (gt (len $name) 44) (not (regexMatch "^[a-z]([-a-z0-9]*[a-z0-9])?$" $name)) }}{{ fail "searchIndexer.fullnameOverride must be a DNS-1035 label of at most 44 characters" }}{{ end -}}
{{- $repository := required "searchIndexer.image.repository is required" $c.image.repository -}}
{{- $digest := required "searchIndexer.image.digest requires an owner-approved services image with the OpenSearch writer" $c.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "searchIndexer.image.digest must be sha256:<64 lowercase hex characters>" }}{{ end -}}
{{- $secret := required "searchIndexer.config.existingSecret is required" $c.config.existingSecret -}}
{{- $sa := required "searchIndexer.serviceAccount.name is required (the ServiceAccount the search indexer Pod Identity association names)" $c.serviceAccount.name -}}
{{- $since := required "searchIndexer.completeSince requires the same coverage floor as the read API" $c.completeSince -}}
{{- $backend := $c.search.backend -}}
{{- if not (has $backend (list "postgres" "opensearch")) }}{{ fail "searchIndexer.search.backend must be postgres or opensearch" }}{{ end -}}
{{- $backendId := required "searchIndexer.search.backendId requires the projection-state id shared with the read API" $c.search.backendId -}}
{{- $provider := $c.locker.provider -}}
{{- if not (has $provider (list "s3" "gcs")) }}{{ fail "searchIndexer.locker.provider must be s3 or gcs" }}{{ end -}}
{{- $_ := required "searchIndexer.locker.bucket is required" $c.locker.bucket -}}
{{- if and (eq $provider "gcs") $c.locker.endpoint }}{{ fail "searchIndexer.locker.endpoint must be empty for gcs" }}{{ end -}}
{{- if not (kindIs "slice" $c.extraEnv) }}{{ fail "searchIndexer.extraEnv must be a list" }}{{ end -}}
{{- $gcsNames := list "CLOUD_SQL_CONNECTION_NAME" "REDIS_HOST" "REDIS_PORT" "REDIS_AUTH_ENABLED" "REDIS_TRANSIT_ENCRYPTION" "REDIS_TLS_CA_PEM" "PUBSUB_TOPIC" "PUBSUB_SUBSCRIPTION" -}}
{{- $seen := dict -}}
{{- range $entry := $c.extraEnv -}}
{{- if or (not (kindIs "map" $entry)) (not (hasKey $entry "name")) }}{{ fail "searchIndexer.extraEnv entries must be Kubernetes env objects with name" }}{{ end -}}
{{- if hasKey $seen $entry.name }}{{ fail (printf "searchIndexer.extraEnv repeats %s" $entry.name) }}{{ end -}}
{{- $_ := set $seen $entry.name true -}}
{{- if not (has $entry.name $gcsNames) }}{{ fail (printf "searchIndexer.extraEnv %s is unsupported; only the managed GCS data-path settings are accepted" $entry.name) }}{{ end -}}
{{- end -}}
{{- if eq $provider "gcs" -}}
{{- range $name := $gcsNames }}{{ if not (hasKey $seen $name) }}{{ fail (printf "searchIndexer.locker.provider=gcs requires extraEnv %s" $name) }}{{ end }}{{ end -}}
{{- else if $c.extraEnv }}{{ fail "searchIndexer.extraEnv is only supported with locker.provider=gcs" }}{{ end -}}
{{- $facts := $c.outputFacts -}}
{{- if not (kindIs "bool" $facts.enabled) }}{{ fail "searchIndexer.outputFacts.enabled must be a boolean" }}{{ end -}}
{{- $factsJob := $facts.bootstrap -}}
{{- range $field, $flag := dict "enabled" $factsJob.enabled "allowPartial" $factsJob.allowPartial -}}
{{- if not (kindIs "bool" $flag) }}{{ fail (printf "searchIndexer.outputFacts.bootstrap.%s must be a boolean" $field) }}{{ end -}}
{{- end -}}
{{- if $factsJob.enabled -}}
{{- if not $facts.enabled }}{{ fail "searchIndexer.outputFacts.bootstrap.enabled requires searchIndexer.outputFacts.enabled=true: the Job only queues work for an indexer that writes facts" }}{{ end -}}
{{- if not $c.bootstrap.existingSecret }}{{ fail "searchIndexer.outputFacts.bootstrap.enabled requires searchIndexer.bootstrap.existingSecret (the schema owner connection)" }}{{ end -}}
{{- if not (and (kindIs "string" $factsJob.runId) (regexMatch "^([a-z0-9]([-a-z0-9]{0,18}[a-z0-9])?)?$" $factsJob.runId)) }}{{ fail "searchIndexer.outputFacts.bootstrap.runId must be empty or lowercase letters, digits and dashes (at most 20 characters)" }}{{ end -}}
{{- range $field, $n := dict "deadlineSeconds" $factsJob.deadlineSeconds "activeDeadlineSeconds" $factsJob.activeDeadlineSeconds -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $n))) (lt (int $n) 1) (gt (int $n) 172800) }}{{ fail (printf "searchIndexer.outputFacts.bootstrap.%s must be a positive integer number of seconds" $field) }}{{ end -}}
{{- end -}}
{{- if gt (int $factsJob.deadlineSeconds) 86400 }}{{ fail "searchIndexer.outputFacts.bootstrap.deadlineSeconds must be at most 86400" }}{{ end -}}
{{- if le (int $factsJob.activeDeadlineSeconds) (int $factsJob.deadlineSeconds) }}{{ fail "searchIndexer.outputFacts.bootstrap.activeDeadlineSeconds must exceed deadlineSeconds" }}{{ end -}}
{{- end -}}
{{- if and (not $c.bootstrap.enabled) (ne (toString $c.bootstrap.acknowledgeRunByOperator) "true") }}{{ fail "searchIndexer.bootstrap.enabled=false requires bootstrap.acknowledgeRunByOperator=true" }}{{ end -}}
{{- if $c.bootstrap.enabled -}}
{{- if ne (toString $c.bootstrap.backoffLimit) "0" }}{{ fail "searchIndexer.bootstrap.backoffLimit must be 0: catalog races retry inside one Pod and other failures require inspection" }}{{ end -}}
{{- if not (kindIs "bool" $c.bootstrap.waitForRuntimeRoleLogin) }}{{ fail "searchIndexer.bootstrap.waitForRuntimeRoleLogin must be a boolean" }}{{ end -}}
{{- range $field, $limit := dict "maxAttempts" 10 "delaySeconds" 60 -}}
{{- $value := index $c.bootstrap.catalogRetry $field -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $value))) (gt (int $value) $limit) }}{{ fail (printf "searchIndexer.bootstrap.catalogRetry.%s must be an integer from 1 through %d" $field $limit) }}{{ end -}}
{{- end -}}
{{- range $field, $limit := dict "roleWaitSeconds" 840 "rolePollSeconds" 60 -}}
{{- $value := index $c.bootstrap $field -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" (toString $value))) (gt (int $value) $limit) }}{{ fail (printf "searchIndexer.bootstrap.%s must be an integer from 1 through %d" $field $limit) }}{{ end -}}
{{- end -}}
{{- if gt (int $c.bootstrap.rolePollSeconds) (int $c.bootstrap.roleWaitSeconds) }}{{ fail "searchIndexer.bootstrap.rolePollSeconds must not exceed roleWaitSeconds" }}{{ end -}}
{{- end -}}
{{- if eq $backend "opensearch" -}}
{{- $url := required "searchIndexer.search.opensearch.url is required" $c.search.opensearch.url -}}
{{- if not (regexMatch "^https://[a-z0-9.-]+(:[0-9]{1,5})?$" $url) }}{{ fail "searchIndexer.search.opensearch.url must be an https endpoint with no path, credentials or query" }}{{ end -}}
{{- $_ := required "searchIndexer.search.opensearch.region is required" $c.search.opensearch.region -}}
{{- end -}}
{{- $tls := $c.postgres.tlsProfile -}}
{{- if not (has $tls (list "supabase" "custom-ca")) }}{{ fail "searchIndexer.postgres.tlsProfile must be supabase or custom-ca" }}{{ end -}}
{{- if eq $tls "custom-ca" -}}
{{- $_ := required "searchIndexer.postgres.caConfigMap is required for custom-ca" $c.postgres.caConfigMap -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $c.postgres.caSha256) }}{{ fail "searchIndexer.postgres.caSha256 must be 64 lowercase hex characters" }}{{ end -}}
{{- end -}}
{{- if $c.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-search-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with $c.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-search-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: search-indexer
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  # Never two reconcile loops at once.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: &selector
      app.kubernetes.io/name: session-search-indexer
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: search-indexer
  template:
    metadata:
      labels: *selector
      {{- with $c.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "sessions-pipeline.searchIndexer.pod" . | nindent 6 }}
      containers:
        - name: search-indexer
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          env:
            {{- include "sessions-pipeline.searchIndexer.env" (dict "root" . "c" $c "service" "session-pipeline-consumer" "secret" $secret "key" $c.config.key "outputFacts" $facts.enabled) | nindent 12 }}
            - { name: WORKER_HEALTH_PORT, value: {{ $c.healthPort | quote }} }
          ports:
            - { name: health, containerPort: {{ $c.healthPort }}, protocol: TCP }
          startupProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 15
            failureThreshold: 240
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          {{- include "sessions-pipeline.searchIndexer.container" . | nindent 10 }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- if $c.bootstrap.enabled }}
{{- $bootstrapSecret := required "searchIndexer.bootstrap.existingSecret requires the owner-connection secret" $c.bootstrap.existingSecret }}
{{- $bootstrapGuard := .Files.Get "files/search-indexer-bootstrap-guard.ts" }}
{{- $bootstrapGuardName := printf "%s-bootstrap-guard-%s" ($name | trunc 35 | trimSuffix "-") ($bootstrapGuard | sha256sum | trunc 8) }}
{{- /* The shared scrub contract renders into this Job outside $c. Keep it in
      the content address so each rollout phase creates a new immutable Job. */}}
{{- $bootstrapInputs := dict "searchIndexer" (omit $c "outputFacts") "scrubEngine" (.Values.global.scrubEngine | default dict) "guardSha256" ($bootstrapGuard | sha256sum) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $bootstrapGuardName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-search-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: search-indexer-bootstrap
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
immutable: true
data:
  bootstrap-guard.ts: |
    {{- $bootstrapGuard | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Any change to this block is a new Job: a Job's pod template is immutable,
  # and the bootstrap is idempotent.
  name: {{ printf "%s-bootstrap-%s" $name (toJson $bootstrapInputs | sha256sum | trunc 8) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-search-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: search-indexer-bootstrap
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  # The guard retries only the known PostgreSQL catalog race in this Pod. A
  # Kubernetes retry would leave an Error Pod and would retry unrelated faults.
  backoffLimit: 0
  activeDeadlineSeconds: {{ $c.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-search-indexer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: search-indexer-bootstrap
    spec:
      restartPolicy: Never
      {{- include "sessions-pipeline.searchIndexer.pod" (dict "root" . "bootstrapGuard" $bootstrapGuardName) | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args: ["exec bun run /app/bootstrap-guard/bootstrap-guard.ts"]
          env:
            {{- include "sessions-pipeline.searchIndexer.env" (dict "root" . "c" $c "service" "session-pipeline-consumer-bootstrap" "secret" $bootstrapSecret "key" $c.bootstrap.key) | nindent 12 }}
            - { name: SEARCH_BOOTSTRAP_CATALOG_RETRY_MAX_ATTEMPTS, value: {{ $c.bootstrap.catalogRetry.maxAttempts | quote }} }
            - { name: SEARCH_BOOTSTRAP_CATALOG_RETRY_DELAY_SECONDS, value: {{ $c.bootstrap.catalogRetry.delaySeconds | quote }} }
            - { name: SEARCH_BOOTSTRAP_WAIT_FOR_RUNTIME_ROLE_LOGIN, value: {{ $c.bootstrap.waitForRuntimeRoleLogin | quote }} }
            - { name: SEARCH_BOOTSTRAP_RUNTIME_ROLE_WAIT_SECONDS, value: {{ $c.bootstrap.roleWaitSeconds | quote }} }
            - { name: SEARCH_BOOTSTRAP_RUNTIME_ROLE_POLL_SECONDS, value: {{ $c.bootstrap.rolePollSeconds | quote }} }
          {{- include "sessions-pipeline.searchIndexer.container" (dict "root" . "bootstrapGuard" $bootstrapGuardName) | nindent 10 }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- if $factsJob.enabled }}
{{- $factsEnv := include "sessions-pipeline.searchIndexer.env" (dict "root" . "c" $c "service" "session-pipeline-output-facts-bootstrap" "secret" $c.bootstrap.existingSecret "key" $c.bootstrap.key "outputFacts" true) }}
{{- $factsPod := printf "restartPolicy: Never\n%s\ncontainers:\n  - name: output-facts-bootstrap\n    image: %s\n    imagePullPolicy: %s\n    env:\n      %s\n      - { name: RELAYHISTORY_SELFHOST_OUTPUT_FACTS_BOOTSTRAP_DEADLINE_SECONDS, value: %s }\n      - { name: RELAYHISTORY_SELFHOST_OUTPUT_FACTS_BOOTSTRAP_ALLOW_PARTIAL, value: %s }\n    %s%s" (include "sessions-pipeline.searchIndexer.pod" .) (printf "%s@%s" $repository $digest | quote) $c.image.pullPolicy ($factsEnv | nindent 6 | trim) (int $factsJob.deadlineSeconds | toString | quote) ($factsJob.allowPartial | toString | quote) (include "sessions-pipeline.searchIndexer.container" . | nindent 4 | trim) (ternary (printf "\n    resources:\n      %s" (toYaml $c.resources | nindent 6 | trim)) "" (not (empty $c.resources))) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Deterministic: a hash of the whole pod spec, the deadline and runId, so a
  # reapply with the same values never reruns it and any change to the
  # (immutable) pod template renders a new Job. Change runId to run it again.
  name: {{ printf "%s-output-facts-%s" ($name | trunc 41 | trimSuffix "-") (printf "%s\n%d\n%s" $factsPod (int $factsJob.activeDeadlineSeconds) $factsJob.runId | sha256sum | trunc 8) }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-search-indexer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: output-facts-bootstrap
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  # Exit 2 (refused) and 3 (incomplete) need an operator, not a retry.
  backoffLimit: 0
  activeDeadlineSeconds: {{ int $factsJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-search-indexer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: output-facts-bootstrap
    spec:
      {{- $factsPod | nindent 6 }}
{{- end }}
{{- end -}}
