{{- include "sessions-pipeline.analytics.validate" .Values.ingestEdge.analytics -}}
{{- $c := mergeOverwrite (deepCopy .Values.ingestEdge) (include "sessions-pipeline.rdsCa.block" (dict "root" . "block" "ingestEdge") | fromJson) -}}
{{- if not (kindIs "bool" $c.enabled) }}{{ fail "ingestEdge.enabled must be a boolean" }}{{ end -}}
{{- if and (not (kindIs "invalid" $c.readerMaxRuleset)) (not (has (toString $c.readerMaxRuleset) (list "8" "9" "10"))) }}{{ fail "ingestEdge.readerMaxRuleset must be one of 8, 9, or 10" }}{{ end -}}
{{- $ledger := include "sessions-pipeline.ingestEdge.ledger" . -}}
{{- if $c.enabled -}}
{{- if not (kindIs "bool" $c.claimLockBusy) }}{{ fail "ingestEdge.claimLockBusy must be a boolean" }}{{ end -}}
{{- if not (kindIs "bool" $c.s3TenantLimit) }}{{ fail "ingestEdge.s3TenantLimit must be a boolean" }}{{ end -}}
{{- if and $c.s3TenantLimit (ne $ledger "s3") }}{{ fail "ingestEdge.s3TenantLimit requires ingestEdge.ledger=s3" }}{{ end -}}
{{- if not (kindIs "invalid" $c.ledgerParallel) -}}
{{- if ne $ledger "s3" }}{{ fail "ingestEdge.ledgerParallel requires ingestEdge.ledger=s3" }}{{ end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $c.ledgerParallel))) (lt (int $c.ledgerParallel) 1) (gt (int $c.ledgerParallel) 64) }}{{ fail "ingestEdge.ledgerParallel must be an integer from 1 to 64" }}{{ end -}}
{{- end -}}
{{- if and (not (kindIs "invalid" $c.ledgerHomeGuard)) (not (kindIs "bool" $c.ledgerHomeGuard)) }}{{ fail "ingestEdge.ledgerHomeGuard must be a boolean" }}{{ end -}}
{{- if and $c.ledgerHomeGuard (ne $ledger "s3") }}{{ fail "ingestEdge.ledgerHomeGuard requires ingestEdge.ledger=s3" }}{{ end -}}
{{- $lb := $c.ledgerBucket | default dict -}}
{{- if not (kindIs "map" $lb) }}{{ fail "ingestEdge.ledgerBucket must be an object" }}{{ end -}}
{{- if $lb.bucket -}}
{{- if ne $ledger "s3" }}{{ fail "ingestEdge.ledgerBucket requires ingestEdge.ledger=s3" }}{{ end -}}
{{- if ne $c.locker.provider "s3" }}{{ fail "ingestEdge.ledgerBucket requires ingestEdge.locker.provider=s3" }}{{ end -}}
{{- if or (not (kindIs "string" $lb.bucket)) (not (regexMatch "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" $lb.bucket)) }}{{ fail "ingestEdge.ledgerBucket.bucket must be an S3 bucket name" }}{{ end -}}
{{- if eq $lb.bucket $c.locker.bucket }}{{ fail "ingestEdge.ledgerBucket.bucket must differ from ingestEdge.locker.bucket (leave it empty to keep the ledger there)" }}{{ end -}}
{{- if and $lb.region (not (regexMatch "^[a-z0-9-]{1,63}$" (toString $lb.region))) }}{{ fail "ingestEdge.ledgerBucket.region must be a region name" }}{{ end -}}
{{- else if $lb.region -}}
{{- fail "ingestEdge.ledgerBucket.region requires ingestEdge.ledgerBucket.bucket" -}}
{{- end -}}
{{- if not (kindIs "map" $c.admission) }}{{ fail "ingestEdge.admission must be an object" }}{{ end -}}
{{- $admission := $c.admission -}}
{{- if or (not (kindIs "string" $admission.mode)) (not (has $admission.mode (list "sync" "async" "drain"))) }}{{ fail "ingestEdge.admission.mode must be sync, async or drain" }}{{ end -}}
{{- range $field, $limit := dict "concurrency" (dict "value" $admission.concurrency "min" 1 "max" 32) "scanIntervalMs" (dict "value" $admission.scanIntervalMs "min" 1000 "max" 600000) "maxAttempts" (dict "value" $admission.maxAttempts "min" 1 "max" 100) -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $limit.value))) (lt (int $limit.value) (int $limit.min)) (gt (int $limit.value) (int $limit.max)) }}{{ fail (printf "ingestEdge.admission.%s must be an integer from %d to %d" $field (int $limit.min) (int $limit.max)) }}{{ end -}}
{{- end -}}
{{- if and (not (kindIs "invalid" $admission.probeTimeoutSeconds)) (or (not (regexMatch "^[0-9]+$" (toString $admission.probeTimeoutSeconds))) (lt (int $admission.probeTimeoutSeconds) 3) (gt (int $admission.probeTimeoutSeconds) 30)) }}{{ fail "ingestEdge.admission.probeTimeoutSeconds must be an integer from 3 to 30" }}{{ end -}}
{{- if and (not (kindIs "invalid" $admission.startupFailureThreshold)) (or (not (regexMatch "^[0-9]+$" (toString $admission.startupFailureThreshold))) (lt (int $admission.startupFailureThreshold) 30) (gt (int $admission.startupFailureThreshold) 900)) }}{{ fail "ingestEdge.admission.startupFailureThreshold must be an integer from 30 to 900" }}{{ end -}}
{{- if not (kindIs "invalid" $admission.asyncMaxPerOrg) -}}
{{- if or (not $c.s3TenantLimit) (eq $admission.mode "sync") }}{{ fail "ingestEdge.admission.asyncMaxPerOrg requires s3TenantLimit=true and admission.mode async or drain" }}{{ end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $admission.asyncMaxPerOrg))) (lt (int $admission.asyncMaxPerOrg) 1) (gt (int $admission.asyncMaxPerOrg) (int $admission.concurrency)) }}{{ fail "ingestEdge.admission.asyncMaxPerOrg must be an integer from 1 to admission.concurrency" }}{{ end -}}
{{- end -}}
{{- if not (kindIs "bool" $admission.awaitAuthority) }}{{ fail "ingestEdge.admission.awaitAuthority must be a boolean" }}{{ end -}}
{{- if and $admission.awaitAuthority (or (ne $ledger "s3") (eq $admission.mode "sync")) }}{{ fail "ingestEdge.admission.awaitAuthority requires ingestEdge.ledger=s3 and admission.mode async or drain" }}{{ end -}}
{{- if not (or (kindIs "invalid" $admission.spread) (kindIs "bool" $admission.spread)) }}{{ fail "ingestEdge.admission.spread must be a boolean" }}{{ end -}}
{{- if and $admission.spread (eq $admission.mode "sync") }}{{ fail "ingestEdge.admission.spread requires admission.mode async or drain" }}{{ end -}}
{{- if not (kindIs "invalid" $admission.spreadGraceMs) -}}
{{- if not $admission.spread }}{{ fail "ingestEdge.admission.spreadGraceMs requires ingestEdge.admission.spread=true" }}{{ end -}}
{{- if or (not (or (kindIs "int" $admission.spreadGraceMs) (kindIs "int64" $admission.spreadGraceMs) (kindIs "float64" $admission.spreadGraceMs))) (ne (float64 $admission.spreadGraceMs) (float64 (int64 $admission.spreadGraceMs))) (lt (int64 $admission.spreadGraceMs) 1000) (gt (int64 $admission.spreadGraceMs) 86400000) }}{{ fail "ingestEdge.admission.spreadGraceMs must be an integer from 1000 to 86400000" }}{{ end -}}
{{- end -}}
{{- if and (not (kindIs "invalid" $c.livenessTimeoutSeconds)) (or (not (regexMatch "^[0-9]+$" (toString $c.livenessTimeoutSeconds))) (lt (int $c.livenessTimeoutSeconds) 2) (gt (int $c.livenessTimeoutSeconds) 30)) }}{{ fail "ingestEdge.livenessTimeoutSeconds must be an integer from 2 to 30" }}{{ end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $c.replicas))) (lt (int $c.replicas) 1) (gt (int $c.replicas) 8) }}{{ fail "ingestEdge.replicas must be an integer from 1 to 8" }}{{ end -}}
{{- if and (gt (int $c.replicas) 1) (ne $ledger "s3") }}{{ fail "ingestEdge.replicas above 1 requires ingestEdge.ledger=s3" }}{{ end -}}
{{- if not (kindIs "bool" $c.createServiceAccount) }}{{ fail "ingestEdge.createServiceAccount must be a boolean" }}{{ end -}}
{{- if and $c.createServiceAccount (or (not $c.serviceAccountName) (gt (len $c.serviceAccountName) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $c.serviceAccountName))) }}{{ fail "ingestEdge.createServiceAccount requires a DNS-label serviceAccountName" }}{{ end -}}
{{- $upload := $c.uploadDirect -}}
{{- if not (has $upload.mode (list "off" "allowlist" "on")) }}{{ fail "ingestEdge.uploadDirect.mode must be off, allowlist or on" }}{{ end -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}$" $c.keyRoot) }}{{ fail "ingestEdge.keyRoot must follow relay-upload-inbox-v1" }}{{ end -}}
{{- if ne $upload.mode "off" -}}
{{- if ne $admission.mode "async" }}{{ fail "ingestEdge.uploadDirect requires admission.mode=async to keep SQL off the upload hot path" }}{{ end -}}
{{- if ne $c.locker.provider "s3" }}{{ fail "ingestEdge.uploadDirect currently requires S3-compatible storage" }}{{ end -}}
{{- if or (not $upload.witness.existingSecret) (not (regexMatch "^[A-Za-z0-9._-]+$" $upload.witness.key)) }}{{ fail "ingestEdge.uploadDirect.witness needs an existingSecret and data key" }}{{ end -}}
{{- if and (eq $upload.mode "allowlist") (empty $upload.allowlist) }}{{ fail "ingestEdge.uploadDirect.allowlist is required in allowlist mode" }}{{ end -}}
{{- range $entry := $upload.allowlist }}{{ if not (regexMatch "^(org|ws):[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$" $entry) }}{{ fail "ingestEdge.uploadDirect.allowlist entries must be org:<id> or ws:<id>" }}{{ end }}{{ end -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $upload.scanBatch))) (lt (int $upload.scanBatch) 1) (gt (int $upload.scanBatch) 2000) }}{{ fail "ingestEdge.uploadDirect.scanBatch must be 1..2000" }}{{ end -}}
{{- if and (not (kindIs "invalid" $upload.promoteConcurrency)) (or (not (regexMatch "^[0-9]+$" (toString $upload.promoteConcurrency))) (lt (int $upload.promoteConcurrency) 1) (gt (int $upload.promoteConcurrency) 64)) }}{{ fail "ingestEdge.uploadDirect.promoteConcurrency must be 1..64" }}{{ end -}}
{{- end -}}
{{- if not (kindIs "bool" $c.allowInClusterHttp) }}{{ fail "ingestEdge.allowInClusterHttp must be a boolean" }}{{ end -}}
{{- if hasKey $c "extraEnv" }}{{ fail "ingestEdge.extraEnv is not supported; use the managed configuration and Secret references" }}{{ end -}}
{{- if not (kindIs "bool" $c.networkPolicy.enabled) }}{{ fail "ingestEdge.networkPolicy.enabled must be a boolean" }}{{ end -}}
{{- $gateOnly := include "sessions-pipeline.gateOnly" . -}}
{{- include "sessions-pipeline.upstreamAssertion.validate" . -}}
{{- if and $gateOnly (not $c.networkPolicy.enabled) }}{{ fail "ingestEdge: global.relaygate.gateOnly.enabled requires ingestEdge.networkPolicy.enabled=true; without it every pod can upload without relaygate" }}{{ end -}}
{{- if not (kindIs "slice" ($c.networkPolicy.gateOnlyFrom | default list)) }}{{ fail "ingestEdge.networkPolicy.gateOnlyFrom must be a list" }}{{ end -}}
{{- if and $c.networkPolicy.enabled (not $gateOnly) (or (not (kindIs "slice" $c.networkPolicy.ingressFrom)) (empty $c.networkPolicy.ingressFrom)) }}{{ fail "ingestEdge.networkPolicy.enabled=true requires networkPolicy.ingressFrom" }}{{ end -}}
{{- $name := default (printf "%s-ingest-edge" .Release.Name) $c.fullnameOverride -}}
{{- if or (gt (len $name) 63) (not (regexMatch "^[a-z]([-a-z0-9]*[a-z0-9])?$" $name)) }}{{ fail "ingestEdge.fullnameOverride must be a DNS-1035 label of at most 63 characters" }}{{ end -}}
{{- $repository := required "ingestEdge.image.repository is required" $c.image.repository -}}
{{- $repositoryPattern := "^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(:[0-9]{1,5})?/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*(/[a-z0-9]+(([._]|__|-+)[a-z0-9]+)*)*$" -}}
{{- $registryHost := regexReplaceAll ":[0-9]+$" (first (splitList "/" $repository)) "" -}}
{{- if or (gt (len $registryHost) 253) (not (regexMatch $repositoryPattern $repository)) }}{{ fail "ingestEdge.image.repository must include an explicit registry DNS host and image path, without a scheme, tag or digest" }}{{ end -}}
{{- $registryPort := regexFind ":[0-9]+$" (first (splitList "/" $repository)) -}}
{{- if and $registryPort (or (lt (int (trimPrefix ":" $registryPort)) 1) (gt (int (trimPrefix ":" $registryPort)) 65535)) }}{{ fail "ingestEdge.image.repository has an invalid registry port" }}{{ end -}}
{{- $digest := required "ingestEdge.image.digest requires a qualified SERVICE=session-ingest image" $c.image.digest -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $digest) }}{{ fail "ingestEdge.image.digest must be sha256:<64 lowercase hex characters>" }}{{ end -}}
{{- $origin := required "ingestEdge.origin is required" $c.origin -}}
{{- $originPattern := "^https://([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?(:[0-9]{1,5})?$" -}}
{{- $originHost := regexReplaceAll ":[0-9]+$" (trimPrefix "https://" $origin) "" -}}
{{- if or (not (regexMatch $originPattern $origin)) (gt (len $originHost) 253) (regexMatch "\\.(localhost|local|internal|lan|invalid|test|example|home\\.arpa|onion)(:[0-9]{1,5})?$" $origin) (regexMatch "(^|\\.)example\\.(com|net|org)$" $originHost) (hasSuffix ":443" $origin) }}{{ fail "ingestEdge.origin must be a normalized public HTTPS origin (lowercase DNS, no default port, path, query or fragment)" }}{{ end -}}
{{- $originPort := regexFind ":[0-9]+$" $origin -}}
{{- if and $originPort (or (lt (int (trimPrefix ":" $originPort)) 1) (gt (int (trimPrefix ":" $originPort)) 65535)) }}{{ fail "ingestEdge.origin has an invalid port" }}{{ end -}}
{{- if and $originPort (or (eq (int (trimPrefix ":" $originPort)) 443) (ne $originPort (printf ":%d" (int (trimPrefix ":" $originPort))))) }}{{ fail "ingestEdge.origin port must be normalized without leading zeros or the default HTTPS port" }}{{ end -}}
{{- if and .Values.sessionReadApi.enabled (ne $origin .Values.sessionReadApi.origin) }}{{ fail "ingestEdge.origin must exactly equal sessionReadApi.origin when both services are enabled" }}{{ end -}}
{{- $introspect := include "sessions-pipeline.ingestEdge.endpoint" (dict "name" "ingestEdge.relaycontrol.url" "url" $c.relaycontrol.url "allowHttp" $c.allowInClusterHttp) -}}
{{- if not (kindIs "bool" $c.sessionSelection) }}{{ fail "ingestEdge.sessionSelection must be a boolean" }}{{ end -}}
{{- if not (kindIs "bool" $c.heartbeatAccept) }}{{ fail "ingestEdge.heartbeatAccept must be a boolean" }}{{ end -}}
{{- $provider := $c.locker.provider -}}
{{- if not (has $provider (list "s3" "gcs")) }}{{ fail "ingestEdge.locker.provider must be s3 or gcs" }}{{ end -}}
{{- $credentialMode := $c.locker.credentials.mode -}}
{{- if not (has $credentialMode (list "secret" "podIdentity")) }}{{ fail "ingestEdge.locker.credentials.mode must be secret or podIdentity" }}{{ end -}}
{{- $podIdentity := eq $credentialMode "podIdentity" -}}
{{- if and $podIdentity (not $c.serviceAccountName) }}{{ fail "ingestEdge.locker.credentials.mode=podIdentity requires serviceAccountName with a Pod Identity association" }}{{ end -}}
{{- if and $podIdentity $c.locker.existingSecret }}{{ fail "ingestEdge.locker.existingSecret must be empty with credentials.mode=podIdentity" }}{{ end -}}
{{- if and (eq $provider "gcs") (not $podIdentity) }}{{ fail "ingestEdge.locker.provider=gcs requires credentials.mode=podIdentity" }}{{ end -}}
{{- if and (eq $provider "gcs") $c.locker.endpoint }}{{ fail "ingestEdge.locker.endpoint must be empty for gcs" }}{{ end -}}
{{- $endpoint := "" -}}
{{- if or (not $podIdentity) $c.locker.endpoint -}}
{{- $endpoint = include "sessions-pipeline.ingestEdge.endpoint" (dict "name" "ingestEdge.locker.endpoint" "url" $c.locker.endpoint "allowHttp" $c.allowInClusterHttp) -}}
{{- end -}}
{{- $bucket := required "ingestEdge.locker.bucket is required" $c.locker.bucket -}}
{{- if not (kindIs "string" $bucket) }}{{ fail "ingestEdge.locker.bucket must be a nonempty literal string without surrounding whitespace" }}{{ end -}}
{{- if ne (trim $bucket) $bucket }}{{ fail "ingestEdge.locker.bucket must be a nonempty literal string without surrounding whitespace" }}{{ end -}}
{{- /* A subchart cannot see ingestEdge, so the shared bucket is checked here. */ -}}
{{- if .Values.sessionReadApi.enabled -}}
{{- range $e := .Values.sessionReadApi.extraEnv -}}
{{- if and (eq $e.name "LOCKER_BUCKET") (ne (toString $e.value) $bucket) }}{{ fail "sessionReadApi LOCKER_BUCKET must equal ingestEdge.locker.bucket when both services are enabled" }}{{ end -}}
{{- end -}}
{{- end -}}
{{- $region := required "ingestEdge.locker.region is required" $c.locker.region -}}
{{- $runtimeSecret := required "ingestEdge.config.existingSecret is required" $c.config.existingSecret -}}
{{- $storeSecret := "" -}}
{{- if not $podIdentity -}}
{{- $storeSecret = required "ingestEdge.locker.existingSecret is required" $c.locker.existingSecret -}}
{{- end -}}
{{- $tls := $c.postgres.tlsProfile | default "custom-ca" -}}
{{- if not (has $tls (list "supabase" "custom-ca")) }}{{ fail "ingestEdge.postgres.tlsProfile must be supabase or custom-ca" }}{{ end -}}
{{- $caMap := "" -}}
{{- $caHash := "" -}}
{{- if eq $tls "custom-ca" -}}
{{- $caMap = required "ingestEdge.postgres.caConfigMap is required (or let the agent-relay chart manage the RDS CA: global.rdsCa.bundle)" $c.postgres.caConfigMap -}}
{{- $caHash = required "ingestEdge.postgres.caSha256 is required (or let the agent-relay chart manage the RDS CA: global.rdsCa.bundle)" $c.postgres.caSha256 -}}
{{- if not (regexMatch "^[a-f0-9]{64}$" $caHash) }}{{ fail "ingestEdge.postgres.caSha256 must be 64 lowercase hex characters (or let the agent-relay chart manage the RDS CA: global.rdsCa.bundle)" }}{{ end -}}
{{- else if or $c.postgres.caConfigMap $c.postgres.caSha256 -}}
{{- fail "ingestEdge.postgres.tlsProfile=supabase pins the built-in Supabase CA; leave caConfigMap and caSha256 empty" -}}
{{- end -}}
{{- range $ref := compact (list $runtimeSecret $storeSecret $caMap) -}}
{{- if or (gt (len $ref) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $ref)) }}{{ fail "ingestEdge Secret and ConfigMap names must be Kubernetes DNS subdomains" }}{{ end -}}
{{- end -}}
{{- $secretKeys := list $c.config.databaseUrlKey $c.config.introspectSecretKey $c.postgres.caKey -}}
{{- if not $podIdentity }}{{ $secretKeys = concat $secretKeys (list $c.locker.accessKeyIdKey $c.locker.secretAccessKeyKey) }}{{ end -}}
{{- range $key := $secretKeys -}}
{{- if or (not $key) (not (regexMatch "^[A-Za-z0-9._-]+$" $key)) }}{{ fail "ingestEdge Secret/CA keys must be nonempty Kubernetes key names" }}{{ end -}}
{{- end -}}
{{- range $field, $n := dict "port" $c.port "poolMax" $c.postgres.poolMax "maxPerUser" $c.maxPerUser "maxPerOrg" $c.maxPerOrg -}}
{{- $max := ternary 65535 (ternary 32 1000 (eq $field "poolMax")) (eq $field "port") -}}
{{- $min := ternary 1024 1 (eq $field "port") -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $n))) (lt (int $n) $min) (gt (int $n) $max) }}{{ fail (printf "ingestEdge.%s is outside the supported integer range (%d-%d)" $field $min $max) }}{{ end -}}
{{- end -}}
{{- if $c.createServiceAccount }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace | quote }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-ingest-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-edge
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  {{- /* ingestEdge.replicas (default 1). Above 1 requires ledger=s3: the S3-ledger
  multi-writer proof passed locally (two processes, exactly-once); it does not
  cover the SQL ledger. Tenant caps are per replica, so halve per-replica caps. */}}
  replicas: {{ int $c.replicas }}
  # This does not order schema changes: an operator drain/migrate/verify barrier
  # is still required before changing the image/generation.
  strategy: { type: Recreate }
  selector:
    matchLabels: &selector
      app.kubernetes.io/name: session-ingest-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-ingest-edge
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingest-edge
        {{- if $c.analytics.enabled }}
        agentworkforce.dev/analytics-producer: "true"
        {{- end }}
      {{- $uaSum := include "sessions-pipeline.upstreamAssertion.checksum" . }}
      {{- if or $c.podAnnotations $uaSum }}
      annotations:
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $uaSum }}
        checksum/upstream-assertion: {{ . | quote }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      {{- with $c.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingest-edge
          image: {{ printf "%s@%s" $repository $digest | quote }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: http, containerPort: {{ $c.port }}, protocol: TCP }
          env:
            {{- include "sessions-pipeline.analytics.env" $c.analytics | nindent 12 }}
            {{- if or .Values.global.operatorSessionErase.fenceEnforced .Values.operatorSessionErase.api.enabled .Values.operatorSessionErase.bytes.enabled }}
            {{- include "sessions-pipeline.operatorSessionErase.ingestEnv" . | nindent 12 }}
            {{- end }}
            - { name: SERVICE, value: session-ingest }
            {{- with include "sessions-pipeline.upstreamAssertion.env" . }}{{ . | nindent 12 }}{{ end }}
            {{- include "sessions-pipeline.scrubEngine" (dict "root" . "localReader" $c.readerMaxRuleset "localName" "ingestEdge.readerMaxRuleset") | nindent 12 }}
            - { name: RELAYHISTORY_SELFHOST_INGEST, value: "true" }
            - { name: RELAYHISTORY_INGEST_PORT, value: {{ $c.port | quote }} }
            - { name: RELAYHISTORY_INGEST_ORIGIN, value: {{ $origin | quote }} }
            - { name: RELAYCONTROL_INTROSPECT_URL, value: {{ $introspect | quote }} }
            - name: RELAYCONTROL_INTROSPECT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $runtimeSecret | quote }}, key: {{ $c.config.introspectSecretKey | quote }} }
            - name: RELAYHISTORY_INGEST_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ $runtimeSecret | quote }}, key: {{ $c.config.databaseUrlKey | quote }} }
            - { name: SESSION_POSTGRES_TLS_PROFILE, value: {{ $tls | quote }} }
            {{- if eq $tls "custom-ca" }}
            - { name: SESSION_POSTGRES_CA_FILE, value: /etc/session-ingest-postgres/ca.crt }
            - { name: SESSION_POSTGRES_CA_SHA256, value: {{ $caHash | quote }} }
            {{- end }}
            - { name: RELAYHISTORY_INGEST_PG_POOL_MAX, value: {{ $c.postgres.poolMax | quote }} }
            - { name: ALLOW_IN_CLUSTER_HTTP, value: {{ $c.allowInClusterHttp | quote }} }
            - { name: LOCKER_PROVIDER, value: {{ $provider | quote }} }
            - { name: LOCKER_BUCKET, value: {{ $bucket | quote }} }
            {{- with $endpoint }}
            - { name: LOCKER_ENDPOINT, value: {{ . | quote }} }
            {{- end }}
            - { name: LOCKER_REGION, value: {{ $region | quote }} }
            {{- if not $podIdentity }}
            - name: LOCKER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $storeSecret | quote }}, key: {{ $c.locker.accessKeyIdKey | quote }} }
            - name: LOCKER_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $storeSecret | quote }}, key: {{ $c.locker.secretAccessKeyKey | quote }} }
            {{- end }}
            {{- if $c.sessionSelection }}
            - { name: RELAYHISTORY_SELFHOST_SESSION_SELECTION, value: "true" }
            {{- end }}
            {{- if $c.heartbeatAccept }}
            - { name: RELAYHISTORY_SELFHOST_HEARTBEAT_ACCEPT, value: "true" }
            {{- end }}
            - { name: INGEST_KEY_ROOT, value: {{ $c.keyRoot | quote }} }
            {{- if eq $ledger "s3" }}
            - { name: INGEST_LEDGER, value: "s3" }
            {{- if $c.s3TenantLimit }}
            - { name: INGEST_S3_TENANT_LIMIT, value: "on" }
            {{- end }}
            {{- if not (kindIs "invalid" $c.ledgerParallel) }}
            - { name: INGEST_LEDGER_PARALLEL, value: {{ $c.ledgerParallel | quote }} }
            {{- end }}
            {{- if $c.ledgerHomeGuard }}
            - { name: INGEST_LEDGER_HOME_GUARD, value: "on" }
            {{- end }}
            {{- with ($c.ledgerBucket | default dict).bucket }}
            - { name: INGEST_LEDGER_BUCKET, value: {{ . | quote }} }
            - { name: INGEST_LEDGER_REGION, value: {{ ($c.ledgerBucket.region | default $c.locker.region) | quote }} }
            {{- end }}
            {{- end }}
            - { name: INGEST_MAX_PER_USER, value: {{ $c.maxPerUser | quote }} }
            - { name: INGEST_MAX_PER_ORG, value: {{ $c.maxPerOrg | quote }} }
            {{- if $c.claimLockBusy }}
            - { name: INGEST_CLAIM_LOCK_BUSY, value: "on" }
            {{- end }}
            {{- if ne $admission.mode "sync" }}
            - { name: SELFHOST_INGEST_ADMISSION, value: {{ $admission.mode | quote }} }
            - { name: SELFHOST_ADMISSION_CONCURRENCY, value: {{ $admission.concurrency | quote }} }
            - { name: SELFHOST_ADMISSION_SCAN_MS, value: {{ $admission.scanIntervalMs | quote }} }
            - { name: SELFHOST_ADMISSION_MAX_ATTEMPTS, value: {{ $admission.maxAttempts | quote }} }
            {{- if not (kindIs "invalid" $admission.asyncMaxPerOrg) }}
            - { name: INGEST_ASYNC_MAX_PER_ORG, value: {{ $admission.asyncMaxPerOrg | quote }} }
            {{- end }}
            {{- if $admission.awaitAuthority }}
            - { name: SELFHOST_ADMISSION_AWAIT_AUTHORITY, value: "on" }
            {{- end }}
            {{- if $admission.spread }}
            - { name: SELFHOST_ADMISSION_SPREAD, value: "on" }
            {{- if not (kindIs "invalid" $admission.spreadGraceMs) }}
            - { name: SELFHOST_ADMISSION_SPREAD_GRACE_MS, value: {{ int64 $admission.spreadGraceMs | toString | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if ne $upload.mode "off" }}
            - { name: HISTORY_UPLOAD_DIRECT, value: {{ $upload.mode | quote }} }
            - { name: HISTORY_UPLOAD_DIRECT_ALLOWLIST, value: {{ join "," $upload.allowlist | quote }} }
            - { name: SELFHOST_UPLOAD_SCAN_BATCH, value: {{ $upload.scanBatch | quote }} }
            {{- if not (kindIs "invalid" $upload.promoteConcurrency) }}
            - { name: SELFHOST_UPLOAD_PROMOTE_CONCURRENCY, value: {{ $upload.promoteConcurrency | quote }} }
            {{- end }}
            - name: UPLOAD_WITNESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $upload.witness.existingSecret | quote }}, key: {{ $upload.witness.key | quote }} }
            {{- end }}
          startupProbe:
            {{- if eq $admission.mode "sync" }}
            httpGet: { path: /readyz, port: http }
            {{- else }}
            exec:
              command:
                - bun
                - -e
                - |
                  {{- include "sessions-pipeline.ingestEdge.admissionProbe" . | nindent 18 }}
            timeoutSeconds: {{ include "sessions-pipeline.ingestEdge.probeTimeoutSeconds" . }}
            {{- end }}
            failureThreshold: {{ $admission.startupFailureThreshold | default 30 }}
            periodSeconds: 2
          readinessProbe:
            {{- if eq $admission.mode "sync" }}
            httpGet: { path: /readyz, port: http }
            timeoutSeconds: 2
            {{- else }}
            exec:
              command:
                - bun
                - -e
                - |
                  {{- include "sessions-pipeline.ingestEdge.admissionProbe" . | nindent 18 }}
            timeoutSeconds: {{ include "sessions-pipeline.ingestEdge.probeTimeoutSeconds" . }}
            {{- end }}
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            timeoutSeconds: {{ $c.livenessTimeoutSeconds | default 2 }}
            periodSeconds: 10
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- include "sessions-pipeline.analytics.mount" $c.analytics | nindent 12 }}
            - { name: tmp, mountPath: /tmp }
            {{- if eq $tls "custom-ca" }}
            - { name: postgres-ca, mountPath: /etc/session-ingest-postgres, readOnly: true }
            {{- end }}
      volumes:
        {{- include "sessions-pipeline.analytics.volume" $c.analytics | nindent 8 }}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if eq $tls "custom-ca" }}
        - name: postgres-ca
          configMap:
            name: {{ $caMap | quote }}
            items: [{ key: {{ $c.postgres.caKey | quote }}, path: ca.crt }]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-ingest-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-edge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: session-ingest-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-edge
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
{{- if $c.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-ingest-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ingest-edge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: session-ingest-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ingest-edge
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if $gateOnly }}
        # Gate-only: relaygate (and networkPolicy.gateOnlyFrom). ingressFrom is ignored.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: relaygate
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with $c.networkPolicy.gateOnlyFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- toYaml $c.networkPolicy.ingressFrom | nindent 8 }}
        {{- end }}
      ports: [{ port: http }]
{{- end }}
{{- end }}
