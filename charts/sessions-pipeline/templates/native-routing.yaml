{{- include "sessions-pipeline.nativeRouting.validate" . -}}
{{- if .Values.nativeRouting.enabled -}}
{{- $c := .Values.nativeRouting -}}
{{- $host := (urlParse $c.origin).hostname -}}
{{- $reader := include "sessions-pipeline.nativeRouting.readerServiceName" . -}}
{{- $ingest := include "sessions-pipeline.nativeRouting.ingestServiceName" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sessions-pipeline.nativeRouting.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: session-native-routing
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: native-routing
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
spec:
  ingressClassName: {{ $c.className | quote }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ $c.tls.existingSecret | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if include "sessions-pipeline.gateOnly" . }}
          {{- $gate := include "sessions-pipeline.gateService" . }}
          {{- $gatePort := dig "relaygate" "gateOnly" "servicePort" 8080 (.Values.global | default dict) }}
          # Gate-only: the Sessions routes relaygate serves at the root for this
          # host (its proxy.sessionsHosts) go to relaygate, which forwards them
          # to the reader and ingest Services. Nothing else is routed.
          # Keep in step with the agent-relay umbrella's gate routes
          # (agent-relay.gate.historyPrefix and historyExact).
          {{- $prefixes := list "/v1/sessions" "/v1/delivery" "/v1/digest" }}
          {{- /* global.relaygate.gateOnly.relayfactsRoutes: needs a relaygate image that proxies them. */}}
          {{- if eq (dig "relaygate" "gateOnly" "relayfactsRoutes" false (.Values.global | default dict) | toString) "true" }}{{ $prefixes = concat $prefixes (list "/v1/relayfacts" "/v1/coordination") }}{{ end }}
          {{- range $path := $prefixes }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service: { name: {{ $gate }}, port: { number: {{ $gatePort }} } }
          {{- end }}
          {{- range $path := list "/v1/events" "/v1/ingest" "/v1/auth/token/refresh" "/v1/auth/token/revoke" "/v1/onboarding/heartbeat" "/v1/upload-consent" }}
          - path: {{ $path }}
            pathType: Exact
            backend:
              service: { name: {{ $gate }}, port: { number: {{ $gatePort }} } }
          {{- end }}
          {{- else }}
          # Specific Exact paths take precedence over the reader's /v1 Prefix.
          # Ingress selects paths only; native services enforce methods/auth.
          # An independent issuer's /internal handoff is never public.
          - path: /v1
            pathType: Prefix
            backend:
              service: { name: {{ $reader }}, port: { number: 80 } }
          - path: /v1/delivery/batches
            pathType: Exact
            backend:
              service: { name: {{ $ingest }}, port: { number: 80 } }
          - path: /v1/turns/batches
            pathType: Exact
            backend:
              service: { name: {{ $ingest }}, port: { number: 80 } }
          - path: /v1/delivery/limits
            pathType: Exact
            backend:
              service: { name: {{ $ingest }}, port: { number: 80 } }
          {{- if has .Values.ingestEdge.admission.mode (list "async" "drain") }}
          - path: /v1/delivery/admission
            pathType: Exact
            backend:
              service: { name: {{ $ingest }}, port: { number: 80 } }
          {{- end }}
          # Desktop renews through Control after this edge returns 401.
          # The reader returns 405 here and would leave uploads retrying forever.
          - path: /v1/auth/token/refresh
            pathType: Exact
            backend:
              service: { name: {{ $ingest }}, port: { number: 80 } }
          {{- end }}
{{- end }}
