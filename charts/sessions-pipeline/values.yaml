## sessions-pipeline: the sessions pipeline in one release.
##
## Before installing, create one Secret (name: existingSecret below) with keys
## rootUser, rootPassword and SUMMARY_MASTER_KEYS. It supplies MinIO's root
## credential, the workers' Locker credential, and Bob Costas's summary object
## encryption key. Only Bob Costas receives SUMMARY_MASTER_KEYS. With
## hoopdb.enabled, HOOPDB_URL comes from the Secret CloudNativePG generates
## ("hoopdb-app", key "uri"); nothing else to create.
##
## One release per namespace: dependency objects use fixed names (hoopdb,
## session-object-storage, otel-collector) so the app charts can address them.

global:
  imageRegistry: ghcr.io
  tenant:
    orgId: ""          # REQUIRED: your Agent Relay org id
  otel:
    # OTLP/HTTP endpoint of YOUR observability backend or collector. Empty =
    # no export. With otel.enabled below: http://otel-collector:4318
    endpoint: ""

# A private release profile can require every services workload and migration
# Job to use one reviewed immutable artifact. Default off for existing profiles.
releaseContract:
  unifiedServicesDigest: false

# Shared by both app charts (YAML anchors keep one copy).
shared: &shared
  # Pull credentials for the private services image: every workload and Job,
  # including searchWorkerRole.bootstrapJob (which reads worker.imagePullSecrets).
  # Empty on hosted EKS (node role pulls from ECR).
  imagePullSecrets: []
  existingSecret: sessions-pipeline-locker
  secretKeys:
    hoopdbUrl: HOOPDB_URL
    lockerAccessKeyId: rootUser
    lockerSecretAccessKey: rootPassword
  summaryEncryption:
    # Empty follows worker.existingSecret, including user overrides. Set a
    # name only when summary custody belongs in a separate Secret.
    existingSecret: ""
    key: SUMMARY_MASTER_KEYS
  hoopdb:
    existingSecret: hoopdb-app
    key: uri
  locker:
    # The bundled MinIO (session-object-storage.enabled). LOCKER_ENDPOINT is not subject to
    # ALLOW_IN_CLUSTER_HTTP, so this short http name is valid with
    # allowInClusterHttp=false.
    endpoint: http://session-object-storage:9000
    bucket: locker
    region: us-east-1
    credentials:
      mode: secret
  tenant:
    orgId: ""          # empty = global.tenant.orgId
    workspaceId: default
  deployment:
    name: selfhost
    id: ""

worker:
  <<: *shared
  # Plain http only to in-cluster Service FQDNs (ALLOW_IN_CLUSTER_HTTP) for
  # the validated destination URLs; Locker and OTLP endpoints are exempt.
  allowInClusterHttp: false
  # Use a separate owner URL for the one-shot migration Job (and its
  # wait-for-role) while services use the least-privilege URL in worker.hoopdb.
  # Both fields stay empty by default.
  migrations:
    hoopdb:
      existingSecret: ""
      key: ""
    # The migrator's database profile has no defaults. Start from a profile in
    # charts/sessions-pipeline/profiles/ (see the README) or set databaseMode, supabaseShim,
    # runtimeRole, runtimeRoleLogin and functionBoundaryMode yourself; see
    # charts/sessions-pipeline-worker/values.yaml. With hoopdb.enabled you need:
    # databaseMode selfhosted, a runtimeRole other than
    # hoopdb.cluster.initdb.owner, runtimeRole.bootstrapJob and
    # functionDefaultRevoke.bootstrapJob enabled, and waitForRole.functionDefault.
    # migrate waits until session_directory_search_worker exists. initdb creates
    # it on a new cluster and searchWorkerRole.bootstrapJob on an existing one;
    # an external database pre-provisions it. Same pinned image as
    # hoopdb.cluster.imageName. Supabase mode refuses waitForRole: disable it.
    waitForRole:
      enabled: true
      image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3

alleyoop:
  <<: *shared
  # Plain http only to in-cluster Service FQDNs (ALLOW_IN_CLUSTER_HTTP) for
  # the validated destination URLs; Locker and OTLP endpoints are exempt.
  allowInClusterHttp: false
  auth:
    # REQUIRED: RelayAuth JWKS URL (or auth.localJwks=true for kind/local).
    jwksUrl: ""
    # Optional RELAYHISTORY_ORIGIN (bare origin; must equal the courier's
    # RELAYAUTH_HISTORY_ORIGIN).
    historyOrigin: ""

# ---------------------------------------------------------------------------
# HoopDb: a CloudNativePG Cluster (cnpg/cluster). Needs the CloudNativePG
# operator installed first (deps/cnpg-operator-values.yaml). Disable to use
# your own Postgres 17 with vector + pg_trgm: then set worker.hoopdb and
# alleyoop.hoopdb to your Secret.
# ---------------------------------------------------------------------------
hoopdb:
  enabled: true
  fullnameOverride: hoopdb
  type: postgresql
  mode: standalone
  version:
    postgresql: "17"
  cluster:
    instances: 1
    # CNPG standard Postgres 17.11; ships vector and pg_trgm (deps/PINS.md).
    imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
    storage:
      size: 10Gi
    walStorage:
      enabled: false
    enableSuperuserAccess: false
    # Non-empty on purpose: with no parameters the chart renders
    # `postgresql:` as null, which the CRD rejects without the operator's
    # defaulting webhook (CI dry-run, or the operator not yet running).
    postgresql:
      parameters:
        max_connections: "200"
    monitoring:
      enabled: false
    initdb:
      database: hoopdb
      owner: hoop
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        # Supabase roles the migrations GRANT to; created as superuser so the
        # app role keeps least privilege. Runs once (CNPG mangles $$ quoting).
        - CREATE ROLE anon NOLOGIN NOINHERIT
        - CREATE ROLE authenticated NOLOGIN NOINHERIT
        - CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS
        # The session directory search Worker role (sessions-pipeline
        # runbooks/session-directory-search-worker-bootstrap.md). The HoopDb
        # migration only verifies it; creating it and setting a role parameter
        # need a superuser on PostgreSQL 16+, which postInit SQL runs as. New
        # clusters only: existing clusters use searchWorkerRole.bootstrapJob.
        # Remove these two lines to opt out (the role is then never created).
        - CREATE ROLE session_directory_search_worker NOLOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
        - ALTER ROLE session_directory_search_worker SET statement_timeout = '2s'
  backups:
    enabled: false

# Upgrades with the default MinIO name are refused until this is true, because
# an upgrade from a release before 0.7.0 would replace its 'locker' volume. Set
# it only if the release was installed at 0.7.0 or later or its objects are
# disposable; see docs/descriptive-session-names.md.
acknowledgeStorageRename: false

# ---------------------------------------------------------------------------
# Session object storage: MinIO (standalone). Disable to use your own S3: then set
# worker.locker / alleyoop.locker and the credential Secret.
# The bucket is created by sessions-pipeline-worker's locker-init Job, not MinIO's
# post-install hook (hooks never run under --no-hooks).
# ---------------------------------------------------------------------------
session-object-storage:
  enabled: true
  fullnameOverride: session-object-storage
  mode: standalone
  replicas: 1
  existingSecret: sessions-pipeline-locker
  # MinIO no longer publishes public images; Chainguard's is public, signed
  # and digest-pinned (free tier is :latest only, so bump the digest by hand).
  image:
    repository: cgr.dev/chainguard/minio
    tag: latest@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
  persistence:
    enabled: true
    size: 20Gi
  resources:
    requests: { memory: 512Mi }
  buckets: []
  users: []
  policies: []
  svcaccts: []
  consoleService: { type: ClusterIP }

# ---------------------------------------------------------------------------
# OpenTelemetry collector. OFF by default: customers bring their own
# observability stack (set global.otel.endpoint). Enable it to run a collector
# in the release. Its safe default drops telemetry; replace the exporter and
# pipeline configuration with your backend outside local testing.
# ---------------------------------------------------------------------------
otel:
  enabled: false
  fullnameOverride: otel-collector
  mode: deployment
  image:
    repository: otel/opentelemetry-collector-contrib
    # Must track the chart's appVersion (0.137.0 rejects this chart's config).
    tag: "0.163.2"
  config:
    exporters:
      nop: {}
    service:
      pipelines:
        traces: { receivers: [otlp], exporters: [nop] }
        metrics: { receivers: [otlp], exporters: [nop] }
        logs: { receivers: [otlp], exporters: [nop] }

# ---------------------------------------------------------------------------
# The privileged in-cluster SQL Jobs below (searchWorkerRole, runtimeRole,
# functionDefaultRevoke) copy their bootstrap file from the services image
# built from sessions-pipeline. A Job's own sqlImage wins; when it is empty, the
# Job uses this shared one. The digest is REQUIRED for any enabled Job and has
# no default here: pass the digest of the services release you deploy.
# ---------------------------------------------------------------------------
privilegedSql:
  sqlImage:
    repository: ghcr.io/agentworkforce/96bulls-services
    digest: ""

# ---------------------------------------------------------------------------
# session_directory_search_worker on an EXISTING HoopDb cluster.
# postInitApplicationSQL above only runs at initdb. This Job runs the HoopDb
# bootstrap file (supabase/bootstrap/session_directory_search_worker.sql,
# taken from the pinned services image) as the CNPG superuser `postgres`, by
# `kubectl exec` into the primary: no superuser Secret, enableSuperuserAccess
# stays false. Idempotent and atomic (it never alters an existing role; a
# role that differs from the spec fails it with 55000). Separate from the
# hoopdb-migrate Job, with its own ServiceAccount and a namespace Role that
# can only list/get pods and exec. Off by default: running it is an operator
# step under the deploy approval. Disabling it (or deleting the release)
# removes the Job and its RBAC; the role itself is never dropped (see the
# runbook's "Rollback and removal").
# Order: the migrate Job's wait-for-role init container (worker.migrations.
# waitForRole) blocks migrate until the role exists, so the two are applied
# together. Workloads stay unready until migrate (phase 1 verify, migrations,
# phase 2 verify) completes; a drifted role fails both Jobs (55000).
# Pull auth: worker.imagePullSecrets (the shared value above).
# ---------------------------------------------------------------------------
searchWorkerRole:
  bootstrapJob:
    enabled: false
    # Empty: privilegedSql.sqlImage. The services image that carries the file, by digest.
    sqlImage:
      repository: ""
      digest: ""
    sqlPath: /app/supabase/bootstrap/session_directory_search_worker.sql
    # kubectl (with a shell) to exec into the CNPG primary. alpine/k8s 1.34.1.
    kubectlImage: &kubectlImage
      repository: docker.io/alpine/k8s
      tag: "1.34.1"
      digest: "sha256:ec714df3813b5405292860f8a1c55c5727bf8c33c88992f1e981efad8065547f"
    # The CNPG Cluster (hoopdb.fullnameOverride) and its application database.
    cluster: hoopdb
    database: hoopdb
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

# ---------------------------------------------------------------------------
# The dedicated HoopDb runtime role (worker.migrations.runtimeRole) on the
# in-cluster HoopDb, selfhosted mode. Required there: nothing else creates it.
# Runs supabase/bootstrap/hoopdb_runtime_role.sql from the services image as
# `postgres` in the HoopDb database (kubectl exec, like searchWorkerRole), with
# -v runtime_role / runtime_login from worker.migrations. It also revokes
# TEMPORARY on the HoopDb database from PUBLIC (database-wide: the owner and
# superusers keep it) and grants the role CONNECT. Never rendered for an
# external database (hoopdb.enabled=false): that role is pre-provisioned.
# ---------------------------------------------------------------------------
runtimeRole:
  bootstrapJob:
    enabled: false
    # Empty: privilegedSql.sqlImage.
    sqlImage:
      repository: ""
      digest: ""
    sqlPath: /app/supabase/bootstrap/hoopdb_runtime_role.sql
    kubectlImage: *kubectlImage
    cluster: hoopdb
    database: hoopdb
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

# ---------------------------------------------------------------------------
# The durable function boundary on the in-cluster HoopDb (selfhosted mode,
# HOOPDB_FUNCTION_BOUNDARY_MODE=global-default-revoke). Required with
# hoopdb.enabled: nothing else installs it, and the migrator's function-boundary
# gate refuses without it. Runs supabase/bootstrap/hoopdb_function_default_revoke.sql
# from the services image as `postgres` in the HoopDb database, with
# -v migration_owner=hoopdb.cluster.initdb.owner. In this database it sets the
# global function default of the owner and every superuser to {<self>:EXECUTE}.
# That is safe only because the database is dedicated to HoopDb. It refuses
# poisoned defaults (55000, nothing changed) and is idempotent. migrate waits
# for the result (worker.migrations.waitForRole.functionDefault).
# CNPG/selfhost only. It never runs for an external database, and never on
# Supabase: there the owner is postgres, so the change would reach every schema
# of the project. Supabase uses the event-trigger boundary instead
# (sessions-pipeline #125; profiles/external-supabase.yaml).
# ---------------------------------------------------------------------------
functionDefaultRevoke:
  bootstrapJob:
    enabled: false
    # Empty: privilegedSql.sqlImage.
    sqlImage:
      repository: ""
      digest: ""
    sqlPath: /app/supabase/bootstrap/hoopdb_function_default_revoke.sql
    kubectlImage: *kubectlImage
    cluster: hoopdb
    database: hoopdb
    backoffLimit: 3
    activeDeadlineSeconds: 600
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 256Mi }

# ---------------------------------------------------------------------------
# External-Supabase activation hold. profiles/external-supabase.yaml sets it,
# so that profile does not render. It stays fail-closed until the profile's
# pinned image is confirmed as the production-Supabase pin and the live
# Supabase activation steps (the event-trigger function boundary bootstrap and
# --activation-check) are approved.
# ---------------------------------------------------------------------------
supabaseActivation:
  hold: false

# The session read API moved to its own chart (charts/session-read-api), carried
# here as a default-off dependency. Its values, documented in that chart, go under
# this key. When the dependency is enabled, coordination overlaps use Postgres by
# default; the dashboard view remains a separate default-off selection. The old
# readApi key refuses to render, so two readers cannot run.
sessionReadApi:
  enabled: false
  coordinationOverlaps:
    enabled: true

# Optional self-host transcript search writer (pipeline SERVICE=session-pipeline-consumer):
# reads the Locker and indexes sessions into the backend selected below. Off by
# default. Run it with exactly one replica. Its ServiceAccount must carry the
# Pod Identity association Terraform creates for the search indexer role.
searchIndexer:
  enabled: false
  fullnameOverride: ""
  image:
    repository: ghcr.io/agentworkforce/96bulls-services
    # Required: a services image built from a pipeline commit with the OpenSearch writer.
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    # Must match Terraform's indexer association ServiceAccount.
    name: agent-relay-search-indexer
    annotations: {}
  # Same coverage floor as the read API: ISO timestamp or epoch.
  completeSince: ""
  # Bare Locker prefix; the org is appended at runtime.
  keyPrefix: 96bulls
  config:
    # JSON { "hoopdb_url": "<search_consumer_runtime URL>" }.
    existingSecret: ""
    key: RELAYHISTORY_PIPELINE_CONSUMER_SECRET
  search:
    backend: opensearch
    # Projection-state id; must equal the read API's SEARCH_INDEX_POSTGRES_BACKEND_ID.
    backendId: ""
    opensearch:
      # https endpoint without path. Requests are signed with Pod Identity credentials.
      url: ""
      region: ""
      indexPrefix: relayhistory
  locker:
    # s3 (AWS/MinIO) or gcs (GKE Workload Identity; no HMAC keys).
    provider: s3
    bucket: ""
    region: us-east-1
    # Empty uses the AWS S3 endpoint for the region (Pod Identity credentials).
    endpoint: ""
  # GCS readiness settings (Cloud SQL, Memorystore and Pub/Sub). Empty for S3.
  extraEnv: []
  postgres:
    # supabase, or custom-ca with the bundle below (Amazon RDS).
    tlsProfile: custom-ca
    caConfigMap: ""
    caKey: ca.crt
    caSha256: ""
  healthPort: 8081
  bootstrap:
    # One-shot owner-role Job: creates the Postgres state tables, the consumer
    # role and the OpenSearch index. Otherwise an operator runs the
    # session-pipeline-consumer-bootstrap service and sets acknowledgeRunByOperator.
    enabled: false
    acknowledgeRunByOperator: false
    # JSON { "hoopdb_url": "<schema owner URL>" }.
    existingSecret: ""
    key: RELAYHISTORY_PIPELINE_CONSUMER_SECRET
    backoffLimit: 3
    activeDeadlineSeconds: 900
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# Separate public upload edge from merged pipeline #363. This is NOT the
# internal alleyoop-ingest worker. No profile enables it or supplies an image.
# Initial supported assembly is test/pilot only; deletion/privacy is incomplete.
ingestEdge:
  # Omitted by default: legacy reads stay unchanged; the engine pin gate remains 8.
  # Explicit 8/9/10 opts into the independent compatibility policy.
  # Raising it requires a qualified #489-compatible image; it does not select
  # writer output or enable Rust/WASM. Keep compatible readers staged first.
  readerMaxRuleset: null
  # Business analytics adapter (pipeline source 71801741 or later). Off by default.
  # Self-host sends only to the private file collector, never hosted PostHog.
  analytics:
    enabled: false
    deploymentId: "" # opaque installation id; no person, workspace or hostname
    collectorUrl: "" # complete HTTPS URL ending /v1/events
    existingSecret: "" # unique component-bound collector producer token
    tokenKey: token
    caConfigMap: "" # optional public CA bundle, added to OS trust
    caKey: ca.crt
  enabled: false
  # Requires an image implementing SELFHOST_INGEST_ADMISSION. Sync preserves
  # the existing request path. Async acknowledges durable object storage and
  # defers admission SQL; drain consumes the inbox but accepts new work sync.
  admission:
    mode: sync
    concurrency: 4
    scanIntervalMs: 15000
    maxAttempts: 20
  # Pipeline #515: scan .upload-inbox and promote into async admission.
  # Requires a published image implementing HISTORY_UPLOAD_DIRECT. The witness
  # must be the SAME Secret value used by Control's historyUpload.witness.
  uploadDirect:
    mode: "off" # off | allowlist | on
    # Consumer allowlist uses org:<id>/ws:<id>, unlike Control's user ID list.
    allowlist: []
    scanBatch: 16
    witness:
      existingSecret: ""
      key: upload-witness-key
  keyRoot: 96bulls
  # Create the explicitly named native consumer ServiceAccount (Pod Identity).
  createServiceAccount: false
  # Requires a qualified services image containing pipeline #484. Claim-stage
  # lock waits become 429 + Retry-After; statement timeouts still return 503.
  # This does not remove SQL from sync uploads or change async consumer backoff.
  claimLockBusy: true
  fullnameOverride: ""
  image:
    repository: ghcr.io/agentworkforce/96bulls-services
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # Unprivileged container port: 1024-65535, independent of public origin port.
  port: 8081
  # Normalized public HTTPS origin; must equal the reader's READ_API_ORIGIN.
  origin: ""
  allowInClusterHttp: false
  relaycontrol:
    # Base origin only; the client appends /internal/v1/auth/introspect.
    url: ""
  config:
    existingSecret: ""
    databaseUrlKey: database-url
    introspectSecretKey: introspect-secret
  postgres:
    # The server must already serve TLS under this CA, with matching DNS.
    caConfigMap: ""
    caKey: ca.crt
    caSha256: ""
    poolMax: 4
  locker:
    # s3 (AWS/MinIO) or gcs (GKE Workload Identity; no HMAC keys).
    provider: s3
    bucket: ""
    endpoint: ""
    region: us-east-1
    # secret: static keys from existingSecret (MinIO). podIdentity: no keys; the
    # AWS credential chain of serviceAccountName, and endpoint may stay empty.
    credentials:
      mode: secret
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  # Serves the per-session erase on POST /v1/delivery/sessions/selection
  # (RELAYHISTORY_SELFHOST_SESSION_SELECTION). Needs pipeline migration 043910.
  sessionSelection: false
  # Answers the Desktop's POST /v1/onboarding/heartbeat 204 and discards it
  # (RELAYHISTORY_SELFHOST_HEARTBEAT_ACCEPT). Needs a services image from pipeline
  # #431 or later.
  heartbeatAccept: false
  maxPerUser: 4
  maxPerOrg: 32
  serviceAccountName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  networkPolicy:
    enabled: false
    ingressFrom: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Canonical pointer/search consumer from merged pipeline #336, default OFF.
# No runtime image is selected until the complete source/image/generation and
# native PostgreSQL/TLS/Locker handoff is accepted. This does not enable reads,
# upload, publication, GC, deletion/privacy, or replace an installed indexer.
nativeConsumer:
  # Business analytics adapter (pipeline source 71801741 or later). Off by default.
  # Self-host sends only to the private file collector, never hosted PostHog.
  analytics:
    enabled: false
    deploymentId: "" # opaque installation id; no person, workspace or hostname
    collectorUrl: "" # complete HTTPS URL ending /v1/events
    existingSecret: "" # unique component-bound collector producer token
    tokenKey: token
    caConfigMap: "" # optional public CA bundle, added to OS trust
    caKey: ca.crt
  enabled: false
  # Null preserves legacy reads; explicit 8/9/10 opts into strict checks. It neither
  # selects a writer ruleset nor enables this default-off component.
  readerMaxRuleset: null
  fullnameOverride: ""
  replicas: 1
  # Both the chart's legacy indexer and the installed old indexer must be off.
  # Recreate cannot coordinate two differently named writers.
  legacyIndexerDrained: false
  # Driver/migrations stay outside this slot; verify the selected image's
  # migration run AND zero-step rerun before prepare/serve. Disable old Job.
  migrationDriverVerified: false
  # Only needed with active legacy Bob/referee/ingest. Match their image and
  # CA, validate immutable CA object and opaque verify-full URLs/roles/DB/gates.
  legacyRuntimesQualified: false
  image:
    repository: ghcr.io/agentworkforce/96bulls-services
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  port: 8081
  # Postgres is the only supported native consumer backend. Match the reader.
  backendId: ""
  completeSince: ""
  keyPrefix: 96bulls
  reconcileEveryMinutes: 1
  reconcileLookbackMinutes: 30
  allowInClusterHttp: false
  config:
    # JSON {hoopdb_url:<search_consumer_runtime URL>}; no owner/reader URL.
    existingSecret: ""
    key: RELAYHISTORY_PIPELINE_CONSUMER_SECRET
  postgres:
    # Explicit expected target; the init contract checks both actual pools.
    host: ""
    database: ""
    port: 5432
    caConfigMap: ""
    caKey: ca.crt
    caSha256: ""
  locker:
    bucket: ""
    endpoint: ""
    region: us-east-1
    credentials:
      mode: secret # secret | podIdentity (S3/MinIO only; no GCS slot)
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
  bootstrap:
    enabled: false
    # With the Job enabled, prepare renders Job+contract only. Verify completion,
    # set runtime-role password through the operator, then select serve.
    phase: prepare # prepare | serve
    ownerRole: ""
    # This Secret is forbidden in enabled runtime config/env/volume/pull refs,
    # including reader/ingest and after the prepare Job has been disabled.
    existingSecret: "" # DIFFERENT Job-only JSON {hoopdb_url:<schema owner URL>}
    key: RELAYHISTORY_PIPELINE_CONSUMER_SECRET
    activeDeadlineSeconds: 900
  preflight:
    # Bounded init wait for genuine login, both verified-TLS pools, matching
    # database, official consumer schema/role/policies and generation/PASS.
    timeoutSeconds: 600
  serviceAccountName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 768Mi }

nativeRouting:
  enabled: false
  fullnameOverride: ""
  # Exact same normalized HTTPS origin as sessionReadApi.origin and ingestEdge.origin.
  origin: ""
  className: ""
  tls:
    # Must already exist in the release namespace; no key material is created.
    existingSecret: ""
