{{- include "relayfile-control.validate" . }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "relayfile-control.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayfile-control.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
