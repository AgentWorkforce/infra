{{- include "relayfile-control.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayfile-control.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relayfile-control.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "relayfile-control.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
      labels:
        {{- include "relayfile-control.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "relayfile-control.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "relayfile-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          # The admin listener (3101) is deliberately absent: it binds loopback
          # and is reached with kubectl port-forward to the pod.
          ports:
            - { name: http, containerPort: {{ .Values.server.port }}, protocol: TCP }
          envFrom:
            - configMapRef: { name: {{ include "relayfile-control.fullname" . }} }
          env:
            {{- include "relayfile-control.secretEnv" . | nindent 12 }}
            {{- if (.Values.postgresCa | default dict).enabled }}
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/postgres-ca/ca.crt }
            {{- end }}
            {{- with .Values.extraEnv }}{{ toYaml . | nindent 12 }}{{- end }}
          startupProbe: {{ toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe: {{ toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe: {{ toYaml .Values.readinessProbe | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if (.Values.postgresCa | default dict).enabled }}
            - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        {{- if (.Values.postgresCa | default dict).enabled }}
        {{- include "relayfile-control.postgresCaVolume" . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
