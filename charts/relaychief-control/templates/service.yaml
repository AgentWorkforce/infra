{{- include "relaychief-control.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relaychief-control.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relaychief-control.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
  selector: {{ include "relaychief-control.selectorLabels" . | nindent 4 }}
