{{- include "relay-control.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relay-control.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relay-control.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{ include "relay-control.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relay-control.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "relay-control.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with concat .Values.services.relayhistoryHostAliases .Values.services.publicHostAliases }}
      hostAliases: {{ toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.secretKeys.passwordPepper }}
      initContainers:
        # Secret volumes are root-owned with group bits, which the API refuses
        # for a pepper file. This copy is owned by the pod's user at 0600.
        - name: password-pepper
          image: {{ include "relay-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [node, -e]
          args:
            - |
              const fs = require("node:fs");
              const target = "/var/run/agent-relay/password-pepper/pepper";
              fs.copyFileSync("/var/run/agent-relay/password-pepper-source/pepper", target);
              fs.chmodSync(target, 0o600);
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: password-pepper-source, mountPath: /var/run/agent-relay/password-pepper-source, readOnly: true }
            - { name: password-pepper, mountPath: /var/run/agent-relay/password-pepper }
          resources: {{ toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "relay-control.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ toYaml .Values.server.command | nindent 12 }}
          args: {{ toYaml .Values.server.args | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: {{ .Values.server.port }}, protocol: TCP }
          env:
            {{- if not (kindIs "invalid" .Values.selectedFeatures) }}
            - { name: SELFHOST_FEATURES, value: {{ join "," .Values.selectedFeatures | quote }} }
            {{- end }}
            - { name: PORT, value: {{ .Values.server.port | quote }} }
            - { name: SELFHOST_PUBLIC_URL, value: {{ include "relay-control.publicUrl" . | quote }} }
            {{- if .Values.services.relayauthEnabled }}
            - { name: RELAYAUTH_URL, value: {{ .Values.services.relayauthUrl | quote }} }
            {{- end }}
            - { name: RELAYCAST_URL, value: {{ .Values.services.relaycastUrl | quote }} }
            - { name: RELAYCAST_PUBLIC_URL, value: {{ .Values.services.relaycastPublicUrl | quote }} }
            {{- if ne .Values.services.relayhistoryBackend "native" }}
            - { name: RELAYHISTORY_URL, value: {{ .Values.services.relayhistoryUrl | quote }} }
            - { name: RELAYHISTORY_PUBLIC_URL, value: {{ .Values.services.relayhistoryPublicUrl | quote }} }
            {{- end }}
            {{- if .Values.services.relayhistoryReadApiUrl }}
            {{- include "relay-control.historyConnectionEnv" . | nindent 12 }}
            {{- end }}
            {{- include "relay-control.runtimeEnv" . | nindent 12 }}
            {{- include "relay-control.secretEnv" . | nindent 12 }}
            {{- if .Values.secretKeys.passwordPepper }}
            - { name: SELFHOST_PASSWORD_PEPPER_FILE, value: /var/run/agent-relay/password-pepper/pepper }
            {{- end }}
            {{- if (.Values.postgresCa | default dict).enabled }}
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/postgres-ca/ca.crt }
            {{- end }}
            {{- if .Values.integrations }}
            {{- include "relay-control.integrationEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - { name: secrets, mountPath: /var/run/agent-relay/secrets, readOnly: true }
            {{- range $provider := keys (.Values.integrations | default dict) | sortAlpha }}
            - { name: {{ printf "oauth-%s" $provider | quote }}, mountPath: {{ printf "/var/run/agent-relay/integrations/%s" $provider | quote }}, readOnly: true }
            {{- end }}
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.secretKeys.passwordPepper }}
            - { name: password-pepper, mountPath: /var/run/agent-relay/password-pepper, readOnly: true }
            {{- end }}
            {{- if (.Values.postgresCa | default dict).enabled }}
            - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              {{- include "relay-control.secretItems" . | nindent 14 }}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if .Values.secretKeys.passwordPepper }}
        - name: password-pepper-source
          secret:
            secretName: {{ .Values.existingSecret }}
            defaultMode: 0440
            items:
              - { key: {{ .Values.secretKeys.passwordPepper | quote }}, path: pepper }
        - name: password-pepper
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- end }}
        {{- if (.Values.postgresCa | default dict).enabled }}
        {{- include "relay-control.postgresCaVolume" . | nindent 8 }}
        {{- end }}
        {{- range $provider := keys (.Values.integrations | default dict) | sortAlpha }}
        {{- $app := index $.Values.integrations $provider }}
        - name: {{ printf "oauth-%s" $provider | quote }}
          secret:
            secretName: {{ $app.existingSecret | quote }}
            defaultMode: 0440
            items:
              - { key: {{ $app.clientSecretKey | default "client-secret" | quote }}, path: client-secret }
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
