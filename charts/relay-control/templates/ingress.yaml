{{- include "relay-control.validate" . }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "relay-control.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relay-control.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- if or $.Values.secretKeys.internalToken $.Values.secretKeys.introspectSecret }}
          # /internal/v1 is for in-cluster callers only: route it to a Service
          # with no endpoints so the controller answers with an error.
          - path: /internal
            pathType: Prefix
            backend:
              service:
                name: {{ include "relay-control.fullname" $ | trunc 49 | trimSuffix "-" }}-internal-deny
                port: { number: 80 }
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "relay-control.fullname" $ }}
                port: { name: http }
    {{- end }}
{{- if or .Values.secretKeys.internalToken .Values.secretKeys.introspectSecret }}
---
# Deliberately has no selector (and so no endpoints): the Ingress sends
# /internal here so it is never forwarded to the API.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay-control.fullname" . | trunc 49 | trimSuffix "-" }}-internal-deny
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "relay-control.labels" . | fromYaml | merge (dict "app.kubernetes.io/component" "internal-deny") | toYaml | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 80, protocol: TCP }
{{- end }}
{{- end }}
