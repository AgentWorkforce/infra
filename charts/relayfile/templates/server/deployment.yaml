{{- include "relayfile.go.validate" . -}}
{{- include "relayfile.actors.validate" . -}}
{{- if not (include "relayfile.actors.enabled" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayfile.server.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relayfile.server.labels" . | nindent 4 }}
  {{- with .Values.podAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.postgres.enabled }}
  strategy: { type: Recreate }
  {{- end }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relayfile.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "relayfile.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "relayfile.serviceAccountName" . }}
      {{- if include "relayfile.go.managed" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "relayfile.go.podSecurityContext" . | nindent 8 }}
      {{- else }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "relayfile.images.server" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.postgres.enabled }}
          command: [relayfile]
          args:
            - postgres
            - serve
            - --database
            - {{ .Values.postgres.database | quote }}
            - --owner-role
            - {{ .Values.postgres.ownerRole | quote }}
            - --runtime-role
            - {{ .Values.postgres.runtimeRole | quote }}
            - --ca-sha256
            - {{ .Values.postgres.ca.sha256 | quote }}
            - --dsn-file
            - /var/run/relayfile-postgres/database-url
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            {{- include "relayfile.server.env" . | nindent 12 }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if include "relayfile.go.managed" . }}
          volumeMounts:
            {{- if .Values.postgres.enabled }}
            - name: postgres-credential
              mountPath: /var/run/relayfile-postgres
              readOnly: true
            - name: postgres-ca
              mountPath: /etc/relayfile-postgres
              readOnly: true
            {{- end }}
            {{- if eq .Values.auth.mode "introspection" }}
            - name: introspection-credential
              mountPath: /var/run/relayfile-introspection
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if include "relayfile.go.managed" . }}
      volumes:
        {{- if .Values.postgres.enabled }}
        - name: postgres-credential
          secret:
            secretName: {{ .Values.postgres.runtimeSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.postgres.runtimeSecret.key }}
                path: database-url
        - name: postgres-ca
          configMap:
            name: {{ .Values.postgres.ca.configMap }}
            defaultMode: 0444
            items:
              - key: {{ .Values.postgres.ca.key }}
                path: ca.crt
        {{- end }}
        {{- if eq .Values.auth.mode "introspection" }}
        - name: introspection-credential
          secret:
            secretName: {{ .Values.auth.introspection.secretRef.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.auth.introspection.secretRef.key }}
                path: secret
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
