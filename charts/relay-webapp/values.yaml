replicaCount: 1

image:
  repository: ghcr.io/agentworkforce/relay-webapp
  # relay-webapp d40c0b30 (#124), Container Image run 42936053821.
  # Images are never selected by a mutable tag.
  digest: sha256:bd295ccb7d1323965dce890f19d0b7f857d706c00d7756f719c713763fdb49f3
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Runtime configuration consumed by the dashboard container. Leave publicUrl
# empty in single-host mode: it is derived as https://<global.singleHost.host>.
runtime:
  publicUrl: ""
  appPath: /
  apiBasePath: /cloud/api
  loginPath: /login
  # DASHBOARD_SESSION_READ_API_ENABLED: read sessions directly from the session
  # read API with the access token Control hands the page. Needs relay-webapp
  # main 53e39ca9 or later and the read API's CORS allowlist to name this origin.
  sessionReadApiEnabled: false
  # DASHBOARD_COORDINATION_OVERLAPS_ENABLED: show the coordination-overlaps view.
  # Default off even when the sessions-pipeline backend endpoint is enabled.
  # Requires a dashboard image containing relay-webapp #124.
  coordinationOverlapsEnabled: false
  # DASHBOARD_ANALYTICS_ENABLED: browser events use Control's collector proxy.
  # Null preserves the image default; explicit true/false is rendered faithfully.
  # Requires a compatible dashboard image and separately configured Control adapter.
  analyticsEnabled: null

# Optional enterprise branding: one customer profile, rendered as JSON into
# DASHBOARD_CUSTOMER_PROFILE and served in /runtime-config.js (no rebuild).
# Empty keeps the Agent Relay look. Fields (all optional): productName, title,
# logo ({light, dark} or one URL), favicon, accentColor, brandColor,
# supportUrl, poweredByAgentRelay (default true under a custom brand).
# See the README "Customer profile" section.
customerProfile: {}

# A leaf Ingress can proxy /cloud/api to this Service. The GKE proof uses the
# umbrella Ingress instead and leaves this ingress disabled. Required when
# ingress.enabled=true: the relay-control Service name in this namespace,
# i.e. its fullname (<release>-relay-control unless fullnameOverride is set).
api:
  serviceName: ""
  servicePort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Derived from global.singleHost.host in single-host mode.
  host: ""
  tls: []
  externalTls: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { memory: 128Mi }

startupProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 2
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 20
readinessProbe:
  httpGet: { path: /healthz, port: http }
  periodSeconds: 10

networkPolicy:
  enabled: true
  ingressFrom: []

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Single-host mode, normally set once on the agent-relay umbrella: the
# dashboard and the control API share this host. runtime.publicUrl and
# ingress.host are derived from it, and the leaf Ingress also routes /api to
# the API (next to apiBasePath and loginPath).
global:
  singleHost:
    host: ""
  # Optional customer logo, served by this chart at <dashboard origin>/brand/<file>
  # (normally set once on the agent-relay umbrella, where relay-control also
  # points SELFHOST_LOGIN_LOGO_URL at it for the sign-in page). Set exactly one
  # source; nothing renders while both are empty. See the README "Hosted logo".
  branding:
    logo:
      # Inline SVG markup (at most 256 KiB), served as /brand/logo.svg from a
      # ConfigMap this chart creates. Script, event handlers, javascript: URLs
      # and foreignObject are refused.
      svg: ""
      # Or a ConfigMap you create in the release namespace (SVG as data, PNG
      # as binaryData), for example:
      #   kubectl create configmap relay-brand --from-file=logo.png
      existingConfigMap: ""
      # The key in existingConfigMap, which is also the served file name:
      # [A-Za-z0-9._-], ending in .svg or .png. Empty: logo.svg.
      key: ""
