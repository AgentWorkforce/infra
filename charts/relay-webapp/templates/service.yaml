{{- include "relay-webapp.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "relay-webapp.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relay-webapp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "relay-webapp.selectorLabels" . | nindent 4 }}
