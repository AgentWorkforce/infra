apiVersion: v2
name: relaygate
type: application
version: 0.1.7
appVersion: "0.1.0"
kubeVersion: ">=1.27.0-0"
description: >-
  Optional governance gate for Agent Relay: agents register into a group, every
  request is checked against mode bits, and writes that cross a group boundary
  or leave through an external stream (Slack, a knowledge base) are classified.
