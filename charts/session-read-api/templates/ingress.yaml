{{- include "session-read-api.validate" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "session-read-api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "session-read-api.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ regexReplaceAll ":[0-9]+$" (trimPrefix "https://" .Values.origin) "" | quote }}
      http:
        paths:
          # The public read paths only; /internal/* is never routed here.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "session-read-api.fullname" . }}
                port: { name: http }
{{- end }}
