{{- include "session-read-api.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "session-read-api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "session-read-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "session-read-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # Control, the only caller of /internal/*.
    - from:
        {{- toYaml .Values.networkPolicy.controlFrom | nindent 8 }}
      ports: [{ port: http }]
    {{- with .Values.networkPolicy.publicFrom }}
    # The public /v1 route. These peers share the port, so they must route only /v1.
    - from:
        {{- toYaml . | nindent 8 }}
      ports: [{ port: http }]
    {{- end }}
{{- end }}
