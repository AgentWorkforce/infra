{{- include "session-read-api.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "session-read-api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "session-read-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "session-read-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- if include "session-read-api.gateOnly" . }}
    # Gate-only: relaygate only, for /v1 and /internal (Control reaches
    # /internal through relaygate). controlFrom and publicFrom are ignored.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: relaygate
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{ port: http }]
    {{- if .Values.networkPolicy.gateOnlyControlDirect }}
    # Escape hatch (networkPolicy.gateOnlyControlDirect): Control directly.
    - from:
        {{- toYaml .Values.networkPolicy.controlFrom | nindent 8 }}
      ports: [{ port: http }]
    {{- end }}
    {{- else }}
    # Control, the only caller of /internal/*.
    - from:
        {{- toYaml .Values.networkPolicy.controlFrom | nindent 8 }}
      ports: [{ port: http }]
    {{- with .Values.networkPolicy.publicFrom }}
    # The public /v1 route. These peers share the port, so they must route only /v1.
    - from:
        {{- toYaml . | nindent 8 }}
      ports: [{ port: http }]
    {{- end }}
    {{- end }}
{{- end }}
