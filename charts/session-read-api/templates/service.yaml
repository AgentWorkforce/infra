apiVersion: v1
kind: Service
metadata:
  name: {{ include "session-read-api.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "session-read-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "session-read-api.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
