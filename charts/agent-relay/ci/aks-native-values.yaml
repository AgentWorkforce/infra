# RENDER ONLY: stands in for the two files an AKS install layers after
# docs/azure-install/values.yaml (docs/azure-install/README.md steps 4 and 6):
#   - the release's release-images.values.yaml, here generated from
#     self-hosted/customer-images.yaml by
#     scripts/release/build-agent-relay-release-manifest.py (profile eks) with
#     the mirror root removed, as the guide's sed does; and
#   - ~/.agent-relay-install/hoopdb-layout-values.yaml as postgres-setup.sh
#     writes it for a fresh install (hoopdb_owner migrates).
# Image pins and the HoopDb layout only, no behaviour values.
# ci/agent-relay/test_native_no_relayauth.py fails when it drifts from either.
