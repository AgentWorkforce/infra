# Naming compatibility ONLY, layered after TRANSLATED old operator values.
# Retains kind's old immutable selectors, resources and Service DNS. This does
# not approve image changes, migrations, legacy-provider removal or rollout.
# kind-up deliberately refuses this legacy layout; use a separately reviewed
# operator upgrade plan. Do not reset or reinstall the QA fixture.
relay-control:
  nameOverride: relay-cloud-api
  fullnameOverride: relaycontrol
relay-webapp:
  nameOverride: relay-dashboard
  fullnameOverride: relay-app
  api:
    serviceName: relaycontrol
relayhistory:
  agentRelayCloud:
    apiUrl: http://relaycontrol.agent-relay.svc.cluster.local
# For addons, retain the original caller URL inside the existing command.
# Supply your translated old relayflows block after this overlay; it must use
# relaycontrol while that Service identity is retained.
sessions-pipeline:
  worker:
    legacyResourceNames: true
    locker:
      endpoint: http://locker:9000
  alleyoop:
    legacyResourceNames: true
    # Observed pre-#94 ar-lap 0.3.16 identity, not a fresh 0.4.x release.
    fullnameOverride: alleyoop
    locker:
      endpoint: http://locker:9000
  session-object-storage:
    fullnameOverride: locker
    nameOverride: locker
