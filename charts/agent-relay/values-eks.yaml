# Customer-neutral AWS EKS deployment template, derived from values-gcp.yaml
# and proven on EKS Auto Mode in a Pippen sandbox (docs/self-hosted-eks.md).
# It contains no credentials. Before deployment, replace every value marked
# REQUIRED OVERRIDE and create the referenced Secret and AWS resources.
#
# Scope: the core suite without durable-actors (GKE-only: it needs GKE
# Sandbox/gVisor and GCS); Relaycast runs its SQLite backend. Relayfile is
# off (no release image for the standalone server; see docs/self-hosted-eks.md).
# History is native (docs/self-hosted-no-relayauth.md): Control's native
# backend, the Sessions read API and the ingest edge on one history origin; no
# RelayAuth. Enable sessions-pipeline.sessionReadApi and .ingestEdge in the
# site values (docs/self-hosted-native-ingest.md), and publish the ALB with
# scripts/selfhost/eks-alb-ingress.sh and EKS_ALB_INGEST=true.
# values-eks-native.yaml is now an empty compatibility overlay.
#
# AWS mapping of the GCP profile:
#   GKE Ingress + ManagedCertificate  -> one ALB Ingress with host rules and an
#                                        ACM certificate (scripts/selfhost/eks-alb-ingress.sh);
#                                        EKS Auto Mode's built-in ALB controller
#                                        or the AWS Load Balancer Controller
#   GKE Workload Identity             -> EKS Pod Identity associations
#   GCS Locker bucket                 -> S3 bucket (Locker provider s3)
#   Cloud SQL                         -> RDS/Aurora PostgreSQL, or in-cluster
#                                        CloudNativePG (HoopDb below)
#   Memorystore / Pub/Sub             -> not used: the services' AWS data path
#                                        needs neither
components:
  relaycast: true
  relayauth: false
  sessionsPipeline: true
  control: true
  webapp: true
  relayflows: false
  durableActors: false
  relayfile: false

global:
  imageRegistry: ""
  # Release phase 1: every services-image reader starts at the ruleset-10
  # ceiling while writer selection stays unchanged. Existing installs must
  # reach Ready on this phase before applying values-scrub-wasm-bindgen.yaml.
  scrubEngine:
    engine: ""
    required: ""
    readerMaxRuleset: "10"
  tenant:
    # REQUIRED OVERRIDE: stable organization ID used to partition session data.
    orgId: example-org

gkeIngress:
  enabled: false

relaycast:
  fullnameOverride: relaycast
  image:
    # Release image (public GHCR, relaycast main cac175b5, engine 12.8.0).
    # This build contains the optional collector adapter; analytics remains
    # off until the operator supplies its dedicated token and TLS binding.
    repository: ghcr.io/agentworkforce/relaycast-self-host
    digest: sha256:ab9dd6781e68f09d5e2e686a17088f9ad533978ef13d974a47d6c212d8eedbde
  # REQUIRED OVERRIDE: the public cast origin (https://cast.<your domain>,
  # served by the ALB with an ACM certificate). The charts refuse http
  # public origins.
  baseUrl: https://cast.placeholder.company
  # REQUIRED OVERRIDE: existing Secret name; see the chart README for keys.
  existingSecret: example-agent-relay-secrets
  secretKeys:
    internalSecret: relaycast-internal-secret
    bootstrapSecret: relaycast-workspace-bootstrap-secret
  # SQLite backend: one replica, database and uploaded files on an EBS PVC
  # (the default StorageClass). The S3 fileStore exists only in the
  # durable-actors backend, which is GKE-only today.
  persistence:
    enabled: true
  service:
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /health
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    # Same-namespace callers plus the ALB, which reaches pods in IP target
    # mode from its subnets. REQUIRED OVERRIDE: the CIDRs of the subnets the
    # ALB runs in (the proof's ALB shares the cluster's two public subnets,
    # so it used the VPC CIDR). Admitting the whole VPC lets any VPC client
    # reach the pods directly, past the ALB's host and path denials, where
    # security groups allow it; prefer the ALB subnets in production. The
    # same applies to every ipBlock below.
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 10.0.0.0/16 }

# Used only with components.relayauth=true (RelayAuth-issued Relaycast ar_
# credentials); native History needs no RelayAuth.
relayauth:
  fullnameOverride: relayauth
  image:
    # Release image (public GHCR).
    repository: ghcr.io/agentworkforce/relayauth
    digest: sha256:c23c92d25fdffef3b5838a1eef4c226925f859706365d9ccece229795b877288
  baseUrl: http://relayauth:8787
  issuer: http://relayauth:8787
  # REQUIRED OVERRIDE: existing Secret name; see the chart README for keys.
  existingSecret: example-agent-relay-secrets
  secretKeys:
    internalSecret: relayauth-internal-secret
    signingKey: relayauth-signing-key.pem
    bootstrapApiKey: relayauth-bootstrap-api-key
  relaycast:
    url: http://relaycast:8787
  jwksIngress:
    enabled: false
  networkPolicy:
    enabled: true

sessions-pipeline:
  worker:
    image:
      # Preferred AA services image from relayhistory-pipeline main 7e9b2f0f
      # (#509 alpha.5 on top of #505), signed publish run 42964243811.
      # Before its first migrate, run the privileged HoopDb role bootstraps
      # the chart does not (session_token_verifier,
      # session ingest roles) as the Postgres superuser, from the image's own
      # /app/supabase/bootstrap/*.sql. Mirror it by
      # digest to your ECR to pull with the node role instead.
      repository: ghcr.io/agentworkforce/sessions-pipeline
      digest: sha256:77022c5b6a1d30f96f921d703eb27a1acada8ec273ad84aebdde24f8eddce305
    # REQUIRED OVERRIDE: existing Secret name; see the chart README for keys.
    existingSecret: example-agent-relay-secrets
    summaryEncryption:
      existingSecret: example-agent-relay-secrets
    # Session objects in S3 through EKS Pod Identity: create one IAM role
    # (s3:ListBucket on the bucket, Get/Put/DeleteObject on its objects) and
    # a Pod Identity association for the <release>-worker and
    # <release>-session-ingest-api ServiceAccounts. EKS Auto Mode runs the Pod Identity
    # Agent; on other clusters install the eks-pod-identity-agent add-on.
    locker:
      provider: s3
      endpoint: ""
      # REQUIRED OVERRIDE: customer-owned S3 bucket and its region.
      bucket: example-agent-relay-sessions
      region: us-west-2
      credentials:
        mode: podIdentity
    lockerInit:
      enabled: false
    # HoopDb in-cluster on CloudNativePG (sessions-pipeline.hoopdb below):
    # the chart wires the CNPG app Secret and runs the runtime-role and
    # function-default Jobs. For RDS see sessions-pipeline
    # profiles/external-rds.yaml (databaseMode rds); Aurora is not covered.
    migrations:
      databaseMode: selfhosted
      supabaseShim: true
      runtimeRole: sessions_runtime
      runtimeRoleLogin: true
      functionBoundaryMode: global-default-revoke
      waitForRole:
        enabled: true
        functionDefault: true
  alleyoop:
    image:
      # Same services image repository and digest as worker.
      repository: ghcr.io/agentworkforce/sessions-pipeline
      digest: sha256:77022c5b6a1d30f96f921d703eb27a1acada8ec273ad84aebdde24f8eddce305
    # REQUIRED OVERRIDE: existing Secret name; see the chart README for keys.
    existingSecret: example-agent-relay-secrets
    locker:
      provider: s3
      endpoint: ""
      # REQUIRED OVERRIDE: same bucket and region as worker.locker.
      bucket: example-agent-relay-sessions
      region: us-west-2
      credentials:
        mode: podIdentity
    # The ingest validates its RelayAuth/JWKS URLs: https, or (with this)
    # plain http to an in-cluster Service FQDN only (<svc>.<ns>.svc).
    allowInClusterHttp: true
    # alleyoop's RelayAuth courier path is idle without RelayAuth; these URLs
    # are only fetched when a courier authenticates. The native ingest edge
    # and read API do not use them.
    auth:
      # REQUIRED OVERRIDE: <release namespace> in the FQDN.
      jwksUrl: http://relayauth.agent-relay.svc:8787/.well-known/jwks.json
      # Must equal relayauth.issuer.
      issuer: http://relayauth:8787
      # REQUIRED OVERRIDE: the bare History origin (https://history.<your
      # domain>), the same as relay-control.services.sessionReadApiPublicUrl.
      historyOrigin: https://history.placeholder.company
  # CloudNativePG HoopDb. Needs the CNPG operator (cloudnative-pg chart) in
  # the cluster first, and a default StorageClass (EBS gp3).
  hoopdb:
    enabled: true
  runtimeRole:
    bootstrapJob:
      enabled: true
  functionDefaultRevoke:
    bootstrapJob:
      enabled: true
  privilegedSql:
    sqlImage:
      # Same services image repository and digest as worker.
      repository: ghcr.io/agentworkforce/sessions-pipeline
      digest: sha256:77022c5b6a1d30f96f921d703eb27a1acada8ec273ad84aebdde24f8eddce305
  session-object-storage:
    enabled: false

relay-control:
  fullnameOverride: relay-control
  image:
    # Release image (public GHCR, relay-control 0.5.16, 83a57d3): reads EKS Pod
    # Identity / IRSA credentials (Desktop-feed role) and supports the setup
    # key and password sign-in without SMTP. Mirror it by digest to your
    # registry and override repository.
    repository: ghcr.io/agentworkforce/relay-control
    digest: sha256:0b9c5a077b49b31178cc669e7c1d532f39e64c840087ca41636bb84a6c62631c
  # The AA customer profile opts into the owner-only Usage page and qualified
  # MCP agent launch. Remove launch if the enrolled owner/admin Desktop target
  # fails its install-time lifecycle check; Usage remains independent.
  selectedFeatures: [usage, launch]
  database:
    runtimeRole: control_api_runtime
  encryption:
    keyId: primary
  # Flow run artifacts stay inline in PostgreSQL (the only non-GCS option).
  flows:
    storage: postgres
  # REQUIRED OVERRIDE: the public api origin (https://api.<your domain>).
  publicUrl: https://api.placeholder.company
  # REQUIRED OVERRIDE: the public dashboard origin.
  dashboardUrl: https://dashboard.placeholder.company/
  # REQUIRED OVERRIDE: existing Secret name; database-url and
  # database-migrations-url point at RDS/Aurora (or in-cluster CNPG).
  existingSecret: example-agent-relay-secrets
  # Optional first admin without SMTP or SSO (relay-control image from source
  # bd1c9a03 or later): password sign-in plus a one-time setup key the
  # operator generates into existingSecret (openssl rand -hex 32), read once
  # and hands to bootstrap.adminEmail. The ALB is the single proxy that
  # appends X-Forwarded-For, so trustedProxies stays 1; keep direct pod and
  # Service access restricted (networkPolicy below).
  # auth:
  #   password:
  #     enabled: true
  #   trustedProxies: 1
  # and add secretKeys.setupKey: selfhost-setup-key below.
  secretKeys:
    relayauthApiKey: ""
    introspectSecret: relaycontrol-introspect-secret
    sessionReadApiSecret: session-read-api-secret
  services:
    relayauthEnabled: false
    relayauthUrl: ""
    relaycastUrl: http://relaycast:8787
    # REQUIRED OVERRIDE: must match relaycast.baseUrl.
    relaycastPublicUrl: https://cast.placeholder.company
    # The native backend takes the History origin from the read API.
    relayhistoryUrl: ""
    relayhistoryPublicUrl: ""
    relayhistoryBackend: native
    sessionReadApiUrl: http://agent-relay-read-api
    # REQUIRED OVERRIDE: https://history.<your domain>.
    sessionReadApiPublicUrl: https://history.placeholder.company
    sessionReadApiMcpReads: true
  introspection:
    # REQUIRED OVERRIDE: the same origin.
    audiences:
      - https://history.placeholder.company
  service:
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /readyz
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 10.0.0.0/16 }
    allowAllEgress: true

relay-webapp:
  fullnameOverride: relay-webapp
  image:
    # Release image (public GHCR, relay-webapp main be770cac) with the owner-only
    # Usage and Policies pages, split-host download fixes, session links and
    # the script-free hosted-brand CSP.
    repository: ghcr.io/agentworkforce/relay-webapp
    digest: sha256:da0cc80476eac734299c0c6ceb94e2bca7dae7913cce56a8ca8592cf086dd02e
  runtime:
    coordinationOverlapsEnabled: false
    # REQUIRED OVERRIDE: the public dashboard origin.
    publicUrl: https://dashboard.placeholder.company
    appPath: /
    apiBasePath: /cloud/api
    loginPath: /login
  api:
    serviceName: relay-control
  service:
    annotations:
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 10.0.0.0/16 }
