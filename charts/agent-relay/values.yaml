# This umbrella intentionally contains messaging and sessions only.
# Relayflows is an optional add-on via components.relayflows; Relayfile is not
# a dependency.
components:
  # Enable after accepting the collector/proxy images, TLS and durable volume.
  telemetryCollector: false
  relaycast: true
  # Optional. Native History needs no RelayAuth; enable it only for
  # relaycast.credentials.authority=relayauth (RelayAuth-issued ar_ keys).
  relayauth: false
  sessionsPipeline: true
  control: true
  webapp: true
  relayflows: false
  # TerseAI durable-actors control plane (vendored charts/durable-actors).
  # Only useful with an actor-mode consumer: relaycast.runtime.backend or
  # relayfile.runtime.backend set to durable-actors. GKE Sandbox + GCS only.
  durableActors: false
  # Relayfile (charts/relayfile). Off in the suite until its inclusion is
  # decided; runtime.backend durable-actors needs components.durableActors.
  relayfile: false
  # Relay Chief (charts/relay-chief). Configure it under the relay-chief key:
  # image.digest, relay.baseUrl, controlPlane.url, existingSecret and config
  # are required. Its CronJob stays suspended until relay-chief.suspend=false.
  relayChief: false
  # Slack app (charts/slack-relay): routes Slack threads to per-thread agents
  # on this install's relay. Configure it under the slack-relay key:
  # image.digest, relaycast.baseUrl and the secrets.* names are required.
  # See docs/self-hosted-slack-relay.md.
  slackRelay: false
  # relaygate (charts/relaygate): the governance gate between agents and
  # Relaycast/Sessions. Configure it under the relaygate key: image.digest
  # is required, and policy.enrollmentKeys needs at least one key before any
  # agent can register (the chart doesn't enforce it). Opt-in; with it off nothing
  # about the install changes. See AgentWorkforce/relaygate.
  relaygate: false

# Single-host mode (off when empty): the dashboard and the control API share
# this one host. The dashboard is served at /, the API under /cloud/api,
# /login and /api, and relay-control.publicUrl, relay-webapp
# runtime.publicUrl and relay-webapp ingress.host are derived from it
# (https://<host>), so leave those empty. There is no api host. Relaycast,
# Relay History, Relayfile and durable-actors cannot run under a path prefix
# without app changes, so they keep their own hosts (gkeIngress.hosts.cast,
# history, files, actors) and the chart refuses to put them on this host. See
# README "Single-host mode" and values-single-host-example.yaml.
global:
  singleHost:
    host: ""
  # Shared by every Sessions ingest, consumer and read-API replica. The
  # operator erase API and byte deletion remain separately default-off.
  operatorSessionErase:
    fenceEnforced: false
  # Gate-only (off by default; nothing changes unless enabled): relaygate
  # becomes the only way into Relaycast and Sessions. One switch, read by every
  # chart involved: the public cast and history routes (gkeIngress,
  # sessions-pipeline nativeRouting, relaycast ingress) point at relaygate;
  # Relaycast, the Sessions reader and the ingest edge admit only relaygate
  # (plus relaycast.networkPolicy.gateOnlyFrom, Control and RelayAuth by
  # default); Control's SESSION_READ_API_URL becomes relaygate's internal
  # Sessions listener (http://<relaygate>-sessions.<ns>.svc.cluster.local:8081,
  # an origin; needs relaygate #28 or later). Needs components.relaygate with both proxies, proxy.sessionsHosts
  # and controlPrincipals set, a relaygate image with Control-principal mapping
  # (dashboard and desktop users go through relaygate too) and a cluster that
  # enforces NetworkPolicy. Rendering fails when any of that is missing. See
  # docs/self-hosted-relaygate.md, "Gate-only".
  relaygate:
    gateOnly:
      enabled: false
      # The relaygate Service; empty derives <release>-relaygate (or the
      # release name when it contains "relaygate"). Set it to match
      # relaygate.fullnameOverride.
      serviceName: ""
      # relaygate.service.port.
      servicePort: 8080
      # relaygate's internal Sessions listener (SESSIONS_PORT, relaygate #28 or
      # later): a ClusterIP Service <relaygate>-sessions on this port that only
      # relay-control may reach, and relay-control's SESSION_READ_API_URL.
      # Never routed publicly. Required with gate-only.
      sessionsPort: 8081
    # Control-owned policy (off by default; needs gate-only, relaygate main at
    # R1/R2 or later and a relay-control image with C1). Two steps, so
    # relaygate never starts with no policy:
    #   1. enabled: relay-control manages the policy (SELFHOST_RELAYGATE_ADMIN_URL,
    #      _ADMIN_TOKEN, _POLICY_SECRET); relaygate still reads its ConfigMap.
    #      Import that ConfigMap into Control once (Settings, Gate; owner only).
    #   2. pull: relaygate pulls the signed policy from relay-control
    #      (RELAYCONTROL_POLICY_URL, _SECRET); its file and ConfigMap are dropped.
    # See docs/self-hosted-relaygate.md, "Control-owned policy".
    controlPolicy:
      enabled: false
      pull: false
      # Shared by relaygate (RELAYGATE_ADMIN_TOKEN, at least 24 characters) and
      # relay-control (SELFHOST_RELAYGATE_ADMIN_TOKEN).
      adminToken: { name: "", key: token }
      # Shared by relaygate (RELAYCONTROL_POLICY_SECRET) and relay-control
      # (SELFHOST_RELAYGATE_POLICY_SECRET); at least 32 characters, not the
      # introspection secret.
      policySecret: { name: "", key: secret }
      # relay-control's Service and port, for relaygate's
      # RELAYCONTROL_POLICY_URL. Empty derives <release>-relay-control; set it
      # when relay-control.fullnameOverride is set (the chart checks).
      controlServiceName: ""
      controlServicePort: 80
  # Optional customer logo for the sign-in page and dashboard. relay-webapp
  # serves it at <dashboard origin>/brand/<file> (no extra web server or
  # ingress route: / already reaches the dashboard), and relay-control sets
  # SELFHOST_LOGIN_LOGO_URL to that URL unless relay-control.login.logoUrl
  # overrides it. Set svg (inline, served as logo.svg, at most 256 KiB) or
  # existingConfigMap (+ key, the file name, .png only; default logo.png).
  # Needs components.webapp unless relay-control.login.logoUrl is set.
  # relay-control.login.orgName sets the name shown beside the logo (default
  # relay-control.bootstrap.orgName). For the dashboard's own mark, also set
  # relay-webapp.customerProfile.logo: /brand/<file>. To co-brand (the
  # customer's mark under the Agent Relay lockup on the sign-in page, a
  # combined Agent Relay + customer logo in the dashboard), put both PNGs in
  # existingConfigMap: key is the sign-in mark, dashboardKey the combined logo
  # (served at /brand/<dashboardKey>; point customerProfile.logo at it).
  # values-branding-example.yaml shows the whole set.
  branding:
    logo:
      svg: ""
      existingConfigMap: ""
      key: ""
      dashboardKey: ""

gkeIngress:
  enabled: false
  name: agent-relay
  staticIpName: agent-relay-ingress
  managedCertificateName: agent-relay
  frontendConfigName: agent-relay
  # Optional edge hardening. Each names a Google Cloud resource in the
  # cluster's project that must exist before the upgrade (the chart cannot
  # create it; terraform/modules/gcp/edge-security does). README: GKE edge
  # hardening.
  #
  # Compute SSL policy for the HTTPS listener. Empty leaves Google's default
  # policy, which still accepts TLS 1.0 and 1.1; set a policy with
  # min TLS 1.2 (profile MODERN or RESTRICTED).
  sslPolicy: ""
  # Cloud Armor backend security policy, applied to every backend Service
  # behind the Ingress. Needs the backend-config annotation on the
  # relay-webapp Service (and relayfile with hosts.files); the render fails
  # with the exact value when it is missing.
  securityPolicy: ""
  # kubernetes.io/tls Secret served instead of the ManagedCertificate (which
  # is then not rendered). For an edge whose DNS points at a proxy or CDN in
  # front of the load balancer, where Google cannot issue a managed
  # certificate. The certificate must cover every host below.
  tlsSecretName: ""
  # external (default): a global external Application Load Balancer.
  # internal: a regional internal one (Ingress class gce-internal) that
  # answers only inside the VPC and the networks routed to it. Start from
  # values-gcp-internal.yaml; README: Internal-only GKE edge. In internal
  # mode staticIpName names a regional internal address, the certificate is
  # tlsSecretName or internal.preSharedCerts, managedCertificateName and
  # frontendConfigName are unused, and sslPolicy and securityPolicy are
  # refused (GKE supports neither on an internal Ingress).
  mode: external
  internal:
    # Range of the VPC's proxy-only subnet (purpose REGIONAL_MANAGED_PROXY) in
    # the cluster's region. Required in internal mode, and every backend's
    # networkPolicy must allow it.
    proxyOnlySubnetCidr: ""
    # Regional self-managed SSL certificate names, instead of tlsSecretName.
    preSharedCerts: []
  hosts:
    root: ""
    api: ""
    cast: ""
    history: ""
    # Optional. The durable-actors publicUrl host (https://<actors>): SDK
    # follow-up invocations and actor WebSocket URLs use it. Requires
    # components.durableActors and durable-actors.publicUrl=https://<actors>.
    actors: ""
    # Optional. Relayfile's public host; requires components.relayfile.
    files: ""
  # serviceName is derived from each child chart's fullname (fullnameOverride,
  # else <release>-<chart>); an explicit value must match it. servicePort must
  # match the child's service.port.
  backends:
    dashboard: { serviceName: "", servicePort: 8080 }
    # timeoutSec (>= 60) goes into the api BackendConfig <name>-api (name
    # truncated to 59 characters first); the flows worker queue is a
    # long-lived SSE stream. Set relay-control.service.backendConfig to
    # <name>-api; the chart renders the backend-config annotation from it.
    api: { serviceName: "", servicePort: 80, timeoutSec: 3600 }
    # timeoutSec (60-86400) goes into the cast BackendConfig <name>-cast (name
    # truncated to 58 characters first): relaycast WebSockets (/v1/ws,
    # /v1/node/ws) outlive GCE's 30 s default. Set
    # relaycast.service.backendConfig to <name>-cast.
    cast: { serviceName: "", servicePort: 8787, timeoutSec: 3600 }
    files: { serviceName: "", servicePort: 8080 }
  # Seconds the GCE backend keeps a request (and an upgraded WebSocket) open
  # for the actors host; durable-actors sockets are long-lived.
  actorsBackendTimeoutSec: 3600

# Child values are intentionally not populated with credentials or image
# placeholders here. Every leaf chart fails closed until its existingSecret,
# public origins and immutable image digest are supplied.
relaycast: {}
relayauth:
  # JWKS publication is off by default; the umbrella routes nothing to
  # relayauth's public JWKS ingress (gkeIngress refuses jwksIngress.enabled).
  jwksIngress:
    enabled: false
sessions-pipeline: {}
# relay-control: see charts/relay-control/values.yaml. encryption.keyId is
# required; optional: encryption.previousKeyId, secretKeys.previousEncryptionKey,
# secretKeys.internalToken, secretKeys.telemetryInstallKey, dashboardUrl,
# flows.*, telemetry.* (telemetry.level defaults to errors, effective once the
# install is registered with installId, install key and endpoint).
# History is native: Control hands out the Sessions read API origin
# (services.sessionReadApiUrl and sessionReadApiPublicUrl, required) and needs no
# RelayAuth. The standalone RelayHistory server was removed from this chart.
relay-control:
  services:
    relayauthEnabled: false
    relayhistoryBackend: native
relay-webapp: {}
# Opt-in only: enabling components.relayflows without configuring this block
# renders a standalone Job that fails for lack of a flow source (or a
# cloudWorker Deployment that cannot enroll). Set mode, a flow source
# (standalone.flow.*) or worker credentials (credentials.existingSecret,
# worker.cloudUrl), and an immutable image for production.
relayflows: {}
# Passed through to the vendored durable-actors chart when
# components.durableActors=true; see charts/durable-actors/values.yaml and
# docs/self-hosted-durable-actors.md. Its schema requires publicUrl,
# placement.zone, storage.bucket and serviceAccount.googleServiceAccount.
durable-actors: {}
relayfile: {}
# Local kind fixtures only; production profiles leave this disabled. The
# values-kind-*.yaml profiles opt in to namespace-wide external-egress denial.
localKind:
  enabled: false
  allowLocalOnly: false
  profile: core
  temporaryRelayauth: false
  # Native core installer phase (control, then serve). Required when enabled:
  # the single-phase profile that ran the standalone RelayHistory was removed.
  nativePhase: ""
# Install Secrets from an external store through External Secrets Operator
# (ESO, external-secrets.io/v1): AWS SSM Parameter Store, AWS Secrets Manager or
# any other ESO provider. Off by default; with it off you create the Secrets
# yourself. Each secrets entry renders one ExternalSecret whose target is the
# Kubernetes Secret of that name, so the components keep reading the Secret
# names they already take (relay-control existingSecret, ingestEdge
# config.existingSecret, ...). Values hold remote key names only, never values.
#
# Needs the ESO CRDs and controller in the cluster, and IAM for the controller
# (Pod Identity or IRSA) to read the parameters (ssm:GetParameter* and
# kms:Decrypt for SecureString). Pods that start before ESO has written their
# Secret wait in CreateContainerConfigError and start once it exists.
# A rotated value reaches running pods only after a restart.
#
# Example: AWS SSM Parameter Store, the Secrets of the AWS RDS install.
#   externalSecrets:
#     enabled: true
#     store:
#       create: true                  # namespaced SecretStore; the controller's own AWS identity
#       provider: { aws: { service: ParameterStore, region: us-east-1 } }
#     secrets:
#       agent-relay-secrets:
#         data:
#           database-url: /agent-relay/relaycontrol/runtime-url
#           database-migrations-url: /agent-relay/relaycontrol/owner-url
#           HOOPDB_URL: /agent-relay/hoopdb/runtime-url
#           HOOPDB_MIGRATION_URL: /agent-relay/hoopdb/owner-url  # hoopdb_owner, never the RDS administrator
#           database-owner-url: /agent-relay/relaycast/owner-url
#           database-runtime-url: /agent-relay/relaycast/runtime-url
#           selfhost-setup-key: /agent-relay/selfhost-setup-key
#           # ...every other key the install's Secrets table lists
#       agent-relay-read-api:
#         data: { RELAYHISTORY_READ_API_SECRET: /agent-relay/read-api/config }  # stored as JSON
#       agent-relay-ingest-edge-runtime:
#         data:
#           database-url: /agent-relay/hoopdb/ingest-url
#           introspect-secret: /agent-relay/relaycontrol-introspect-secret
#       search-indexer-runtime:
#         data: { RELAYHISTORY_PIPELINE_CONSUMER_SECRET: /agent-relay/search-indexer/runtime-config }
#       search-indexer-owner:
#         data: { RELAYHISTORY_PIPELINE_CONSUMER_SECRET: /agent-relay/search-indexer/owner-config }
#
# A data value is a remote key string, or a full ESO remoteRef map
# ({key, property, version, decodingStrategy, ...}). An entry may instead (or
# also) set dataFrom (ESO's list as-is, e.g.
# [{find: {path: /agent-relay/x/, name: {regexp: ".*"}}}] to load every
# parameter under a path; SSM needs the name or tags matcher), and template (ESO target.template, to
# build a value such as JSON from several parameters).
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  # Owner: this release owns each target Secret, and uninstall deletes it.
  # For a Secret you created by hand before enabling this, use Merge (per entry
  # or here) or delete the Secret first.
  creationPolicy: Owner
  # An existing store. Ignored when store.create is true.
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  # Or let the chart render a namespaced SecretStore (named
  # <release>-external-secrets unless store.name is set). provider is ESO's
  # spec.provider as-is; without an auth block the AWS provider uses the
  # controller's own credentials.
  store:
    create: false
    name: ""
    provider: {}
  # Target Secret name -> {data, dataFrom, template, creationPolicy,
  # deletionPolicy, refreshInterval}.
  secrets: {}

# Umbrella NetworkPolicy for the durable-actors control plane (port 7100):
# release-namespace pods, the actor sandbox namespace and, with
# gkeIngress.hosts.actors, the GKE load balancer ranges.
durableActorsNetworkPolicy:
  enabled: true
  extraIngressFrom: []

# Dedicated analytics file collector. Producer adapters are configured on each
# application; this chart does not enable them or redirect hosted PostHog.
telemetry-collector:
  fullnameOverride: telemetry-collector
