# This umbrella intentionally contains messaging and sessions only.
# Relayflows is an optional add-on via components.relayflows; Relayfile is not
# a dependency.
components:
  # Enable after accepting the collector/proxy images, TLS and durable volume.
  telemetryCollector: false
  relaycast: true
  relayauth: true
  sessionsPipeline: true
  relayhistory: true
  control: true
  webapp: true
  relayflows: false
  # TerseAI durable-actors control plane (vendored charts/durable-actors).
  # Only useful with an actor-mode consumer: relaycast.runtime.backend or
  # relayfile.runtime.backend set to durable-actors. GKE Sandbox + GCS only.
  durableActors: false
  # Relayfile (charts/relayfile). Off in the suite until its inclusion is
  # decided; runtime.backend durable-actors needs components.durableActors.
  relayfile: false
  # Relay Chief (charts/relay-chief). Configure it under the relay-chief key:
  # image.digest, relay.baseUrl, controlPlane.url, existingSecret and config
  # are required. Its CronJob stays suspended until relay-chief.suspend=false.
  relayChief: false

# Single-host mode (off when empty): the dashboard and the control API share
# this one host. The dashboard is served at /, the API under /cloud/api,
# /login and /api, and relay-control.publicUrl, relay-webapp
# runtime.publicUrl and relay-webapp ingress.host are derived from it
# (https://<host>), so leave those empty. There is no api host. Relaycast,
# Relay History, Relayfile and durable-actors cannot run under a path prefix
# without app changes, so they keep their own hosts (gkeIngress.hosts.cast,
# history, files, actors) and the chart refuses to put them on this host. See
# README "Single-host mode" and values-single-host-example.yaml.
global:
  singleHost:
    host: ""
  # Optional customer logo for the sign-in page and dashboard. relay-webapp
  # serves it at <dashboard origin>/brand/<file> (no extra web server or
  # ingress route: / already reaches the dashboard), and relay-control sets
  # SELFHOST_LOGIN_LOGO_URL to that URL unless relay-control.login.logoUrl
  # overrides it. Set svg (inline, served as logo.svg, at most 256 KiB) or
  # existingConfigMap (+ key, the file name, .png only; default logo.png).
  # Needs components.webapp unless relay-control.login.logoUrl is set.
  # relay-control.login.orgName sets the name shown beside the logo (default
  # relay-control.bootstrap.orgName). For the dashboard's own mark, also set
  # relay-webapp.customerProfile.logo: /brand/<file>.
  branding:
    logo:
      svg: ""
      existingConfigMap: ""
      key: ""

gkeIngress:
  enabled: false
  name: agent-relay
  staticIpName: agent-relay-ingress
  managedCertificateName: agent-relay
  frontendConfigName: agent-relay
  hosts:
    root: ""
    api: ""
    cast: ""
    history: ""
    # Optional. The durable-actors publicUrl host (https://<actors>): SDK
    # follow-up invocations and actor WebSocket URLs use it. Requires
    # components.durableActors and durable-actors.publicUrl=https://<actors>.
    actors: ""
    # Optional. Relayfile's public host; requires components.relayfile.
    files: ""
  # serviceName is derived from each child chart's fullname (fullnameOverride,
  # else <release>-<chart>); an explicit value must match it. servicePort must
  # match the child's service.port.
  backends:
    dashboard: { serviceName: "", servicePort: 8080 }
    # timeoutSec (>= 60) goes into the api BackendConfig <name>-api (name
    # truncated to 59 characters first); the flows worker queue is a
    # long-lived SSE stream. Set relay-control.service.backendConfig to
    # <name>-api; the chart renders the backend-config annotation from it.
    api: { serviceName: "", servicePort: 80, timeoutSec: 3600 }
    # timeoutSec (60-86400) goes into the cast BackendConfig <name>-cast (name
    # truncated to 58 characters first): relaycast WebSockets (/v1/ws,
    # /v1/node/ws) outlive GCE's 30 s default. Set
    # relaycast.service.backendConfig to <name>-cast.
    cast: { serviceName: "", servicePort: 8787, timeoutSec: 3600 }
    history: { serviceName: "", servicePort: 8080 }
    files: { serviceName: "", servicePort: 8080 }
  # Seconds the GCE backend keeps a request (and an upgraded WebSocket) open
  # for the actors host; durable-actors sockets are long-lived.
  actorsBackendTimeoutSec: 3600

# Child values are intentionally not populated with credentials or image
# placeholders here. Every leaf chart fails closed until its existingSecret,
# public origins and immutable image digest are supplied.
relaycast: {}
relayauth:
  # JWKS publication is off by default; the umbrella routes nothing to
  # relayauth's public JWKS ingress (gkeIngress refuses jwksIngress.enabled).
  jwksIngress:
    enabled: false
sessions-pipeline: {}
relayhistory: {}
# relay-control: see charts/relay-control/values.yaml. encryption.keyId is
# required; optional: encryption.previousKeyId, secretKeys.previousEncryptionKey,
# secretKeys.internalToken, secretKeys.telemetryInstallKey, dashboardUrl,
# flows.*, telemetry.* (telemetry.level defaults to errors, effective once the
# install is registered with installId, install key and endpoint).
relay-control: {}
relay-webapp: {}
# Opt-in only: enabling components.relayflows without configuring this block
# renders a standalone Job that fails for lack of a flow source (or a
# cloudWorker Deployment that cannot enroll). Set mode, a flow source
# (standalone.flow.*) or worker credentials (credentials.existingSecret,
# worker.cloudUrl), and an immutable image for production.
relayflows: {}
# Passed through to the vendored durable-actors chart when
# components.durableActors=true; see charts/durable-actors/values.yaml and
# docs/self-hosted-durable-actors.md. Its schema requires publicUrl,
# placement.zone, storage.bucket and serviceAccount.googleServiceAccount.
durable-actors: {}
relayfile: {}
# Local kind fixtures only; production profiles leave this disabled. The
# values-kind-*.yaml profiles opt in to namespace-wide external-egress denial.
localKind:
  enabled: false
  allowLocalOnly: false
  profile: core
  temporaryRelayauth: true
  # Explicit complete-native core installer phase; empty preserves legacy profiles.
  nativePhase: ""
# Umbrella NetworkPolicy for the durable-actors control plane (port 7100):
# release-namespace pods, the actor sandbox namespace and, with
# gkeIngress.hosts.actors, the GKE load balancer ranges.
durableActorsNetworkPolicy:
  enabled: true
  extraIngressFrom: []

# Dedicated analytics file collector. Producer adapters are configured on each
# application; this chart does not enable them or redirect hosted PostHog.
telemetry-collector:
  fullnameOverride: telemetry-collector
