# Legacy-name proof overlay. Apply after values-gcp-proof.yaml. It keeps the
# object names (relay-cloud-api, relay-dashboard), proof-registry images and
# settings of the original GCP proof release, and is the base of the
# durable-actors, Relayfile and flows proof overlays. That original release
# also ran the standalone RelayHistory server and RelayAuth in their own
# namespaces; both were removed from this chart and the release is being
# retired, so History here is the native Sessions path from
# values-gcp-proof.yaml.
relay-control:
  nameOverride: relay-cloud-api
  fullnameOverride: relay-cloud-api
  image:
    # relay-control 0.5.0, df4b390; 0.5.1 is not published yet, so the session read handoff is inert on this pin.
    # The earlier 17bdc78 proof build was only in the private proof registry.
    digest: sha256:d8c26d44dccb6dd21b7033288241a379e46ce5fbca69f276c4d4745001c3c3e2
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 512Mi }
  # The live data is encrypted under this key id (set by hand on the
  # deployment before the chart rendered it).
  encryption:
    keyId: proof-1
  # The dashboard is on the root host, not the api host.
  dashboardUrl: https://gcp-proof.agentrelay.com/
  # Key in Secret agent-relay-gcp-proof; enables /internal/v1 (flows env
  # delivery). The api host denies /internal at the edge.
  secretKeys:
    internalToken: selfhost-internal-token
  # The proof has no telemetry install key: keep telemetry off explicitly.
  telemetry:
    level: "off"
  # The proof cluster's shared Cloud SQL database grants runtime access to the
  # role the Sessions stack created; control_api_runtime does not exist there.
  database:
    runtimeRole: bulls96_runtime

relay-webapp:
  nameOverride: relay-dashboard
  fullnameOverride: relay-dashboard
  api:
    serviceName: relay-cloud-api
  image:
    # Proof build of AgentWorkforce/relay-webapp 53d484b
    # (selfhost/device-approval; the self-host build served at /). Proof-only.
    digest: sha256:23361e08b899f272ed5debcbd4e7d6c6555591029357d6fba6c54236063bca62
  # The proof's custom Agent Relay Desktop build (AGENT_RELAY_SITE_URL=
  # https://gcp-proof.agentrelay.com, AGENT_RELAY_URL_SCHEME=agentrelay-gcpproof)
  # refuses links for any other scheme or site. Settings > Workspace builds its
  # connect link from this (relay-webapp #88; chart relay-webapp >= 0.1.2,
  # agent-relay >= 0.3.6, renders customerProfile, older charts ignore it).
  customerProfile:
    desktop:
      urlScheme: agentrelay-gcpproof
      siteUrl: https://gcp-proof.agentrelay.com

# The renamed Control Service and pod labels, for the native History reader and
# ingest edge from values-gcp-proof.yaml.
sessions-pipeline:
  sessionReadApi:
    networkPolicy:
      controlFrom:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: relay-cloud-api }
  ingestEdge:
    relaycontrol: { url: http://relay-cloud-api.agent-relay.svc }
