# Local development only: the base layer the native core composition
# (ci/agent-relay/kind/native_core_values.py, used by make local-up and the
# native core installer) builds the control and serve phases on. It does not
# render alone: localKind requires nativePhase=control or serve, because the
# single-phase make kind-up profile that ran the standalone RelayHistory server
# was removed. Same-namespace traffic and cluster DNS are the only egress.
localKind:
  enabled: true
  allowLocalOnly: true
  profile: core
  temporaryRelayauth: true
components:
  control: true
  webapp: true
  relaycast: true
  sessionsPipeline: true
  relayauth: true
  relayflows: false
  relayfile: false
  durableActors: false
global:
  tenant: { orgId: kind-bootstrap }
  otel: { endpoint: "" }
relay-control:
  fullnameOverride: relay-control
  image:
    # relay-control 0.5.0, df4b390; 0.5.1 is not published yet, so the session read handoff is inert on this pin.
    repository: ghcr.io/agentworkforce/relay-control
    digest: sha256:d8c26d44dccb6dd21b7033288241a379e46ce5fbca69f276c4d4745001c3c3e2
  existingSecret: kind-control
  publicUrl: https://relay.kind.agentrelay.com:8443
  dashboardUrl: https://relay.kind.agentrelay.com:8443
  encryption: { keyId: kind-1 }
  database: { runtimeRole: control_api_runtime }
  migrations: { backoffLimit: 0 }
  bootstrap:
    orgName: Kind proof
    adminEmail: owner@kind.example
    workspaceName: Default
  secretKeys:
    relaycastInternalSecret: relaycast-internal-secret
    internalToken: selfhost-internal-token
  services:
    relayauthUrl: http://relayauth.agent-relay.svc.cluster.local:8787
    relaycastUrl: http://relaycast.agent-relay.svc.cluster.local:8787
    relaycastPublicUrl: https://cast.kind.agentrelay.com:8443
  telemetry: { level: "off" }
  # The namespace-wide local policy applies to every pod, including Jobs.
  networkPolicy: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
relay-webapp:
  fullnameOverride: relay-webapp
  image:
    repository: ghcr.io/agentworkforce/relay-dashboard
    digest: sha256:e4de2c628e72e906e809fd32e6192baa7c93a404eb019964cd7706805e316e6a
  runtime:
    publicUrl: https://relay.kind.agentrelay.com:8443
  api: { serviceName: relay-control }
  ingress:
    enabled: true
    className: traefik
    host: relay.kind.agentrelay.com
    tls:
      - secretName: kind-tls
        hosts: [relay.kind.agentrelay.com]
  customerProfile:
    desktop:
      siteUrl: https://relay.kind.agentrelay.com:8443
      urlScheme: agentrelay-kind
  networkPolicy: { enabled: false }
relaycast:
  fullnameOverride: relaycast
  baseUrl: https://cast.kind.agentrelay.com:8443
  existingSecret: kind-cast
  persistence: { size: 1Gi, annotations: {} }
  networkPolicy: { enabled: false }
  ingress:
    enabled: true
    className: traefik
    hosts: [cast.kind.agentrelay.com]
    tls:
      - secretName: kind-tls
        hosts: [cast.kind.agentrelay.com]
relayauth:
  fullnameOverride: relayauth
  existingSecret: kind-auth
  baseUrl: http://relayauth.agent-relay.svc.cluster.local:8787
  issuer: http://relayauth.agent-relay.svc.cluster.local:8787
  jwksIngress: { enabled: false }
  persistence: { size: 1Gi, annotations: {} }
  networkPolicy: { enabled: false }
sessions-pipeline:
  # Held until the approved read assembly/image and ingest/auth contract land.
  sessionReadApi:
    enabled: false
  # Local Postgres is created before any schema migration; no CNPG operator.
  hoopdb: { enabled: false }
  session-object-storage: { enabled: false }
  otel: { enabled: false }
  worker:
    fullnameOverride: sessions
    components:
      bob-costas: { fullnameOverride: session-summary-worker }
      hoopdb-indexer: { fullnameOverride: session-metadata-indexer }
      referee: { fullnameOverride: session-status-worker }
    image:
      repository: ghcr.io/agentworkforce/96bulls-services
      digest: sha256:070fe6fd46ecd1e1f9db32ff22379f6df9b9e6c4d48ede5312c8fb986a95f3a9
    existingSecret: kind-pipeline
    secretKeys: { lockerAccessKeyId: rootUser, lockerSecretAccessKey: rootPassword }
    hoopdb: { existingSecret: kind-pipeline, key: HOOPDB_URL }
    environment: local
    allowInClusterHttp: true
    migrations:
      backoffLimit: 0
      hoopdb: { existingSecret: kind-pipeline, key: HOOPDB_MIGRATION_URL }
      databaseMode: selfhosted
      supabaseShim: true
      runtimeRole: sessions_pipeline_runtime
      runtimeRoleLogin: true
      functionBoundaryMode: global-default-revoke
      waitForRole: { enabled: true, functionDefault: true }
    lockerInit: { backoffLimit: 0 }
    extraEnv:
      - { name: SEARCH_INDEX_ENABLED, value: "1" }
      - { name: SEARCH_INDEX_BACKEND, value: postgres }
    networkPolicy: { enabled: false }
  alleyoop:
    fullnameOverride: session-ingest-api
    image:
      repository: ghcr.io/agentworkforce/96bulls-services
      digest: sha256:070fe6fd46ecd1e1f9db32ff22379f6df9b9e6c4d48ede5312c8fb986a95f3a9
    existingSecret: kind-pipeline
    secretKeys: { lockerAccessKeyId: rootUser, lockerSecretAccessKey: rootPassword }
    hoopdb: { existingSecret: kind-pipeline, key: HOOPDB_URL }
    environment: local
    allowInClusterHttp: true
    auth:
      jwksUrl: http://relayauth.agent-relay.svc.cluster.local:8787/.well-known/jwks.json
      issuer: http://relayauth.agent-relay.svc.cluster.local:8787
      historyOrigin: https://history.kind.agentrelay.com:8443
    extraEnv:
      - { name: READ_API_ORIGIN, value: "https://history.kind.agentrelay.com:8443" }
      - { name: SEARCH_INDEX_ENABLED, value: "1" }
      - { name: SEARCH_INDEX_BACKEND, value: postgres }
    networkPolicy: { enabled: false }
