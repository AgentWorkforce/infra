# Customer-neutral GKE deployment template derived from values-gcp-proof.yaml.
# It contains no credentials. Before deployment, replace every value marked
# REQUIRED OVERRIDE and create the referenced Secret and GCP resources.
components:
  relaycast: true
  relayauth: true
  sessionsPipeline: true
  relayhistory: true
  control: true
  webapp: true
  # Optional: run flows in-cluster. Off by default; see the relayflows block
  # below and docs/self-hosted-relayflows.md before enabling.
  relayflows: false

global:
  # REQUIRED OVERRIDE: Artifact Registry hostname for the chosen GCP region.
  imageRegistry: us-central1-docker.pkg.dev
  tenant:
    # REQUIRED OVERRIDE: stable organization ID used to partition session data.
    orgId: example-org

gkeIngress:
  enabled: true
  # REQUIRED OVERRIDE: customer-selected resource names. Reserve the static IP
  # separately; the chart creates the Ingress, certificate and FrontendConfig.
  name: example-agent-relay
  staticIpName: example-agent-relay-ingress
  managedCertificateName: example-agent-relay
  frontendConfigName: example-agent-relay
  hosts:
    # REQUIRED OVERRIDE: four public DNS names controlled by the customer.
    root: dashboard.placeholder.company
    api: api.placeholder.company
    cast: cast.placeholder.company
    history: history.placeholder.company

relaycast:
  fullnameOverride: relaycast
  image:
    # Release image (public GHCR, relaycast main bf713d86, engine 12.7.0, SBOM +
    # provenance). Mirror it by digest to your registry and override repository.
    repository: ghcr.io/agentworkforce/relaycast-self-host
    digest: sha256:81274dca7ab58673383dc7a9c777f422f29606c7422e81b5ea15724770f1455e
  # REQUIRED OVERRIDE: must use the same cast host as gkeIngress.hosts.cast.
  baseUrl: https://cast.placeholder.company
  # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
  existingSecret: example-agent-relay-secrets
  secretKeys:
    internalSecret: relaycast-internal-secret
    bootstrapSecret: relaycast-workspace-bootstrap-secret
    # REQUIRED OVERRIDE (only with credentials.authority=relayauth): token
    # Relaycast presents to RelayAuth's remote CredentialTagger.
    # relayauthToken: relaycast-relayauth-token
    # REQUIRED OVERRIDE (only with credentials.authority=self): local ar_
    # keyring; a mounted keyring always wins over the remote tagger.
    # credentialKeyring: relaycast-credential-keyring
  # Optional: RelayAuth-issued ar_ credentials (model B). RelayAuth owns the
  # ar_ tag keyring and pushes ar_ws_ workspace keys into Relaycast; Relaycast
  # verifies tags through RelayAuth's remote CredentialTagger. Requires a
  # >=12.3.x relaycast engine image (the pinned default, engine 12.7.0,
  # satisfies it) and components.relayauth=true.
  # credentials:
  #   format: ar
  #   authority: relayauth
  #   relayauth:
  #     url: http://relayauth:8787
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    # Binds the gkeIngress cast BackendConfig (WebSocket timeout).
    # REQUIRED OVERRIDE: <gkeIngress.name>-cast.
    backendConfig: example-agent-relay-cast
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    # Same-namespace callers plus Google Front End proxies and health checkers
    # for the global external Application Load Balancer created below.
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 35.191.0.0/16 }
      - ipBlock: { cidr: 130.211.0.0/22 }

relayauth:
  fullnameOverride: relayauth
  image:
    # Release image (public GHCR). Mirror it by digest to your registry and override repository.
    repository: ghcr.io/agentworkforce/relayauth
    digest: sha256:c23c92d25fdffef3b5838a1eef4c226925f859706365d9ccece229795b877288
  baseUrl: http://relayauth:8787
  issuer: http://relayauth:8787
  # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
  existingSecret: example-agent-relay-secrets
  secretKeys:
    internalSecret: relayauth-internal-secret
    signingKey: relayauth-signing-key.pem
    bootstrapApiKey: relayauth-bootstrap-api-key
    # REQUIRED OVERRIDE (only when RelayAuth issues relaycast ar_ keys, i.e.
    # relaycast.credentials.authority=relayauth): the ar_ tag keyring RelayAuth
    # owns, and relaycast's internal-secret so RelayAuth can push ar_ws_
    # workspace keys into the internal admin API. Set both or neither.
    # relaycastCredentialKeyring: relaycast-credential-keyring
    # relaycastInternalSecret: relaycast-internal-secret
  # Relaycast internal admin API, used only with the model B keyring above.
  # relaycast.fullnameOverride=relaycast in this namespace makes the short
  # Service name resolve.
  relaycast:
    url: http://relaycast:8787
  jwksIngress:
    enabled: false
  networkPolicy:
    enabled: true

sessions-pipeline:
  worker:
    image:
      # Release image (public GHCR, sessions-pipeline f1c2672: origin-bound
      # courier assertions, #204). Mirror it by digest to your registry and
      # override repository. Before its first migrate, run the Cloud SQL
      # bootstraps shipped in the image (/app/supabase/bootstrap/) as the
      # migration owner, in order: cloudsql_migration_roles.sql,
      # session_directory_search_worker.sql, session_token_verifier.sql,
      # session_ingest_roles.sql, cloudsql_owner_function_default_revoke.sql.
      # This chart does not create those roles (roleBootstrap: false). An
      # upgrade from 0.3.6 adds session_token_verifier.sql and
      # session_ingest_roles.sql; the others already ran at install.
      repository: ghcr.io/agentworkforce/96bulls-services
      digest: sha256:070fe6fd46ecd1e1f9db32ff22379f6df9b9e6c4d48ede5312c8fb986a95f3a9
    # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
    existingSecret: example-agent-relay-secrets
    summaryEncryption:
      existingSecret: example-agent-relay-secrets
    hoopdb:
      existingSecret: example-agent-relay-secrets
      key: HOOPDB_URL
    # Session objects live in GCS through the services' native GCS adapter
    # (LOCKER_PROVIDER=gcs) with GKE Workload Identity; the endpoint stays
    # empty (the official https://storage.googleapis.com API) and no HMAC key
    # is involved. An empty endpoint with the default s3 provider would mean
    # AWS S3.
    locker:
      provider: gcs
      endpoint: ""
      # REQUIRED OVERRIDE: customer-owned GCS bucket and its GCP region.
      bucket: example-agent-relay-sessions
      region: us-central1
      credentials:
        mode: podIdentity
    lockerInit:
      enabled: false
    # REQUIRED OVERRIDE: provider=gcs arms the services' GCS data-path
    # readiness check, which requires these settings (no secrets) on every
    # worker and Alleyoop pod. The chart refuses to render without them.
    extraEnv: &sessionsGcsDataPath
      - { name: CLOUD_SQL_CONNECTION_NAME, value: "example-project:us-central1:example-sessions" }
      - { name: REDIS_HOST, value: "10.0.0.3" }
      - { name: REDIS_PORT, value: "6378" }
      - { name: REDIS_AUTH_ENABLED, value: "false" }
      - { name: REDIS_TRANSIT_ENCRYPTION, value: SERVER_AUTHENTICATION }
      # Memorystore server CA bundle (public PEM, never a private key).
      - { name: REDIS_TLS_CA_PEM, value: "REQUIRED OVERRIDE: Memorystore server CA PEM bundle" }
      - { name: PUBSUB_TOPIC, value: "projects/example-project/topics/example-sessions" }
      - { name: PUBSUB_SUBSCRIPTION, value: "projects/example-project/subscriptions/example-sessions" }
    migrations:
      hoopdb:
        existingSecret: example-agent-relay-secrets
        key: HOOPDB_MIGRATION_URL
      databaseMode: cloudsql
      supabaseShim: false
      roleBootstrap: false
      runtimeRole: sessions_runtime
      runtimeRoleLogin: true
      functionBoundaryMode: global-default-revoke
  alleyoop:
    image:
      # Same services image repository and digest as worker.
      repository: ghcr.io/agentworkforce/96bulls-services
      digest: sha256:070fe6fd46ecd1e1f9db32ff22379f6df9b9e6c4d48ede5312c8fb986a95f3a9
    # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
    existingSecret: example-agent-relay-secrets
    hoopdb:
      existingSecret: example-agent-relay-secrets
      key: HOOPDB_URL
    locker:
      provider: gcs
      endpoint: ""
      # REQUIRED OVERRIDE: same GCS bucket and region as worker.locker.
      bucket: example-agent-relay-sessions
      region: us-central1
      credentials:
        mode: podIdentity
    # Same GCS data-path settings as worker.extraEnv.
    extraEnv: *sessionsGcsDataPath
    # The ingest (services f1c2672 and later) validates its RelayAuth/JWKS
    # URLs: https, or (with this) plain http to an in-cluster Service FQDN
    # only (<svc>.<ns>.svc), as in values-eks.yaml.
    allowInClusterHttp: true
    auth:
      # REQUIRED OVERRIDE: <release namespace> in the FQDN.
      jwksUrl: http://relayauth.agent-relay.svc:8787/.well-known/jwks.json
      # Must equal relayauth.issuer; the chart default (https://96bulls.local)
      # rejects every RelayAuth-signed courier assertion.
      issuer: http://relayauth:8787
      # REQUIRED OVERRIDE: the bare origin couriers use as the History
      # assertion audience (byte-equal to RELAYAUTH_HISTORY_ORIGIN). It must
      # equal relayhistory.relayauth.historyOrigin (the chart refuses a
      # mismatch) and relay-control.services.relayhistoryPublicUrl.
      historyOrigin: https://history.placeholder.company
  hoopdb:
    enabled: false
  locker:
    enabled: false

relayhistory:
  fullnameOverride: relayhistory
  image:
    # Release image (public GHCR, relayhistory-cloud 53c3333). Mirror it by digest to your registry and override repository.
    repository: ghcr.io/agentworkforce/relayhistory
    digest: sha256:d3166bb14e1d6043426a4dd8cc05408b94574c8d79ad5fd6e789e0de00ab371b
  database:
    # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
    existingSecret: example-agent-relay-secrets
  relayauth:
    # REQUIRED OVERRIDE: historyOrigin must use gkeIngress.hosts.history.
    historyOrigin: https://history.placeholder.company
    jwksUrl: http://relayauth:8787/.well-known/jwks.json
    issuer: http://relayauth:8787
  agentRelayCloud:
    apiUrl: http://relay-control
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 35.191.0.0/16 }
      - ipBlock: { cidr: 130.211.0.0/22 }
    allowAllEgress: true

relay-control:
  fullnameOverride: relay-control
  image:
    # Release image (public GHCR, selfhost-api 0.3.0, relaycontrol 9b80b04). Mirror it by digest to your registry and override repository.
    repository: ghcr.io/agentworkforce/selfhost-api
    digest: sha256:95c7877741054dc2f1cafa26be3faa9bfe4660ed85d637aef4524daa10481963
  database:
    runtimeRole: control_api_runtime
  # Non-secret id of the encryption key (SELFHOST_ENCRYPTION_KEY_ID), stored
  # with every encrypted value. Keep it stable; on rotation move it to
  # encryption.previousKeyId with secretKeys.previousEncryptionKey.
  encryption:
    keyId: primary
  # REQUIRED OVERRIDE: publicUrl must use gkeIngress.hosts.api.
  publicUrl: https://api.placeholder.company
  # REQUIRED OVERRIDE: existing Secret name; see README for required keys.
  existingSecret: example-agent-relay-secrets
  services:
    relayauthUrl: http://relayauth:8787
    relaycastUrl: http://relaycast:8787
    # REQUIRED OVERRIDE: public service URLs must match the corresponding hosts.
    relaycastPublicUrl: https://cast.placeholder.company
    relayhistoryUrl: http://relayhistory:8080
    relayhistoryPublicUrl: https://history.placeholder.company
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
    # Binds the gkeIngress api BackendConfig (backend timeout for the flows
    # worker queue SSE stream); the chart renders the annotation.
    # REQUIRED OVERRIDE: <gkeIngress.name>-api.
    backendConfig: example-agent-relay-api
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 35.191.0.0/16 }
      - ipBlock: { cidr: 130.211.0.0/22 }
    allowAllEgress: true
  # First boot and sign-in (relay-control README "Sign-in, bootstrap and
  # invites"). With these set, the first start creates the organization (the
  # admin email is its owner) and a Default workspace bound to a new Relaycast
  # workspace; the admin signs in at https://<root host>/login and invites
  # teammates from Settings > Members. No manual bootstrap step is needed.
  # REQUIRED with bootstrap/auth/smtp: https://<gkeIngress.hosts.root>/ (the
  # chart refuses any other host). The pinned selfhost-api and dashboard
  # digests include these features.
  # dashboardUrl: https://dashboard.placeholder.company/
  # bootstrap:
  #   orgName: Acme
  #   adminEmail: platform-admin@acme.com
  # auth:
  #   oidc:
  #     # Google Workspace: an "Internal" OAuth client (Web application) with
  #     # redirect URI https://<root host>/login/oidc/callback.
  #     issuer: https://accounts.google.com
  #     clientId: 1234567890-abc.apps.googleusercontent.com
  #     allowedDomains: [acme.com]
  #     displayName: Google Workspace
  #   # Optional: verified emails in these domains join as member without an
  #   # invite.
  #   # autoJoinDomains: [acme.com]
  #   # Optional email sign-in links (needs smtp).
  #   # emailLink: { enabled: true }
  # # Optional: email invites (otherwise owners copy the single-use link).
  # smtp:
  #   host: smtp.acme.com
  #   port: 587
  #   username: relay@acme.com
  #   from: Agent Relay <relay@acme.com>
  # secretKeys:
  #   # Same key relaycast.secretKeys.internalSecret names (bootstrap creates
  #   # the workspace's Relaycast workspace with it).
  #   relaycastInternalSecret: relaycast-internal-secret
  #   oidcClientSecret: oidc-client-secret
  #   smtpPassword: smtp-password

relay-webapp:
  fullnameOverride: relay-webapp
  image:
    # Release image (public GHCR, relay-webapp main e5003d0). Mirror it by digest to your registry and override repository.
    repository: ghcr.io/agentworkforce/relay-dashboard
    digest: sha256:c50005fcdd1fc5ab5ef3dac9b621db8e0c7e03480406bfe519743ae435d8f1ad
  runtime:
    # REQUIRED OVERRIDE: publicUrl must use gkeIngress.hosts.root.
    publicUrl: https://dashboard.placeholder.company
    appPath: /
    apiBasePath: /cloud/api
    loginPath: /login
  # Optional enterprise branding (relay-webapp customerProfile; README
  # "Customer profile"). Empty keeps the Agent Relay look. It needs a
  # dashboard image built from relay-webapp 8eac2bd or later; older images
  # ignore it.
  # customerProfile:
  #   productName: Acme Relay
  #   logo:
  #     light: https://acme.example/brand/logo-on-light.svg
  #     dark: https://acme.example/brand/logo-on-dark.svg
  #   favicon: https://acme.example/brand/favicon.svg
  #   accentColor: "#7c3aed"
  #   brandColor: "#5b21b6"
  #   supportUrl: mailto:support@acme.example
  #   poweredByAgentRelay: true
  api:
    serviceName: relay-control
  service:
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
  ingress:
    enabled: false
  networkPolicy:
    enabled: true
    ingressFrom:
      - podSelector: {}
      - ipBlock: { cidr: 35.191.0.0/16 }
      - ipBlock: { cidr: 130.211.0.0/22 }

# Optional component (components.relayflows). Two modes:
#  - standalone (default): a Kubernetes Job/CronJob that runs a flow entirely
#    in-cluster. Works against this suite today; supply exactly one flow
#    source and an image containing the flow and every harness CLI.
#  - cloudWorker: a long-running assignment worker that enrolls with
#    `agent-relay cloud worker register` against worker.cloudUrl. The
#    self-hosted control plane does not yet implement the /api/v1/workers/*
#    enroll, queue and assignment endpoints, so this mode only works pointed
#    at a control plane that does (for example hosted Agent Relay Cloud).
#    See docs/self-hosted-relayflows.md.
#relayflows:
#  mode: standalone
#  image:
#    # REQUIRED OVERRIDE: immutable image containing relayflows, the flow
#    # source and the harness CLIs the flow uses. The stock node image only
#    # npm-installs the pinned runtime at pod start.
#    repository: us-central1-docker.pkg.dev/example-project/example-images/relayflows
#    tag: "22.23.3-bookworm-slim"
#    pullPolicy: IfNotPresent
#  runtimeInstaller:
#    enabled: false
#  standalone:
#    # REQUIRED OVERRIDE: exactly one of flow.path (inside the image),
#    # flow.content (chart-managed ConfigMap) or flow.existingConfigMap.
#    flow:
#      path: /opt/flows/example.flow.ts
#      content: ""
#      existingConfigMap: ""
#  # cloudWorker mode only. REQUIRED OVERRIDE: enrollment token Secret;
#  # the worker reads AGENT_RELAY_WORKER_ENROLLMENT_TOKEN from
#  # credentials.existingSecretKey. cloudUrl is the control-plane base URL the
#  # CLI appends /api/v1/workers/* to: http://relay-control (or
#  # http://relay-control/cloud) in-cluster, https://<gkeIngress.hosts.api>
#  # from outside — once selfhost-api implements the worker endpoints.
#  # mode: cloudWorker
#  # worker:
#  #   cloudUrl: http://relay-control
#  # credentials:
#  #   existingSecret: example-agent-relay-secrets
#  #   existingSecretKey: AGENT_RELAY_WORKER_ENROLLMENT_TOKEN
#  # extraEnvFrom carries model/provider credentials (for example an
#  # ESO-created Secret with ANTHROPIC_API_KEY).
#  extraEnvFrom: []
