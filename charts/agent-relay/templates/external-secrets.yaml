{{- /*
Install Secrets from an external store (AWS SSM Parameter Store, AWS Secrets
Manager or any other External Secrets Operator provider). Off by default. Each
externalSecrets.secrets entry renders one ExternalSecret whose target is a
Kubernetes Secret of the same name, so every subchart keeps reading the Secret
names it already takes (existingSecret, config.existingSecret, ...).
*/ -}}
{{- $es := .Values.externalSecrets | default dict -}}
{{- if $es.enabled }}
{{- $store := $es.store | default dict -}}
{{- $ref := $es.secretStoreRef | default dict -}}
{{- $storeKind := $ref.kind | default "ClusterSecretStore" -}}
{{- $storeName := $ref.name | default "" -}}
{{- if $store.create }}
{{- $storeKind = "SecretStore" -}}
{{- $storeName = $store.name | default (printf "%s-external-secrets" .Release.Name | trunc 63 | trimSuffix "-") -}}
{{- if not (and (kindIs "map" $store.provider) $store.provider) }}{{ fail "externalSecrets.store.create requires externalSecrets.store.provider, e.g. {aws: {service: ParameterStore, region: us-east-1}}" }}{{ end }}
{{- else }}
{{- if not $storeName }}{{ fail "externalSecrets.enabled requires externalSecrets.secretStoreRef.name (an existing store), or externalSecrets.store.create=true with externalSecrets.store.provider" }}{{ end }}
{{- if not (has $storeKind (list "SecretStore" "ClusterSecretStore")) }}{{ fail "externalSecrets.secretStoreRef.kind must be SecretStore or ClusterSecretStore" }}{{ end }}
{{- end }}
{{- $secrets := $es.secrets | default dict -}}
{{- if not $secrets }}{{ fail "externalSecrets.enabled requires at least one entry in externalSecrets.secrets (target Secret name -> data)" }}{{ end }}
{{- $apiVersion := $es.apiVersion | default "external-secrets.io/v1" -}}
{{- if $store.create }}
apiVersion: {{ $apiVersion }}
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
spec:
  provider:
    {{- toYaml $store.provider | nindent 4 }}
{{- end }}
{{- range $name := keys $secrets | sortAlpha }}
{{- $s := index $secrets $name | default dict -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$" $name) }}{{ fail (printf "externalSecrets.secrets.%s: the key is the target Secret name and must be a DNS-1123 subdomain" $name) }}{{ end }}
{{- if not (kindIs "map" $s) }}{{ fail (printf "externalSecrets.secrets.%s must be a map with data and/or dataFrom" $name) }}{{ end }}
{{- $data := $s.data | default dict -}}
{{- if not (or $data $s.dataFrom) }}{{ fail (printf "externalSecrets.secrets.%s needs data (Secret key -> remote key) or dataFrom" $name) }}{{ end }}
{{- $policy := $s.creationPolicy | default ($es.creationPolicy | default "Owner") -}}
{{- if not (has $policy (list "Owner" "Merge" "Orphan" "None")) }}{{ fail (printf "externalSecrets.secrets.%s.creationPolicy must be Owner, Merge, Orphan or None" $name) }}{{ end }}
---
apiVersion: {{ $apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    helm.sh/chart: {{ printf "%s-%s" $.Chart.Name $.Chart.Version }}
spec:
  refreshInterval: {{ $s.refreshInterval | default ($es.refreshInterval | default "1h") | quote }}
  secretStoreRef:
    kind: {{ $storeKind }}
    name: {{ $storeName }}
  target:
    name: {{ $name }}
    creationPolicy: {{ $policy }}
    {{- with $s.deletionPolicy }}
    deletionPolicy: {{ . }}
    {{- end }}
    {{- with $s.template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if $data }}
  data:
    {{- range $k := keys $data | sortAlpha }}
    {{- $r := index $data $k }}
    {{- if not (regexMatch "^[-._a-zA-Z0-9]+$" $k) }}{{ fail (printf "externalSecrets.secrets.%s.data: %q is not a valid Secret data key" $name $k) }}{{ end }}
    - secretKey: {{ $k | quote }}
      remoteRef:
        {{- if kindIs "string" $r }}
        key: {{ $r | quote }}
        {{- else if and (kindIs "map" $r) $r.key }}
        {{- toYaml $r | nindent 8 }}
        {{- else }}
        {{- fail (printf "externalSecrets.secrets.%s.data.%s must be a remote key string or a remoteRef map with key" $name $k) }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with $s.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
