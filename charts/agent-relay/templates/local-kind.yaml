{{- $local := .Values.localKind | default dict -}}
{{- if $local.enabled -}}
{{- if not (has $local.profile (list "core" "addons")) }}{{ fail "localKind.profile must be core or addons" }}{{ end -}}
{{- if ne (toString $local.temporaryRelayauth) (toString .Values.components.relayauth) }}{{ fail "localKind.temporaryRelayauth must explicitly match components.relayauth; remove both only after upstream auth removal ships" }}{{ end -}}
{{- if or .Values.components.durableActors (not .Values.components.cloudApi) (not .Values.components.dashboard) (not .Values.components.sessionsPipeline) (not .Values.components.relayhistory) (not .Values.components.relaycast) }}{{ fail "local kind profiles require control, app, cast, history and sessions, without durable actors" }}{{ end -}}
{{- $addons := eq $local.profile "addons" -}}
{{- if or (ne $addons .Values.components.relayflows) (ne $addons .Values.components.relayfile) }}{{ fail "localKind.profile and components.relayflows/relayfile must agree" }}{{ end -}}
# This policy deliberately covers support pods and all migration Jobs too.
# Calico must be running; the proof tests a real denial, not policy presence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kind-no-external-egress
  namespace: {{ .Release.Namespace | quote }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Dashboard leaf ingress already handles /cloud/api and /login. Route the
# Desktop and integration /api entry point to the same control plane as well.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kind-control-api
  namespace: {{ .Release.Namespace | quote }}
spec:
  ingressClassName: traefik
  tls:
    - secretName: kind-tls
      hosts: [relay.kind.agentrelay.com]
  rules:
    - host: relay.kind.agentrelay.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: relaycontrol
                port: { number: 80 }
{{- end }}
