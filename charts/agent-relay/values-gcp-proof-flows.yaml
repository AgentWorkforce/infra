# Proof-cluster overlay: enable standalone Relayflows with a deterministic
# smoke flow. Apply after values-gcp-proof.yaml and values-gcp-proof-live.yaml.
# The flow needs no model credentials: each step probes one in-cluster suite
# service and fails on a non-2xx response.
components:
  relayflows: true

relayflows:
  mode: standalone
  runtimeInstaller:
    enabled: true
    relayflowsVersion: "2.0.50"
  # The smoke Job runs once per Helm revision; 100m fits the proof's
  # e2-medium pool next to the rest of the suite (chart default: 250m).
  resources:
    requests: { cpu: 100m, memory: 512Mi }
  standalone:
    backoffLimit: 0
    ttlSecondsAfterFinished: 86400
    activeDeadlineSeconds: 900
    flow:
      content: |
        version: "0.1.0"
        name: agent-relay-suite-smoke
        description: Probe the self-hosted suite services from inside the cluster.
        steps:
          - id: relaycast
            type: deterministic
            command: >-
              node -e 'fetch("http://relaycast:8787/health").then(r=>{console.log("relaycast",r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e.cause?.code||e.message);process.exit(1)})'
          - id: control-api
            type: deterministic
            command: >-
              node -e 'fetch("http://relay-control/healthz").then(r=>{console.log("control-api",r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e.cause?.code||e.message);process.exit(1)})'
          - id: history
            type: deterministic
            command: >-
              node -e 'fetch("http://agent-relay-read-api/healthz").then(r=>{console.log("history",r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e.cause?.code||e.message);process.exit(1)})'
          - id: gate
            type: deterministic
            command: printf 'suite-smoke-verified\n'
            verification:
              type: steps_green
              ids: [relaycast, control-api, history]
