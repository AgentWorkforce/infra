{{- include "slack-relay.validate" . }}
{{- $full := include "slack-relay.fullname" . }}
{{- $repos := list }}
{{- $reposOn := .Values.repos.enabled }}
{{- if $reposOn }}{{ $repos = include "slack-relay.repos" . | fromJsonArray }}{{ end }}
{{- $allowed := .Values.host.allowedTools }}
{{- $persona := .Values.host.persona }}
{{- if $reposOn }}
{{- /* Absolute-path rules ("//" is the filesystem root in Claude Code's
     permission syntax) for the shared read-only checkouts; agents still see
     nothing of another agent's workdir. */}}
{{- $allowed = concat $allowed (list "Read(//repos/**)" "Glob(//repos/**)" "Grep(//repos/**)") }}
{{- $names := list }}{{ range $repos }}{{ $names = append $names .repo }}{{ end }}
{{- $which := ternary (printf "these GitHub repositories: %s" (join ", " $names)) "the team's GitHub repositories (Glob with path /repos finds their files)" (gt (len $names) 0) }}
{{- $persona = printf "%s\n\nRead-only copies of %s are at /repos/<owner>/<name>, refreshed every %d minutes. Use Read, Glob and Grep with absolute paths under /repos to look at them. Right after a restart they can take a minute to appear." $persona $which (int .Values.repos.refreshMinutes) }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}-host
  labels:
    {{- include "slack-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: host
spec:
  # One host: each agent's Claude session lives on its volume.
  replicas: 1
  serviceName: {{ $full }}-host
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "slack-relay.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: host
  template:
    metadata:
      labels:
        {{- include "slack-relay.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: host
      {{- if or .Values.podAnnotations $reposOn }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $reposOn }}
        checksum/repo-sync: {{ print (.Files.Get "files/repo-sync.sh") (.Files.Get "files/repo-list.mts") | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: host
          image: {{ include "slack-relay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          # No Slack credentials here: agents answer through the relay, and
          # only the router talks to Slack.
          env:
            - name: ROLE
              value: host
            {{- include "slack-relay.commonEnv" . | nindent 12 }}
            - name: HOST_AGENT_NAME
              value: {{ .Values.host.agentName | quote }}
            - name: AGENT_MODEL
              value: {{ .Values.host.agentModel | quote }}
            - name: AGENT_PERSONA
              value: {{ $persona | quote }}
            - name: AGENT_ALLOWED_TOOLS
              value: {{ join " " $allowed | quote }}
            - name: AGENT_DISALLOWED_TOOLS
              value: {{ join " " .Values.host.disallowedTools | quote }}
            - name: AGENT_PERMISSION_MODE
              value: {{ .Values.host.permissionMode | quote }}
            - name: RELAYCAST_MCP
              value: {{ .Values.host.relaycastMcp | quote }}
            - name: TURN_TIMEOUT_SECONDS
              value: {{ .Values.host.turnTimeoutSeconds | quote }}
            - name: IDLE_RELEASE_MINUTES
              value: {{ .Values.host.idleReleaseMinutes | quote }}
            - name: DATA_DIR
              value: /data
            {{- include "slack-relay.mcpEnv" . | nindent 12 }}
            {{- with .Values.host.mcpServers }}
            - name: AGENT_MCP_SERVERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- include "slack-relay.secretEnv" (dict "env" "ANTHROPIC_API_KEY" "ref" .Values.secrets.anthropicApiKey) | nindent 12 }}
            {{- with .Values.sessions.upload }}
            {{- if .enabled }}
            - name: SESSIONS_UPLOAD
              value: "true"
            - name: SESSIONS_ORG_ID
              value: {{ .orgId | quote }}
            - name: SESSIONS_WORKSPACE_ID
              value: {{ .workspaceId | quote }}
            {{- with .baseUrl }}
            - name: SESSIONS_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .relayControlUrl }}
            - name: RELAY_CONTROL_URL
              value: {{ .relayControlUrl | quote }}
            {{- include "slack-relay.secretEnv" (dict "env" "SESSIONS_ENROLLMENT_KEY" "ref" $.Values.secrets.sessionsEnrollmentKey) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.host.resources | nindent 12 }}
          volumeMounts:
            - { name: sessions, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            {{- if $reposOn }}
            - { name: repos, mountPath: /repos, readOnly: true }
            {{- end }}
        {{- if $reposOn }}
        # Keeps /repos current. The GitHub token is in this container's
        # environment only; the host container and the agents never get it.
        - name: repo-sync
          image: {{ include "slack-relay.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/usr/bin/tini, --, /bin/sh, /etc/repo-sync/repo-sync.sh]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: REPOS_DIR
              value: /repos
            - name: REPOS_CACHE_DIR
              value: /var/cache/repo-sync
            - name: REPOS_BASE_URL
              value: {{ include "slack-relay.reposBaseUrl" . | quote }}
            - name: REPOS_API_URL
              value: {{ include "slack-relay.reposApiUrl" . | quote }}
            - name: REPOS_REFRESH_MINUTES
              value: {{ int .Values.repos.refreshMinutes | quote }}
            - name: REPOS_LIST
              {{- $lines := list }}{{ range $repos }}{{ $lines = append $lines (trim (printf "%s %s" .repo .ref)) }}{{ end }}
              value: {{ join "\n" $lines | quote }}
            {{- include "slack-relay.secretEnv" (dict "env" "GITHUB_TOKEN" "ref" .Values.repos.token) | nindent 12 }}
          resources:
            {{- toYaml .Values.repos.resources | nindent 12 }}
          volumeMounts:
            - { name: repos, mountPath: /repos }
            - { name: repos-cache, mountPath: /var/cache/repo-sync }
            - { name: repo-sync-tmp, mountPath: /tmp }
            - { name: repo-sync-script, mountPath: /etc/repo-sync, readOnly: true }
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $reposOn }}
        - name: repos
          emptyDir:
            {{- with .Values.repos.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        - name: repos-cache
          emptyDir: {}
        - name: repo-sync-tmp
          emptyDir: {}
        - name: repo-sync-script
          configMap:
            name: {{ $full }}-repo-sync
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: sessions
        labels:
          {{- include "slack-relay.selectorLabels" . | nindent 10 }}
          app.kubernetes.io/component: host
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.host.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.host.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-host
  labels:
    {{- include "slack-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: host
spec:
  clusterIP: None
  selector:
    {{- include "slack-relay.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: host
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if $reposOn }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-repo-sync
  labels:
    {{- include "slack-relay.labels" . | nindent 4 }}
    app.kubernetes.io/component: host
data:
  repo-sync.sh: |
    {{- .Files.Get "files/repo-sync.sh" | nindent 4 }}
  repo-list.mts: |
    {{- .Files.Get "files/repo-list.mts" | nindent 4 }}
{{- end }}
