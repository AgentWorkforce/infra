{{- if and .Values.ingress.enabled (eq .Values.slack.mode "http") }}
{{- $full := include "slack-relay.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "slack-relay.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only Slack's event endpoint is public; the ledger endpoints stay in-cluster.
          - path: /slack/events
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-router
                port: { name: http }
{{- end }}
