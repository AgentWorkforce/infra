apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry-collector.fullname" . }}
  labels: {{ include "telemetry-collector.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{ include "telemetry-collector.selectorLabels" . | nindent 4 }}
  ports: [{ name: https, port: 8443, targetPort: https }]
