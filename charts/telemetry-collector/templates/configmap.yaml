{{- include "telemetry-collector.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "telemetry-collector.fullname" . }}
  labels: {{ include "telemetry-collector.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections {{ add (mul (int .Values.limits.maxInFlight) 2) 32 }}; }
    http {
      access_log off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server_tokens off;
      server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /var/run/secrets/telemetry-tls/tls.crt;
        ssl_certificate_key /var/run/secrets/telemetry-tls/tls.key;
        client_max_body_size {{ int .Values.limits.maxBatchBytes }};
        client_body_timeout {{ div (add (int .Values.limits.requestTimeoutMs) 999) 1000 }}s;
        proxy_intercept_errors on;
        location = /v1/events {
          proxy_pass http://127.0.0.1:4319;
          proxy_http_version 1.1;
          proxy_request_buffering off;
          proxy_buffering off;
          proxy_read_timeout 305s;
        }
        location = /healthz {
          proxy_pass http://127.0.0.1:4319;
        }
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;
        location @unavailable {
          default_type application/json;
          return 503 '{"error":"collector_unavailable"}';
        }
        location @too_large {
          default_type application/json;
          return 413 '{"error":"payload_too_large"}';
        }
        location / {
          default_type application/json;
          return 404 '{"error":"not_found"}';
        }
      }
    }
