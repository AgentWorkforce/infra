apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "telemetry-collector.fullname" . }}
  labels: {{ include "telemetry-collector.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "telemetry-collector.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{ toYaml .Values.networkPolicy.allowedFrom | nindent 8 }}
      ports: [{ protocol: TCP, port: 8443 }]
  egress: []
