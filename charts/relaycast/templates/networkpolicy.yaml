{{- include "relaycast.validate" . }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relaycast.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "relaycast.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relaycast.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if include "relaycast.gateOnly" . }}
        # Gate-only: relaygate, this chart's migration Job, and the direct
        # server-side callers (networkPolicy.gateOnlyFrom). ingressFrom is ignored.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: relaygate
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "relaycast.name" . }}-migration
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.networkPolicy.gateOnlyFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
