# Relaycast self-host currently uses one SQLite database and local file store.
# The chart therefore permits exactly one replica and uses Recreate upgrades.
# runtime.backend=postgres is also single replica: realtime, presence and rate
# limits are in-process.
replicaCount: 1

image:
  repository: ghcr.io/agentworkforce/relaycast-self-host
  # relaycast-self-host:12.7.0, built from relaycast main bf713d86 by the
  # reviewed publish-container workflow (engine 12.7.0). Immutable
  # multi-platform manifest (linux/amd64 and linux/arm64) with an SPDX SBOM,
  # max-mode provenance and a GitHub build-provenance attestation.
  digest: sha256:81274dca7ab58673383dc7a9c777f422f29606c7422e81b5ea15724770f1455e
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Optional Node-runtime analytics through a private HTTPS file collector.
analytics:
  enabled: false
  collectorUrl: ""
  deploymentId: ""
  existingSecret: ""
  tokenKey: token
  caConfigMap: ""
  caKey: ca.crt

server:
  port: 8787
  environment: production

runtime:
  # sqlite: the released portable single-node image (one replica, SQLite and
  #   files on one PVC).
  # durable-actors: the Relaycast engine in one TerseAI durable-actors
  #   `Workspace` actor per workspace, behind a stateless gateway Deployment
  #   with the same name, Service and selector. Env contract v1:
  #   docs/self-hosted-durable-actors.md. Requires a durable-actors control
  #   plane (agent-relay components.durableActors) and ar_ credentials.
  # postgres: the portable image on an external PostgreSQL database, one
  #   replica, files still on the PVC. Needs runtime.postgres, postgresCa and
  #   the secretKeys.databaseOwnerUrl / databaseRuntimeUrl Secret keys.
  backend: sqlite
  postgres:
    # Used instead of image.* on this backend.
    image:
      repository: ghcr.io/agentworkforce/relaycast-self-host
      # relaycast-self-host:12.8.0-pg.3, relaycast main 810f48ce (#653 full
      # actor migration export, #657 PostgreSQL deadlock fix, #663, #664, #667
      # failover recovery and /health/live + /health/ready, #668), publish run
      # 43497501006. Multi-platform with GitHub build provenance.
      digest: sha256:cc2a79f02d39978fa04322b5a45497737ff137bc2a5db5615c7eee690030de83
    # TCP keepalive sysctls on the server pod (net.ipv4.tcp_keepalive_intvl /
    # tcp_keepalive_probes, namespaced safe sysctls from Kubernetes 1.29). With
    # the engine's socket keepalive a half-open connection to a failed-over
    # primary is found in about intervalSeconds x probes instead of ~11 min of
    # kernel defaults. Ignored on clusters before 1.29.
    tcpKeepalive:
      enabled: true
      intervalSeconds: 5
      probes: 3
    # The `migrate` Job: a plain Job (no Helm hook) named by a hash of its
    # rendered pod template, so any change to it runs a new Job.
    migrations:
      # Change only to force a re-run of an otherwise identical template.
      identitySalt: ""
      backoffLimit: 3
      # Also bounds how long the server's init container waits before it
      # restarts and waits again.
      activeDeadlineSeconds: 1800
  durableActors:
    projectId: relaycast
    # durable-actors organization the deployer registers under.
    organizationId: relaycast
    # Control-plane origin. Empty: the umbrella's durable-actors release,
    # http://<release>-durable-actors.<namespace>.svc.cluster.local:7100.
    controlPlaneUrl: ""
    # Optional DURABLE_ACTORS_HOME_REGION for the gateway's invocations.
    homeRegion: ""
    # Where the gateway dials actor sockets (DURABLE_ACTORS_SOCKET_ORIGIN, needs
    # an actors gateway built from relaycast #655 or later). The control plane
    # hands out socket URLs on durable-actors.publicUrl; a cluster that cannot
    # resolve or reach that host (no split-horizon DNS or hairpin) closes
    # every /v1/ws and /v1/node/ws client with 1011. "controlPlane": the
    # in-cluster control plane URL above; an http(s) origin: that; "": the
    # public URL.
    socketOrigin: ""
    gateway:
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-gateway
        # Pin a digest; a tag is accepted for local proofs only.
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      # More than one replica requires fileStore.driver gcs or s3.
      replicaCount: 1
      # Generated topology spread for the gateway Deployment. Unlike the
      # chart-wide topologySpreadConstraints escape hatch, this selector is
      # derived from the release labels and cannot accidentally select a
      # different Relaycast release in the namespace.
      topologySpread:
        enabled: false
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
      livenessProbe:
        httpGet: { path: /healthz, port: http }
        periodSeconds: 20
        timeoutSeconds: 5
      readinessProbe:
        httpGet: { path: /readyz, port: http }
        periodSeconds: 10
        timeoutSeconds: 5
    # The gateway's invocation credential (DURABLE_ACTORS_SECRET), in its OWN
    # Secret so an invoke-only key replaces it with a values change only.
    # scope: admin means it is still a copy of the durable-actors admin
    # api-key (NOT release-grade: upstream has no invoke-only key yet);
    # invoke-only once the upstream scoped key exists.
    invocationSecret:
      name: ""
      key: durable-actors-invoke-key
      scope: admin
    # The durable-actors admin api-key: read ONLY by the deployer Job.
    adminKeySecret:
      name: actors-credentials
      key: api-key
    # Registers the Workspace actor bundle: a plain Job named by a hash of its
    # pod template (no Helm hook), so a new image or setting runs it again.
    deployer:
      enabled: true
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-deployer
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      # The durable-actors storage.bucket (written through Workload Identity).
      artifactBucket: ""
      # Where compiled bundles are uploaded: gcs (Workload Identity) or s3 (the
      # default AWS chain, e.g. EKS Pod Identity on the deployer ServiceAccount;
      # pairs with durable-actors storage.provider=s3).
      artifactStore:
        driver: gcs
        s3:
          region: ""
          endpoint: ""
          forcePathStyle: false
      backoffLimit: 3
      # Upper bound on the whole Job (all retries), so a hung deploy fails.
      activeDeadlineSeconds: 3600
      serviceAccount:
        annotations: {}
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits: { memory: 1Gi }
    # Secrets in the durable-actors SANDBOX namespace, labelled
    # terse.ai/customer-secret=true, whose keys become actor env
    # (DURABLE_ACTORS_SECRET_REFS): RELAYCAST_PUBLIC_URL (= baseUrl),
    # RELAYCAST_FILE_SIGNING_SECRET, RELAYCAST_INTERNAL_SECRET and optional
    # engine settings. Operator-provided; the chart never renders secret values.
    actorEnvSecrets: [relaycast-actor-env]
    # Key in existingSecret for RELAYCAST_FILE_SIGNING_SECRET (same value as
    # the actor env secret's).
    fileSigningSecretKey: file-signing-secret
    # Where /_relayfiles bytes live. local needs persistence.* and one replica.
    fileStore:
      driver: gcs
      bucket: ""
      prefix: ""
      dir: /data/files
      s3:
        region: us-east-1
        endpoint: ""
        forcePathStyle: false
        # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY; empty uses
        # the pod's ambient identity.
        existingSecret: ""
    maxUploadBytes: 67108864
    shutdownGraceMs: 10000
    logFormat: json
    # kind/CI only: a `durable-actors dev` sidecar in the gateway pod running
    # the Workspace actor (image: durable-actors TypeScript runtime + the
    # relaycast actor project). Actors inherit the sidecar's env, so the
    # sidecar gets RELAYCAST_PUBLIC_URL/FILE_SIGNING/INTERNAL directly. One
    # replica, no deployer; never for production.
    devRuntime:
      enabled: false
      acknowledgeNonProduction: false
      # Local-only actor state. Empty keeps the disposable CI emptyDir.
      # Provision this RWO claim separately before using a persistent Kind fixture.
      existingClaim: ""
      image:
        repository: ghcr.io/agentworkforce/relaycast-actors-dev
        digest: ""
        tag: ""
        pullPolicy: IfNotPresent
      port: 7100
      # Key in existingSecret holding the dev runtime's DURABLE_ACTORS_SECRET.
      secretKey: durable-actors-dev-secret
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { memory: 2Gi }

# REQUIRED. Relaycast embeds this origin in signed file URLs and A2A cards.
# By default it must be an HTTPS origin with public, multi-label DNS, without a
# path. For a cluster-internal deployment set allowInsecureBaseUrl=true and use
# the Service name, e.g. http://relaycast.relaycast.svc:8787.
baseUrl: ""

# Accept an http:// baseUrl whose host is loopback or private (RFC 1918, ULA,
# *.svc, *.svc.cluster.local, single-label service names, ...). The image
# refuses public hosts over http. Not allowed together with ingress.enabled.
allowInsecureBaseUrl: false
# With allowInsecureBaseUrl: extra private DNS suffixes for a custom
# clusterDomain (RELAYCAST_PRIVATE_DNS_SUFFIXES), e.g. [".svc.corp"].
privateDnsSuffixes: []
# With allowInsecureBaseUrl: exact private hosts (RELAYCAST_INSECURE_BASE_URL_HOSTS),
# e.g. ["relaycast.relaycast"] for a <svc>.<ns> short name.
insecureBaseUrlHosts: []

# REQUIRED. Name of an existing Secret in the release namespace. The chart
# never renders a secret value; the keys below are mounted read-only as files
# under /run/secrets/relaycast and passed to the engine as *_FILE paths.
existingSecret: ""
secretKeys:
  # RELAYCAST_INTERNAL_SECRET_FILE: bearer secret (>= 32 characters) for the
  # in-cluster /internal admin API, used to create the first workspace.
  internalSecret: internal-secret
  # RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET_FILE: stable derivation secret for
  # keyed workspace-create retries. Keep it stable across upgrades.
  bootstrapSecret: workspace-bootstrap-secret
  # RELAYCAST_CREDENTIAL_KEYRING_FILE (optional): local ar_ credential tag
  # keyring. Whenever it is mounted it takes precedence over the remote
  # tagger below; required with credentials.authority=self.
  credentialKeyring: ""
  # RELAYCAST_RELAYAUTH_TOKEN_FILE (optional): bearer token Relaycast
  # presents to RelayAuth's remote CredentialTagger. Required with
  # credentials.authority=relayauth and refused without
  # credentials.relayauth.url.
  relayauthToken: ""
  # runtime.backend=durable-actors only (ignored with sqlite, which reads
  # bootstrapSecret above). RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET for the
  # gateway, passed as an env var from this existingSecret key. Empty: a keyed
  # POST /v1/workspaces or /internal/workspaces (Idempotency-Key) answers 503
  # workspace_create_idempotency_unavailable. Set: keyed creates land on an id
  # derived from it and replay (201, then 200). The SAME BYTES must be in the
  # actor env Secret (runtime.durableActors.actorEnvSecrets, e.g.
  # relaycast-actor-env) as RELAYCAST_WORKSPACE_BOOTSTRAP_SECRET; the chart
  # cannot check that Secret. Store it without a trailing newline in both.
  # Keep it stable: changing it re-derives every keyed id.
  workspaceBootstrapSecret: ""
  # runtime.backend=postgres only. Each key holds a full URL:
  # postgres://<role>:<pw>@<host>:5432/<db>?sslmode=verify-full.
  # relaycast_owner URL, mounted only into the migration Job.
  databaseOwnerUrl: database-owner-url
  # relaycast_runtime URL, mounted only into the server.
  databaseRuntimeUrl: database-runtime-url

# REQUIRED with runtime.backend=postgres, refused otherwise: the CA bundle that
# signs the PostgreSQL server certificate. The PEM at key in the named existing
# ConfigMap or Secret (set exactly one) is mounted at /etc/postgres-ca/ca.crt
# and NODE_EXTRA_CA_CERTS points at it. Read at process start, so rotating it
# needs a pod restart.
postgresCa:
  enabled: false
  configMap: ""
  secret: ""
  key: ca.crt

# Workspace credential format and authority. The default issues and verifies
# legacy credentials locally. format=ar requires an authority:
#   authority=relayauth (model B): RelayAuth owns the ar_ tag keyring and
#     pushes ar_ws_ workspace keys into Relaycast; Relaycast verifies ar_ tags
#     through RelayAuth's remote CredentialTagger (RELAYCAST_RELAYAUTH_URL +
#     RELAYCAST_RELAYAUTH_TOKEN_FILE).
#   authority=self: Relaycast verifies ar_ tags against the local keyring
#     mounted via secretKeys.credentialKeyring.
# ar_ custody requires a >=12.3.x engine image. The pinned default (engine
# 12.7.0) satisfies it; no image.digest override is needed.
credentials:
  format: legacy
  authority: ""
  relayauth:
    url: ""

# Anonymous POST /v1/workspaces. Off by default: workspaces are created through
# the internal admin API (see the README's first-run section). Turning it on
# lets any caller that can reach the Service allocate workspaces, so it is
# refused together with ingress.enabled.
publicWorkspaceCreate: false

# Require bootstrap-secret proof (X-Workspace-Bootstrap-Secret) for anonymous
# keyed creates (RELAYCAST_WORKSPACE_BOOTSTRAP_PROOF_REQUIRED): a missing or
# wrong proof is refused 401 workspace_create_bootstrap_secret_invalid.
# Unkeyed creates and keyed POST /internal/workspaces never ask for proof.
# With runtime.backend=durable-actors it is rendered on the gateway as "true"
# or "false", requires secretKeys.workspaceBootstrapSecret when true, and the
# actor env Secret must carry the same RELAYCAST_WORKSPACE_BOOTSTRAP_PROOF_REQUIRED
# value. Only anonymous POST /v1/workspaces is affected, which needs
# publicWorkspaceCreate=true (never with an edge).
bootstrapProofRequired: false

retention:
  # Empty keeps messages forever. Positive values set
  # RELAYCAST_MESSAGE_TTL_DAYS; zero and negative values are rejected.
  messageTtlDays: null

mailbox:
  # Empty values use Relaycast defaults.
  ttlMs: null
  depthCap: null

service:
  # ClusterIP only. Expose Relaycast publicly through ingress below, which
  # blocks the admin and workspace-create paths at the edge.
  type: ClusterIP
  port: 8787
  annotations: {}
  # GKE: name of a BackendConfig in this namespace (e.g. the agent-relay
  # umbrella's <gkeIngress.name>-cast); the chart renders the
  # cloud.google.com/backend-config annotation ({"default": "<name>"}) from
  # it. Its timeoutSec keeps WebSockets open past GCE's 30 s default.
  backendConfig: ""

# Optional public edge. Requires publicWorkspaceCreate=false and an HTTPS
# baseUrl whose host is listed in hosts. Every host routes Prefix "/" to
# Relaycast except two paths, which are routed to a Service with no endpoints
# so the controller answers 503 and the request never reaches the engine:
#   Prefix /internal        (admin API)
#   Exact  /v1/workspaces   (anonymous workspace creation)
# cert-manager: set annotations (e.g. cert-manager.io/cluster-issuer) and a
# tls entry with a secretName; cert-manager creates and renews that Secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt
  hosts: []
  # - relay.example.com
  # Required unless externalTls: the Ingress must serve HTTPS itself.
  tls: []
  # - secretName: relay-example-com-tls
  #   hosts: [relay.example.com]
  # Set true only when a load balancer in front of the controller terminates
  # TLS for these hosts (then tls may stay empty).
  externalTls: false

persistence:
  # runtime.backend=durable-actors only: keep rendering the data claim of the
  # PostgreSQL/SQLite backend this release moved from (its files and the
  # migration export live there). Set by the move to durable-actors
  # (docs/relaycast-postgres-to-actors-migration.md) and kept until its
  # clean-up, so a helm rollback finds the claim it created unchanged.
  retainForMigration: false
  existingClaim: ""
  storageClass: ""
  # ReadWriteOnce is required when backup.enabled: the backup pod is scheduled
  # onto the Relaycast pod's node and mounts the same claim.
  accessMode: ReadWriteOnce
  # Availability zone of the data claim's volume (topology.kubernetes.io/zone).
  # Set, the pod requires a node in that zone, so a reschedule (node drain,
  # node loss) never waits on a node elsewhere that cannot attach the volume.
  # A drain only stays short with at least two schedulable nodes in that zone;
  # losing the zone is an outage until it returns (README "Node drains").
  # Leave empty to rely on the volume's own node affinity. Not combinable with
  # affinity.nodeAffinity.
  zone: ""
  size: 10Gi
  annotations:
    helm.sh/resource-policy: keep

# Scheduled online backups of the SQLite database (SQLite backup API, safe
# while the engine runs) and the uploaded-file directory to a second PVC.
# See the README for the restore procedure.
backup:
  enabled: false
  schedule: "17 3 * * *"
  # Number of backups kept on the backup volume; older ones are pruned.
  keep: 7
  existingClaim: ""
  storageClass: ""
  size: 20Gi
  annotations:
    helm.sh/resource-policy: keep
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# "split": the image serves /health/live (process) and /health/ready (database
# answers within 2 s), relaycast#667; startup and liveness use /health/live and
# readiness /health/ready, so a database failover takes the pod out of the
# Service without restarting it. "legacy": every probe uses /health as set
# below. Set split only with an image that has the endpoints (relaycast main
# 810f48ce or later); an older one answers 404 and never becomes ready.
healthProbes: legacy

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 1

livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 20
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5

networkPolicy:
  enabled: true
  # Empty allows callers only from the release namespace. With ingress enabled,
  # list the ingress controller's namespace/pods here (required).
  ingressFrom: []

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Additional non-secret environment variables. Names managed by the structured
# values above are reserved and rejected here.
extraEnv: []

# Moving a runtime.backend=postgres release to durable-actors with every row
# and file (docs/relaycast-postgres-to-actors-migration.md in
# AgentWorkforce/infra). Off: renders nothing. The upgrader
# (agent-relay-upgrade.sh --relaycast-actors cutover) renders one step at a
# time with `helm template --show-only templates/migration-job.yaml` and
# applies it itself; never set these in a release's values.
migration:
  enabled: false
  # preflight | export (on the postgres release) | files | import | verify |
  # open (after the cutover to durable-actors; open is the go-live).
  step: ""
  # 8-64 URL-safe characters; names the export directory on the data claim
  # (/data/migration/<runId>) and the import run.
  runId: ""
  # preflight: epoch seconds when credentials.format=ar was enabled; principals
  # created before it and never upgraded are reported as legacy.
  arSince: ""
  # preflight: report principals still on legacy credentials without failing
  # (their holders re-register after the move; their data still moves).
  allowLegacy: false
  activeDeadlineSeconds: 21600
