{{- include "sessions-pipeline-worker.validate" . -}}
{{- $comp := index .Values.components "coordination-advisor" | default dict -}}
{{- if and $comp.enabled .Values.coordinationAdvisor.egress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessions-pipeline-worker.componentName" (dict "context" . "component" "coordination-advisor") }}-egress
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "sessions-pipeline-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "sessions-pipeline-worker.componentSelectorLabels" (dict "context" . "component" "coordination-advisor") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to: {{ toYaml .Values.coordinationAdvisor.egress.to | nindent 8 }}
      ports: {{ toYaml .Values.coordinationAdvisor.egress.ports | nindent 8 }}
{{- end }}
