{{- include "sessions-pipeline-worker.validate" . -}}
{{- if .Values.nativeBrief.openaiEgress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sessions-pipeline-worker.fullname" . }}-brief-openai
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "sessions-pipeline-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{ include "sessions-pipeline-worker.componentSelectorLabels" (dict "context" . "component" "session-brief") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to: {{ toYaml .Values.nativeBrief.openaiEgress.to | nindent 8 }}
      ports: [{ protocol: TCP, port: 443 }]
{{- end }}
