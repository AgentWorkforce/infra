{{- include "sessions-pipeline-worker.validate" . -}}
{{- range $component, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sessions-pipeline-worker.componentName" (dict "context" $ "component" $component) }}
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    {{- include "sessions-pipeline-worker.componentLabels" (dict "context" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  {{- if eq $component "hoopdb-indexer" }}
  # Never two indexers at once: the reconcile loop is not leader-elected.
  strategy:
    type: Recreate
  {{- else if and (eq $component "session-brief") $.Values.nativeBrief.enabled }}
  # Never overlap native model workers during an upgrade.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "sessions-pipeline-worker.componentSelectorLabels" (dict "context" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sessions-pipeline-worker.componentSelectorLabels" (dict "context" $ "component" $component) | nindent 8 }}
        {{- if and (eq $component "session-brief") $.Values.nativeBrief.analytics.enabled }}
        agentworkforce.dev/analytics-producer: "true"
        {{- end }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- include "sessions-pipeline-worker.podSpecCommon" (dict "context" $ "component" $component) | nindent 6 }}
      {{- if and (eq $component "session-brief") $.Values.nativeBrief.enabled }}
      initContainers:
        - name: verify-native-brief-postgres
          image: {{ include "sessions-pipeline-worker.nativeBriefImage" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["bun", "-e"]
          args:
            - {{ include "sessions-pipeline-worker.nativeBriefPreflight" $ | quote }}
          env:
            {{- include "sessions-pipeline-worker.hoopdbUrlEnv" (dict "root" $ "migrate" false) | nindent 12 }}
            - { name: NATIVE_BRIEF_CA_FILE, value: /etc/postgres-ca/ca.crt }
            - { name: NATIVE_BRIEF_CA_SOURCE, value: /var/run/native-brief-ca-source/ca.crt }
            - { name: NATIVE_BRIEF_CA_SHA256, value: {{ $.Values.postgresCa.sha256 | quote }} }
          securityContext: {{ toYaml $.Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: postgres-ca, mountPath: /var/run/native-brief-ca-source, readOnly: true }
            - { name: native-brief-verified-ca, mountPath: /etc/postgres-ca }
      {{- end }}
      containers:
        - name: {{ include "sessions-pipeline-worker.publicComponent" (dict "context" $ "component" $component) }}
          {{- if and (eq $component "session-brief") $.Values.nativeBrief.enabled }}
          image: {{ include "sessions-pipeline-worker.nativeBriefImage" $ | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - {{ include "sessions-pipeline-worker.nativeBriefStart" $ | quote }}
            - native-brief-start
            - /entrypoint.sh
          {{- else }}
          image: {{ include "sessions-pipeline-worker.image" $ | quote }}
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "sessions-pipeline-worker.env" (dict "context" $ "service" $component) | nindent 12 }}
            {{- if ($.Values.postgresCa | default dict).enabled }}
            - { name: NODE_EXTRA_CA_CERTS, value: /etc/postgres-ca/ca.crt }
            {{- end }}
            {{- with $.Values.workerHealth }}
            {{- if .enabled }}
            - name: WORKER_HEALTH_PORT
              value: {{ .port | quote }}
            - name: WORKER_UNHEALTHY_AFTER_FAILURES
              value: {{ .unhealthyAfterFailures | quote }}
            - name: WORKER_MAX_TICK_AGE_MS
              value: {{ .maxTickAgeMs | quote }}
            {{- end }}
            {{- end }}
            {{- if and (eq $component "session-brief") $.Values.nativeBrief.enabled }}
            {{- include "sessions-pipeline-worker.nativeBriefEnv" $ | nindent 12 }}
            {{- end }}
            {{- with $c.env }}
            {{- include "sessions-pipeline-worker.renderEnv" . | nindent 12 }}
            {{- end }}
          {{- with $.Values.workerHealth }}
          {{- if .enabled }}
          ports:
            - name: health
              containerPort: {{ .port }}
              protocol: TCP
          {{- with .startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $c.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component "bob-costas" }}
            - name: summary-master-keys
              mountPath: {{ $.Values.summaryEncryption.mountPath }}
              readOnly: true
            {{- end }}
            {{- if ($.Values.postgresCa | default dict).enabled }}
            {{- if and (eq $component "session-brief") $.Values.nativeBrief.enabled }}
            - { name: native-brief-verified-ca, mountPath: /etc/postgres-ca, readOnly: true }
            {{- if and $.Values.nativeBrief.analytics.enabled $.Values.nativeBrief.analytics.caConfigMap }}
            - { name: brief-analytics-ca, mountPath: /etc/brief-analytics-ca, readOnly: true }
            {{- end }}
            {{- else }}
            - { name: postgres-ca, mountPath: /etc/postgres-ca, readOnly: true }
            {{- end }}
            {{- end }}
{{- end }}
{{- end }}
