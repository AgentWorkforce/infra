## Default values for sessions-pipeline-worker.
## Secrets are NEVER set here: point existingSecret at a Secret you create.

global:
  # Registry prefixed to relative image.repository values. The default image
  # repository is private and requires imagePullSecrets outside hosted EKS.
  imageRegistry: ghcr.io
  otel:
    # OTLP/HTTP endpoint; rendered as OTEL_EXPORTER_OTLP_ENDPOINT. Empty = unset.
    endpoint: ""
  # Inherited from the sessions-pipeline umbrella. Direct installs may set it
  # here. Empty preserves the legacy runtime selection and reader ceiling.
  scrubEngine:
    engine: ""
    required: ""
    readerMaxRuleset: ""

# One image for every component; SERVICE= selects the entry point.
image:
  repository: agentworkforce/96bulls-services
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # sha256 digest; when set it wins over tag. Default: the services image
  # built from sessions-pipeline main 7d7229b (#124 + #125 + #139 + #137; GHCR publish-image run
  # 41375745173; migration generation eff8b3be...259b). This hosted
  # service package is private: add imagePullSecrets for direct installs.
  # When overriding repository or tag, clear digest or set a matching digest.
  digest: "sha256:6f22ea17dff336e1431664542759fd27958649388b90a0b2f0881883caa7c6b2"
  pullPolicy: IfNotPresent

# Optional; passed to every workload and Job.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Only for retaining an already installed release's workload names/selectors.
# New installs use the three descriptive session-* workload names. This does
# not migrate a running release or prove data survival across a rename.
legacyResourceNames: false
# Upgrades must retain legacyResourceNames or explicitly confirm a drained
# workload cutover. Recreate does not coordinate differently named Deployments.
# Persist true only after stopping the old indexer, or for an already-new release.
acknowledgeWorkloadRename: false

# Secret containing Locker credentials in secret mode and, unless
# hoopdb.existingSecret is set, HOOPDB_URL. May be empty in podIdentity mode
# when HoopDb uses its own Secret.
existingSecret: ""
secretKeys:
  hoopdbUrl: HOOPDB_URL
  lockerAccessKeyId: LOCKER_ACCESS_KEY_ID
  lockerSecretAccessKey: LOCKER_SECRET_ACCESS_KEY

# Bob Costas encrypts summary objects before they reach the Locker. The value
# is never accepted in values.yaml: it is read from a Kubernetes Secret and is
# projected as a read-only file into Bob Costas only. Empty existingSecret
# falls back to the shared existingSecret above; set it explicitly when using
# pod identity without a shared application Secret.
summaryEncryption:
  existingSecret: ""
  key: SUMMARY_MASTER_KEYS
  mountPath: /var/run/secrets/sessions-pipeline
  fileName: summary-master-keys

# Non-secret environment shared by every component (names are the services'
# env contract; do not rename).
locker:
  # s3 (default): S3-compatible store (MinIO, AWS S3). gcs: native Google Cloud
  # Storage through GKE Workload Identity; renders LOCKER_PROVIDER=gcs and
  # PIPELINE_RAW_PROVIDER=gcs and requires credentials.mode=podIdentity and an
  # empty (or https://storage.googleapis.com) endpoint. The services refuse
  # HMAC keys on GCS and the S3 client against storage.googleapis.com, so
  # "GCS as S3 with HMAC keys" is not supported. gcs also arms the services'
  # GCS data-path readiness check: extraEnv must carry
  # CLOUD_SQL_CONNECTION_NAME, REDIS_HOST, REDIS_PORT, REDIS_AUTH_ENABLED
  # ("false"), REDIS_TRANSIT_ENCRYPTION ("SERVER_AUTHENTICATION"),
  # REDIS_TLS_CA_PEM, PUBSUB_TOPIC and PUBSUB_SUBSCRIPTION.
  provider: s3
  # Required in secret mode, e.g. http://minio:9000. In podIdentity mode,
  # leave empty to use the provider's native endpoint (S3: for locker.region).
  endpoint: ""
  bucket: locker
  region: us-east-1
  credentials:
    # secret reads LOCKER_* keys from existingSecret; podIdentity omits both
    # static credential environment variables so the AWS SDK can use its
    # workload identity credential chain.
    mode: secret
tenant:
  orgId: ""           # REQUIRED
  workspaceId: default
deployment:
  name: selfhost      # DEPLOYMENT
  id: ""              # DEPLOYMENT_ID; defaults to the release namespace/name
environment: production
# ALLOW_IN_CLUSTER_HTTP for every component. false (default): the validated
# destination URLs (RelayAuth, Cloud, ingest, JWKS, model endpoint) must be
# https (or loopback). true allows plain http only to in-cluster Service FQDNs
# (<svc>.<ns>.svc[.cluster.local]), never public hosts, IPs or short names.
# LOCKER_ENDPOINT (the bundled MinIO's http://locker:9000) and the OTLP
# endpoint are outside this policy (sessions-pipeline README, runtime
# destinations), so the bundled Locker works with false.
allowInClusterHttp: false
# Extra env for every component: [{ name: X, value: y }].
extraEnv: []

# OPTIONAL: a CA bundle that lets node-pg verify the Postgres server certificate
# when the database uses a private CA, such as Amazon RDS. Off by default. When
# on, the PEM bundle at key in the named existing ConfigMap or Secret (set
# exactly one) is mounted at /etc/postgres-ca/ca.crt and NODE_EXTRA_CA_CERTS
# points at it. It adds to the roots every outbound TLS client in these
# processes trusts; it does not replace them. Use sslmode=verify-full in the
# Postgres URLs, and do not pair sslmode=require with uselibpqcompat=true, which
# skips verification. The bundle is read at process start, so rotating it needs
# a pod restart.
postgresCa:
  enabled: false
  configMap: ""
  secret: ""
  key: ca.crt
  # Required by nativeBrief; verified before its process starts.
  sha256: ""

# OPTIONAL: read HOOPDB_URL from a different Secret than existingSecret, e.g.
# the "<cluster>-app" Secret CloudNativePG generates (key "uri"). Empty =
# existingSecret / secretKeys.hoopdbUrl.
hoopdb:
  existingSecret: ""
  key: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
automountServiceAccountToken: false

# HoopDb migrations: a plain Job (no Helm hook). Its name carries a hash of the
# image and this block, so a new image creates a new Job and the old one is
# pruned. There is deliberately no ttlSecondsAfterFinished: Alchemy treats a
# deleted object as drift and would recreate (re-run) the Job.
migrations:
  enabled: true
  # Optional migration-owner connection. When set, only the migrate Job reads
  # this Secret/key; every long-running workload keeps using hoopdb above.
  # Set both fields together. Empty preserves the historical shared URL.
  hoopdb:
    existingSecret: ""
    key: ""
  # The migrator's database profile (sessions-pipeline src/hoopdb/migrate.ts
  # migrationProfile(), sessions-pipeline #99). Each value is rendered at most once,
  # into the migrate container only. Do not set these via extraEnv or component
  # env; the render refuses that. Where the migrator has no default, neither does
  # the chart: an unset required value fails the render.
  # REQUIRED. HOOPDB_DB_MODE: local | selfhosted (CNPG, any
  # operator-controlled plain Postgres with a superuser) | cloudsql (Google Cloud
  # SQL) | rds (Amazon RDS for PostgreSQL 16+, not Aurora) | supabase.
  # Also rendered into every service (not only migrate), because their live role
  # gate needs it. Set it even with migrations.enabled=false when the database is
  # migrated elsewhere: on supabase the gate fails closed without it.
  databaseMode: ""
  # HOOPDB_RDS_LAYOUT (rds only): master-owner keeps the legacy RDS
  # administrator-owned layout; separate-database selects the dedicated owner
  # produced by the same disposable-creator graph technique. Infra does not
  # claim the fixed-name rds-activation/v1 contract. Empty preserves the migrator default
  # (master-owner). This value reaches only the migrate Job.
  rdsLayout: ""
  # HOOPDB_ROLE_BOOTSTRAP (optional): true/false; the migrator defaults it to the
  # shim choice. Refused as true in supabase mode. Cloud SQL sets false (no
  # customer superuser; the operator provisions the search Worker role).
  roleBootstrap: null
  # HOOPDB_SUPABASE_SHIM: true/false. Required in local, selfhosted and cloudsql
  # (rds: must be unset or false; Cloud SQL: false; its operator bootstrap creates the compatibility roles). In
  # supabase mode it must be unset or false and is rendered "false". The
  # migrator also refuses the shim and the role bootstrap there.
  supabaseShim: null
  # REQUIRED. HOOPDB_RUNTIME_ROLE: the role the services connect as. Outside
  # local mode it must be a dedicated role, not the migration owner.
  runtimeRole: ""
  # HOOPDB_RUNTIME_ROLE_LOGIN: true/false. Required outside local mode; rendered
  # only when set.
  runtimeRoleLogin: null
  # HOOPDB_RUNTIME_WORKLOAD_ROLE (optional): the one role allowed to be a member
  # of the runtime role.
  runtimeWorkloadRole: ""
  # HOOPDB_FUNCTION_BOUNDARY_MODE: global-default-revoke or, in supabase mode
  # only, event-trigger (sessions-pipeline #125); the chart refuses event-trigger
  # elsewhere, as the migrator does. Required in selfhosted, cloudsql and rds mode
  # (global-default-revoke): the database is dedicated to HoopDb, and the
  # privileged supabase/bootstrap/hoopdb_function_default_revoke.sql installs
  # the control. Optional in supabase mode, where the operator installs
  # supabase/bootstrap/hoopdb_sessions_function_boundary_supabase.sql for
  # event-trigger; unset, the migrator's function-boundary gate fails closed.
  # The old name, HOOPDB_FUNCTION_BOUNDARY_APPROVED, is refused.
  functionBoundaryMode: ""
  # HOOPDB_ALLOW_BLOCKING_INDEX_BUILD (default false): lets the adopt-or-create
  # index steps (20261105044020, 044040, 047000, 058000) run a blocking CREATE
  # INDEX on a populated table instead of refusing (SQLSTATE 55000). The build
  # holds a SHARE lock on each table: reads continue, writes wait. Rendered into
  # the migrate container only, and only when true. Set it for one upgrade of a
  # small database (scripts/selfhost/agent-relay-upgrade.sh decides this from a
  # row census); prebuild CONCURRENTLY instead on a large one (the packet named
  # in the refusal).
  allowBlockingIndexBuild: false
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  # Opt-in TTL for plain `helm install` users only. Leave 0 under Alchemy.
  ttlSecondsAfterFinished: 0
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  # Orders the migrate Job after the privileged bootstraps without Helm hooks
  # (Alchemy renders --no-hooks). An init container polls HoopDb (HOOPDB_URL)
  # until `role` and, outside local mode, runtimeRole exist. With
  # functionDefault, it also waits until the migration owner's global function
  # default is exactly {<owner>:EXECUTE}, the state the default-revoke bootstrap
  # leaves. The migrator then verifies all of it itself. Refused in supabase
  # mode: there the roles are operator steps, and the migrator refuses on its own.
  # Needs an image with sh and psql, by digest. Bounded by activeDeadlineSeconds.
  waitForRole:
    enabled: false
    role: session_directory_search_worker
    functionDefault: false
    # Full reference with @sha256 digest, e.g. the CNPG Postgres image.
    image: ""
    intervalSeconds: 5
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# Creates the Locker bucket (idempotent). Replaces upstream MinIO's
# post-install bucket hook, which never runs under --no-hooks.
lockerInit:
  enabled: true
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 0
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

# Worker health server (each stage worker; no Service, probes only).
#   /readyz  200 once HoopDb answers and the migration ledger is complete;
#            503 again after `unhealthyAfterFailures` consecutive failed
#            HoopDb checks.
#   /healthz 200 ("starting") during a long migration, so liveness never kills
#            a worker for waiting; 503 after `unhealthyAfterFailures` failed
#            checks or a work loop stalled longer than `maxTickAgeMs`.
# A liveness restart re-reads env, so a rotated HOOPDB_URL Secret is picked up.
workerHealth:
  enabled: true
  port: 8081
  unhealthyAfterFailures: 5
  maxTickAgeMs: 120000
  startupProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 15
    # ~1h: a slow migration must never restart a worker.
    failureThreshold: 240
  readinessProbe:
    httpGet: { path: /readyz, port: health }
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  livenessProbe:
    httpGet: { path: /healthz, port: health }
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

# Stage workers. Each blocks at start until HoopDb answers and the migration
# ledger is complete, so apply order does not matter.
# Explicit native canonical model briefs. Off until a reviewed image containing
# the native input source and matching schema generation is selected. A key is
# referenced only by session-brief, never migration Jobs or other stage workers.
nativeBrief:
  enabled: false
  # Null preserves legacy reads; explicit 8/9/10 opts into strict checks;
  # it neither selects a writer ruleset nor enables the native worker.
  readerMaxRuleset: null
  image:
    repository: ""
    digest: ""
  workspaceIds: []
  keyPrefix: 96bulls
  model: gpt-5.6-luna
  sweepSeconds: 60
  batch: 1
  # Push-based briefs (T130 producer contract v1, sha256 f01914a6...). SESSION_BRIEF_ENABLED stays the activation control. A committed
  # manifest append and the session end both trigger a brief, coalesced so no append waits more than
  # maxDelaySeconds from the oldest uncovered one, even under continuous writes. idleSeconds keeps the idle
  # trigger; sweepSeconds above stays as recovery on its own clock, outside the 60 s target. Off: today's sweep-only behaviour.
  push:
    enabled: false
    maxDelaySeconds: 8
    idleSeconds: 600
  # Daily model-call caps per UTC day. They bound model spend: each brief is
  # one model call billed to openaiSecret's key. globalDailyCap counts every
  # brief across the whole install; sessionDailyCap counts re-briefs of one
  # session as it grows. Past a cap a brief is recorded rate_limited
  # (session_brief_global_capped / the session cap) and the dashboard shows
  # "No summary yet" until the next UTC day. Size globalDailyCap above the
  # install's sessions per day times the re-briefs each typically gets, with
  # headroom, then multiply by the per-call cost of model to bound spend.
  # Positive integers up to 10000000 (global) and 10000 (per session).
  globalDailyCap: 2000
  sessionDailyCap: 10
  openaiSecret:
    name: ""
    key: OPENAI_API_KEY
  # OpenAI-compatible Responses API base for the session-brief worker, rendered
  # as OPENAI_BASE_URL; calls go to <baseUrl>/responses. Empty keeps the hosted
  # OpenAI default. Must be https, or http only to a Kubernetes Service name
  # (<svc>.<ns>.svc or <svc>.<ns>.svc.cluster.local) with in-cluster http
  # allowed below. No credentials, query or fragment. openaiSecret supplies the
  # key this endpoint expects and model the id it serves.
  baseUrl: ""
  # true renders ALLOW_IN_CLUSTER_HTTP="true" on the session-brief container
  # only. The top-level allowInClusterHttp applies to every worker and also
  # admits an http baseUrl; either one turns it on for this container.
  allowInClusterHttp: false
  # Adds ONLY a session-brief policy on TCP443. Kubernetes NetworkPolicy has no
  # FQDN matcher: supply actual provider CIDRs or an approved egress gateway.
  # Existing egress policies are additive and must also be reviewed.
  # With a custom baseUrl, `to` must match that endpoint instead of the provider.
  # For an in-cluster gateway use a podSelector plus namespaceSelector for its
  # pods: an ipBlock does not match a Service ClusterIP. NetworkPolicy checks the
  # pod's port, not the Service port, so a gateway pod listening on anything
  # other than 443 also needs an operator-managed egress policy selecting the
  # session-brief pods for that port.
  openaiEgress:
    enabled: false
    to: []
  # Bind the brief worker to the self-host telemetry collector using its own
  # producer registration. The optional public CA is scoped to collector HTTPS.
  analytics:
    enabled: false
    deploymentId: ""
    collectorUrl: ""
    existingSecret: ""
    tokenKey: token
    caConfigMap: ""
    caKey: ca.crt
    # Required when chart-managed egress selects the brief pod. Use the
    # collector's pod port and its pod selector, optionally across namespaces.
    egress:
      port: 8443
      to: []

components:
  session-brief:
    enabled: false
    fullnameOverride: ""
    replicas: 1
    env: []
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 512Mi }
  hoopdb-indexer:
    # Optional explicit Deployment identity; otherwise fullname-scoped.
    fullnameOverride: ""
    enabled: true
    # Keep at 1: the manifest reconcile is not leader-elected yet.
    replicas: 1
    env: []
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  referee:
    # Optional explicit Deployment identity; otherwise fullname-scoped.
    fullnameOverride: ""
    enabled: true
    replicas: 1
    env: []
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 384Mi }
  # SERVICE=coordination-advisor (relayhistory-pipeline src/coordination-advisor,
  # docs/coordination-live-advisories.md). Off by default; see
  # coordinationAdvisor below for its settings. Keep at 1: its cooldown and
  # hourly cap are not shared across replicas.
  coordination-advisor:
    fullnameOverride: ""
    enabled: false
    replicas: 1
    env: []
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 512Mi }
  bob-costas:
    # Optional explicit Deployment identity; otherwise fullname-scoped.
    fullnameOverride: ""
    enabled: true
    replicas: 1
    env:
      - name: BOB_COSTAS_MODEL
        value: "off"
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 384Mi }

# Settings for components.coordination-advisor (rendered only when that
# component is enabled). Mirrors relayhistory-pipeline docs/selfhost-composition.md
# (coordination-advisor row) and docs/coordination-live-advisories.md.
coordinationAdvisor:
  # COORDINATION_ADVISOR_ENABLED. The Deployment renders with the component;
  # run=false keeps it dormant (green probes, scans nothing) so it can ship
  # first and be switched on separately.
  run: false
  # READ_API_DIRECTORY_WORKSPACES: workspace ids to scan, or ["*"] for all.
  # Empty scans no workspace. Use the same allowlist as the read API.
  workspaces: []
  # COORDINATION_ADVISOR_FACTS_BACKEND: clickhouse (the image default) or
  # postgres (needs migration 20261105062070; with it the cooldown and cap
  # also survive a restart).
  factsBackend: clickhouse
  # Optional; empty keeps the image defaults (120 s, 21600 s, 3).
  intervalSeconds: null
  pairCooldownSeconds: null
  sessionHourlyCap: null
  # SESSION_PIPELINE_SECRET_JSON, read only with factsBackend=clickhouse.
  clickhouseSecret:
    name: ""
    key: SESSION_PIPELINE_SECRET_JSON
  # HIGH advisories as Relay DMs. Off by default.
  relayDm:
    enabled: false
    # COORDINATION_ADVISOR_RELAY_URL: https (http only on loopback), no
    # credentials, query or fragment.
    url: ""
    # COORDINATION_ADVISOR_RELAY_TOKEN.
    tokenSecret:
      name: ""
      key: COORDINATION_ADVISOR_RELAY_TOKEN
  # Adds ONLY an egress policy for this pod (ClickHouse and/or the relay URL).
  # NetworkPolicy has no FQDN matcher: list CIDRs or an approved gateway. It
  # needs networkPolicy.enabled; with networkPolicy on, run=true with the
  # clickhouse backend or relayDm needs it.
  egress:
    enabled: false
    to: []
    ports:
      - { protocol: TCP, port: 443 }

# SERVICE=session-analysis: the session-analysis job processor as a pod
# (relayhistory-pipeline docs/session-analysis-runner.md, "Chart values to
# request from infra"). Off by default. It reads canonical evidence from S3
# or an S3-compatible store only (no GCS or Azure Blob): AWS S3 through EKS
# Pod Identity, or the bundled MinIO with static keys (s3Credentials: static).
sessionAnalysis:
  # Whether the Deployment, ServiceAccount and policy render at all.
  enabled: false
  # Optional image for this Deployment only. Leave repository empty to use
  # the shared worker image byte-for-byte. When repository is set, pin either
  # tag or digest (digest wins) so enabling the runner never rolls the existing
  # summary, status or index workers onto an unreviewed services build.
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: ""
  # SESSION_ANALYSIS_ENABLED. run=false ships the pod dormant first.
  run: false
  replicas: 1
  # SESSION_ANALYSIS_TICK_MS (1000..600000) and SESSION_ANALYSIS_BATCH (1..20);
  # null keeps the image defaults (30000, 2).
  tickMs: null
  batch: null
  # SESSION_ANALYSIS_PG_POOL_MAX (1..16); null keeps 4.
  pgPoolMax: null
  # SESSION_ANALYSIS_S3_BUCKET / _REGION: the canonical pipeline bucket and its
  # own region (no AWS_REGION default). Set from private values.
  bucket: ""
  bucketRegion: ""
  # PIPELINE_KEY_PREFIX (bare key root); PIPELINE_ORG_FROM_PREFIX=true is fixed.
  keyPrefix: ""
  # SESSION_ANALYSIS_S3_CREDENTIALS. podIdentity (default): EKS Pod Identity
  # through the dedicated ServiceAccount below. static: the access key id and
  # secret key are read from files mounted from s3KeysSecret (MinIO or any
  # S3-compatible store); no workload identity is used. IRSA is not supported
  # by the runner.
  # static, s3Endpoint, allowInClusterHttp and s3VersioningCheck need a
  # services image that carries the runner's S3-compatible store support
  # (relayhistory-pipeline 9b29a3dd and 745cc671). The services image this
  # chart pins today predates it. On that image, static refuses to start
  # (exit 2, credentials_mode_invalid). s3Endpoint, allowInClusterHttp and
  # s3VersioningCheck are ignored, so with podIdentity the runner would read
  # AWS S3 in bucketRegion instead of the endpoint. Pin a newer image before
  # using them.
  s3Credentials: podIdentity
  # static only, and required there: an EXISTING Secret and the names of its
  # keys holding the access key id and the secret key. The chart never takes
  # the key values. Mounted read-only as files (SESSION_ANALYSIS_S3_ACCESS_KEY_ID_FILE
  # and SESSION_ANALYSIS_S3_SECRET_ACCESS_KEY_FILE); a rotation needs a
  # rollout. Leave name empty with podIdentity (the runner refuses static keys
  # in any other mode).
  s3KeysSecret:
    name: ""
    accessKeyIdKey: LOCKER_ACCESS_KEY_ID
    secretAccessKeyKey: LOCKER_SECRET_ACCESS_KEY
  # SESSION_ANALYSIS_S3_ENDPOINT: the bare origin of an S3-compatible store
  # (scheme, host, optional port; no credentials, path, query or fragment),
  # used path-style and signed for bucketRegion (MinIO's default is us-east-1).
  # Empty (default): AWS S3 in bucketRegion. https always; plain http only to
  # loopback, or to a Kubernetes Service name <svc>.<ns>.svc[.cluster.local]
  # with allowInClusterHttp: true, e.g. the bundled MinIO at
  # http://session-object-storage.<namespace>.svc.cluster.local:9000.
  s3Endpoint: ""
  # ALLOW_IN_CLUSTER_HTTP for this pod only (the chart-wide allowInClusterHttp
  # above does not reach it). Rendered only with s3Endpoint, the only time the
  # runner reads it; true without s3Endpoint is refused.
  allowInClusterHttp: false
  # SESSION_ANALYSIS_S3_VERSIONING_CHECK. "" (default) renders nothing: the
  # runner checks GetBucketVersioning at startup whenever s3Endpoint is set or
  # s3Credentials is static, and refuses an unversioned bucket. "true" forces
  # the check on the AWS default too (its role then needs
  # s3:GetBucketVersioning). There is no way to turn the check off: the
  # runner refuses any other value.
  s3VersioningCheck: ""
  # Mounted read-only; SESSION_ANALYSIS_OPENAI_API_KEY_FILE points at it.
  modelKeySecret:
    name: ""
    key: OPENAI_API_KEY
  # Mounted read-only; SESSION_ANALYSIS_DATABASE_URL_FILE points at it. The
  # HoopDb runtime role with its OWN login: not the migration owner,
  # bulls96_analysis_admit or bulls96_read_api.
  databaseSecret:
    name: ""
    key: SESSION_ANALYSIS_DATABASE_URL
  # SESSION_POSTGRES_TLS_PROFILE: supabase (image default) or custom-ca with a
  # CA ConfigMap and its SHA-256.
  postgresTls:
    profile: ""
    caConfigMap: ""
    caKey: ca.crt
    sha256: ""
  # SUMMARY_DECISION_RECORDS_ENABLED and SESSION_ANALYSIS_CUTOVER_PROOF, passed
  # through when set. SESSION_ANALYSIS_ASSUME_NO_LEGACY_TURNS is never rendered.
  decisionRecords: ""
  cutoverProof: ""
  # Dedicated ServiceAccount, never shared with ingest-edge or the other
  # workers. With podIdentity, the EKS Pod Identity association that holds the
  # S3/KMS grants binds to it. With static it needs no association and no
  # workload identity annotation.
  serviceAccount:
    name: ""
    annotations: {}
  # One 600 s lease plus margin.
  terminationGracePeriodSeconds: 660
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 1Gi }
  # Adds ONLY a model-API egress policy for this pod (the shared worker policy
  # covers DNS, the database, object storage and workload identity). It needs
  # networkPolicy.enabled, and networkPolicy.enabled with run=true needs it.
  # With networkPolicy on and s3Credentials podIdentity, workloadIdentity.to
  # must list the Pod Identity agent (169.254.170.23/32 on EKS) even when
  # locker.credentials.mode=secret, and networkPolicy.objectStorage.to must
  # also cover S3 in bucketRegion, which can differ from the Locker bucket's
  # region. With static keys and an in-cluster MinIO, no workload identity
  # rule is needed: objectStorage.to must select the MinIO pods, with the
  # MinIO API port (9000) in objectStorage.ports.
  modelEgress:
    enabled: false
    to: []

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}

# Network isolation is opt-in for portable installs because the chart cannot
# infer the CIDRs of an external database/object store or a cluster's DNS and
# workload-identity endpoints. When enabled, every destination the worker and
# migration pods need must be listed explicitly; egress is otherwise denied.
# An empty `to` would match every destination, so rendering fails when dns,
# database or objectStorage (plus workloadIdentity in podIdentity mode and
# observability when global.otel.endpoint is set) has no `to` entries. Rules
# with destinations but no ports allow every port to those destinations.
#
# Kubernetes NetworkPolicy has no FQDN matching. For GCS, use customer DNS
# that maps googleapis.com to private.googleapis.com (199.36.153.8/30) or
# restricted.googleapis.com (199.36.153.4/30), then allow that chosen VIP.
# Cloud SQL private-service-access ranges and cluster DNS addresses are
# customer/VPC specific and must never be guessed here.
networkPolicy:
  enabled: false
  dns:
    to: []
    ports:
      - { protocol: UDP, port: 53 }
      - { protocol: TCP, port: 53 }
  database:
    to: []
    ports:
      - { protocol: TCP, port: 5432 }
  objectStorage:
    to: []
    ports:
      - { protocol: TCP, port: 443 }
  # Required in podIdentity mode (locker.credentials.mode, and
  # sessionAnalysis.s3Credentials when sessionAnalysis is enabled; not needed
  # for a static-keys session-analysis pod). GKE Dataplane V1 commonly uses
  # 169.254.169.252/32:988; Dataplane V2 uses 169.254.169.254/32:80.
  # Select the endpoint actually used by the customer cluster.
  workloadIdentity:
    to: []
    ports: []
  # Optional OTLP destination. Required when global.otel.endpoint is nonempty.
  observability:
    to: []
    ports: []

# OPTIONAL: External Secrets Operator (e.g. a 1Password ClusterSecretStore).
# Off by default; customers create existingSecret themselves. When enabled the
# chart renders an ExternalSecret (named after the release) whose target IS
# existingSecret, so workloads are unchanged. Every credential key consumed
# from that target, including summaryEncryption.key when it follows
# existingSecret, must be mapped in data. Remote key names only, never values.
externalSecrets:
  enabled: false
  refreshInterval: 1h
  # Owner: this release owns the target Secret. When sessions-pipeline-worker and
  # alleyoop share one existingSecret, enable ESO in both only if the second
  # uses Merge (or enable it in just one release).
  creationPolicy: Owner
  secretStoreRef:
    kind: ClusterSecretStore
    name: ""
  # Secret key -> remote reference, e.g.
  # HOOPDB_URL: { key: sessions-pipeline-hoopdb, property: url }
  data: {}
